<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Syed Iftikhar Shah">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ironclad Tracker</title>
<meta name="description" content="Operation Ironclad — 12-month functional strength &amp; GPP tracker.">
<meta name="theme-color" content="#141416">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironclad">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  /* ---- self-hosted fonts (work offline) ---- */
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 800; font-display: swap; src: url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/barlow-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/barlow-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/barlow-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-latin-700-normal.woff2) format('woff2'); }

  /* ============ TOKENS ============ */
  /* layout: single-column mobile app shell — fixed header, scrolling body, fixed bottom bar during a session */
  :root {
    --bg: #ECECE6; --surface: #FFFFFF; --surface-2: #E3E3DB; --raised: #FFFFFF;
    --ink: #151517; --ink-soft: #4E4E49; --ink-faint: #82827A;
    --olive: #1A1A1C; --olive-deep: #141416;
    --accent: #F2B33D; --accent-bg: #FBF1D6; --cool: #3E6FA8;
    --rust: #C2461F; --rust-soft: #E0703F;
    --amber: #9A6700;
    --line: #D9D9D0; --line-strong: #B4B4A8;
    --good: #1F6B43; --good-bg: #E2F0E7;
    --warn-bg: #FBE6D6;
    --on-primary: #FFFFFF;
    --on-accent: #F4F2EA; --on-accent-dim: #D6D4CA; --on-accent-soft: #B9B7AC;
    --shadow: 0 1px 2px rgba(20,20,22,.06), 0 6px 18px rgba(20,20,22,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E0E10; --surface: #19191C; --surface-2: #26262A; --raised: #202023;
      --ink: #F4F2EA; --ink-soft: #B2B0A7; --ink-faint: #76756E;
      --olive: #F2B33D; --olive-deep: #0A0A0B;
      --accent: #F2B33D; --accent-bg: #2B2414; --cool: #7FA9DD;
      --rust: #FF7F52; --rust-soft: #FF7F52;
      --amber: #F2B33D;
      --line: #2C2C30; --line-strong: #444449;
      --good: #7FD0A0; --good-bg: #1A2A21;
      --warn-bg: #36241A;
      --on-primary: #141416;
      --on-accent: #F4F2EA; --on-accent-dim: #D6D4CA; --on-accent-soft: #B9B7AC;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E0E10; --surface: #19191C; --surface-2: #26262A; --raised: #202023;
    --ink: #F4F2EA; --ink-soft: #B2B0A7; --ink-faint: #76756E;
    --olive: #F2B33D; --olive-deep: #0A0A0B;
    --accent: #F2B33D; --accent-bg: #2B2414; --cool: #7FA9DD;
    --rust: #FF7F52; --rust-soft: #FF7F52;
    --amber: #F2B33D;
    --line: #2C2C30; --line-strong: #444449;
    --good: #7FD0A0; --good-bg: #1A2A21;
    --warn-bg: #36241A;
    --on-primary: #141416;
    --on-accent: #F4F2EA; --on-accent-dim: #D6D4CA; --on-accent-soft: #B9B7AC;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Barlow', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  button { font-family: inherit; }

  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; max-width: 520px; margin: 0 auto; width: 100%; }

  /* ---- top bar ---- */
  .topbar {
    flex-shrink: 0; background: var(--olive-deep); color: var(--on-accent);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; align-items: center; gap: 10px;
    border-bottom: 3px solid var(--rust);
  }
  .topbar .tb-btn {
    background: none; border: none; color: var(--on-accent); padding: 6px; margin: -6px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  .topbar .tb-btn:active { background: rgba(255,255,255,0.14); }
  .tb-title-wrap { flex: 1; min-width: 0; }
  .tb-title-wrap .tb-main { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 1.05rem; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-title-wrap .tb-sub { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10.5px; letter-spacing: 0.04em; color: var(--on-accent-soft); margin-top: 1px; }
  /* ---- Home screen's image banner, replacing the plain text topbar ---- */
  .home-banner { flex-shrink: 0; background: var(--olive-deep); padding-top: env(safe-area-inset-top, 0px); border-bottom: 3px solid var(--rust); }
  .home-banner img { display: block; width: 100%; height: auto; }
  .progress-wrap { flex-shrink: 0; padding: 0 16px 8px; background: var(--olive-deep); }
  .progress-track { height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--rust-soft); transition: width 0.25s ease; }
  .progress-label { padding: 5px 0 0; color: var(--on-accent-soft); font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10.5px; letter-spacing: 0.03em; }

  /* ---- scroll body ---- */
  .body-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); min-height: 0; }
  .body-scroll.with-bottombar { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

  /* ---- bottom nav (home mode) ---- */
  .bottomnav {
    flex-shrink: 0; display: flex; border-top: 1px solid var(--line); background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bottomnav button, .bottomnav .nav-link {
    flex: 1; background: none; border: none; padding: 10px 4px 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--ink-faint); font-size: 11px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; letter-spacing: 0.02em;
    -webkit-tap-highlight-color: transparent; text-decoration: none;
  }
  .bottomnav button.active { color: var(--olive); }
  .bottomnav svg { width: 20px; height: 20px; }

  /* ---- bottom action bar (session mode) ---- */
  .bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
  }
  .bottombar-inner { max-width: 520px; width: 100%; display: flex; gap: 10px; }

  /* ---- "updated" toast: no action needed, just fades out on its own ---- */
  .sw-update-toast {
    position: fixed; left: 12px; right: 12px; z-index: 50;
    top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--olive-deep); color: var(--on-accent);
    border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    font-family: 'Barlow', system-ui, sans-serif; font-size: 13.5px;
    opacity: 1; transition: opacity 0.5s ease;
  }
  /* Needs higher specificity than the display:flex above, or the [hidden]
     attribute's default display:none never wins and the toast — despite
     JS correctly marking it hidden — stays on screen forever. */
  .sw-update-toast[hidden] { display: none; }
  .sw-update-toast.fade-out { opacity: 0; }

  /* ---- buttons ---- */
  .btn {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.01em;
    border-radius: 8px; border: none; padding: 15px 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    -webkit-tap-highlight-color: transparent; transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--olive); color: #fff; flex: 1; }
  .btn-primary:active { background: var(--olive-deep); }
  .btn-danger { background: var(--rust); color: #fff; }
  .btn-danger:active { background: var(--rust-soft); }
  .btn-ghost { background: var(--surface-2); color: var(--ink); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.5; pointer-events: none; }

  /* ---- cards / sections ---- */
  .section-label {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 11px; letter-spacing: 0.06em;
    color: var(--ink-faint); text-transform: uppercase; margin: 22px 0 8px;
  }
  .section-label:first-child { margin-top: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }

  /* ---- next-up hero card ---- */
  .next-card {
    background: var(--olive-deep); color: var(--on-accent); border-radius: 14px; padding: 20px;
    margin-bottom: 16px;
  }
  .next-card .nc-eyebrow { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 11px; letter-spacing: 0.06em; color: var(--on-accent-soft); margin-bottom: 4px; }
  .next-card .nc-title { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 1.5rem; line-height: 1.15; margin: 0 0 4px; text-wrap: balance; }
  .next-card .nc-meta { font-size: 13px; color: var(--on-accent-soft); margin-bottom: 16px; }
  .next-card .btn-primary { background: var(--on-accent); color: var(--olive-deep); }
  .next-card .btn-primary:active { background: var(--on-accent-dim); }

  /* ---- day chips ---- */
  .day-chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 4px; }
  .day-chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 2px; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .day-chip .dc-n { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10px; color: var(--ink-faint); }
  .day-chip .dc-t { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10px; font-weight: 600; margin-top: 2px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-chip.is-next { border-color: var(--olive); background: var(--good-bg); }
  .day-chip.lift .dc-t { color: var(--olive); }
  .day-chip.gpp .dc-t { color: var(--amber); }
  .day-chip.cardio .dc-t { color: var(--rust); }

  /* ---- phase selector ---- */
  .phase-select { display: flex; gap: 6px; }
  .phase-btn {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 6px; text-align: center; cursor: pointer; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-weight: 600; font-size: 13px; color: var(--ink-soft); -webkit-tap-highlight-color: transparent;
  }
  .phase-btn.active { background: var(--olive); color: #fff; border-color: var(--olive); }

  /* ---- onboarding (first-launch intake) ---- */
  .onb-wrap { padding: 4px 0 24px; }
  .onb-head { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .02em; margin: 4px 0 2px; }
  .onb-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.5; }
  .onb-label { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 22px 0 8px; }
  .onb-label:first-of-type { margin-top: 0; }
  .choice-row { display: flex; gap: 8px; }
  .choice-row .choice-item { flex: 1; text-align: center; }
  .choice-list { display: flex; flex-direction: column; gap: 8px; }
  .choice-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .choice-item .ci-title { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink); }
  .choice-item .ci-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .choice-item.active { background: var(--good-bg); border-color: var(--olive); }
  .choice-item.active .ci-title { color: var(--olive); }
  .onb-error { font-size: 12.5px; color: var(--rust); margin: 14px 0 0; }

  /* ---- banner ---- */
  .banner { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; display:flex; align-items:center; gap:8px; }
  .banner svg { flex-shrink: 0; width: 16px; height: 16px; }
  .banner-warn { background: var(--warn-bg); color: var(--rust); }

  /* ---- log list ---- */
  .log-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .log-row:last-child { border-bottom: none; }
  .log-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--olive); flex-shrink: 0; }
  .log-dot.gpp { background: var(--amber); } .log-dot.cardio { background: var(--rust); } .log-dot.recovery { background: var(--ink-faint); } .log-dot.rest { background: var(--line-strong); }
  .log-main { flex: 1; min-width: 0; }
  .log-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-date { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 11px; color: var(--ink-faint); flex-shrink: 0; }
  .log-del {
    background: none; border: none; padding: 6px; margin: -6px -6px -6px 2px; flex-shrink: 0;
    color: var(--ink-faint); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .log-del:active { background: var(--surface-2); color: var(--rust); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-faint); }
  .empty-state svg { width: 40px; height: 40px; margin-bottom: 10px; opacity: 0.5; }
  .empty-state p { font-size: 13.5px; margin: 0; line-height: 1.5; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-tile { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-tile .st-n { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 1.5rem; color: var(--olive); font-variant-numeric: tabular-nums; }
  .stat-tile .st-l { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  /* ---- session step ---- */
  .step-kind { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 11px; letter-spacing: 0.06em; color: var(--rust); text-transform: uppercase; margin-bottom: 6px; }
  .step-kind.warmup, .step-kind.stretch { color: var(--olive); }
  .step-kind.tendon { color: var(--amber); }
  .step-title { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 1.7rem; line-height: 1.1; margin: 0 0 18px; text-wrap: balance; }

  .ex-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .ex-header .step-title { margin: 0; }
  .ex-icon {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 10px;
    background: var(--surface-2); color: var(--olive);
    display: flex; align-items: center; justify-content: center;
  }
  .ex-icon svg { width: 26px; height: 26px; }

  .stat-pair { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat-big { flex: 1; min-width: 90px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 10px; text-align: center; }
  .stat-big .sb-v { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 1.55rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat-big .sb-l { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-faint); text-transform: uppercase; margin-top: 5px; }

  .set-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .set-row {
    display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .set-row:active { background: var(--surface-2); }
  .wt-btn { flex: none; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 700 24px 'Barlow', sans-serif; line-height: 1; cursor: pointer; }
  .wt-btn:active { background: var(--accent-bg); }
  .weight-row { gap: 8px; }
  .weight-row .weight-input { min-width: 0; text-align: center; }
  .rep-in { width: 74px; flex: none; padding: 8px 6px; text-align: center; font: 600 16px 'Barlow', sans-serif; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .rep-in::placeholder { font-weight: 500; font-size: 13px; color: var(--ink-faint); }
  .set-row.filled { background: var(--good-bg); border-color: var(--olive); }
  .set-row .sr-check {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff; transition: all 0.15s ease;
  }
  .set-row.filled .sr-check { background: var(--olive); border-color: var(--olive); }
  .set-row .sr-label { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); }
  .set-row.filled .sr-label { color: var(--good); }
  .set-hint { text-align: center; font-size: 12px; color: var(--ink-faint); margin: 0 0 20px; }

  .rest-timer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: -6px 0 20px; }
  .rest-timer.done { border-color: var(--olive); background: var(--good-bg); }
  .rt-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .rt-label { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-faint); text-transform: uppercase; }
  .rest-timer.done .rt-label { color: var(--good); }
  .rt-skip {
    background: var(--surface-2); border: none; border-radius: 6px; padding: 5px 12px;
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 11.5px; color: var(--ink-soft);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .rt-time {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 1.7rem;
    font-variant-numeric: tabular-nums; color: var(--ink); margin-bottom: 8px; display: flex; align-items: center;
  }
  .rest-timer.done .rt-time { color: var(--good); }
  .rt-track { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .rt-fill { height: 100%; background: var(--rust-soft); transition: width 0.2s linear; }
  .rest-timer.done .rt-fill { background: var(--olive); width: 100% !important; }

  .item-list { list-style: none; margin: 0 0 20px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .item-list li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; font-size: 14.5px; line-height: 1.4; }

  .instr-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .instr-card p { margin: 0; font-size: 15px; line-height: 1.5; }
  .instr-card p + p { margin-top: 10px; color: var(--ink-soft); font-size: 13.5px; }

  .sketch-wrap { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .sk-svg { width: 100%; max-width: 320px; display: block; margin: 0 auto; }
  .sk-svg .bf-torso, .sk-svg .bf-limb { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .sk-svg .bf-back { opacity: 0.4; }
  .sk-svg circle.bf-head { fill: var(--ink); stroke: none; }
  .sk-svg .sk-prop { stroke: var(--rust); stroke-width: 2.2; fill: none; }
  .sk-svg .sk-prop-fill { fill: var(--rust); stroke: none; }
  .sk-svg .sk-ground { stroke: var(--line-strong); stroke-width: 1.5; }
  .sk-svg .sk-div { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
  .sk-svg .sk-label { fill: var(--ink-faint); font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 7px; text-transform: uppercase; letter-spacing: 0.04em; text-anchor: middle; }
  .manual-sketch { margin: 6px 0 2px; }
  .ex-photo { width: 100%; display: block; margin: 0 auto; border-radius: 8px; border: 1px solid var(--line); }

  .photo-reveal-btn { font-size: 13.5px; padding: 12px 16px; margin-bottom: 14px; }
  .photo-reveal-panel { margin: -6px 0 14px; display: flex; flex-direction: column; gap: 14px; }
  .photo-reveal-panel .sketch-wrap { margin-top: 0; padding-top: 12px; }

  /* ---- per-line photo toggle (warm-up / tendon / stretch / balance / recovery) ---- */
  .named-item-list .ni-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .named-item-list .ni-row span { flex: 1; }
  .ni-photo-btn {
    flex-shrink: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--surface-2); color: var(--ink-soft); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .ni-photo-btn:active { background: var(--olive); color: #fff; border-color: var(--olive); }
  .ni-photo { margin-top: 10px; }

  .mm-svg { width: 100%; max-width: 260px; display: block; margin: 0 auto; }
  .mm-svg .mm-torso { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.2; }
  .mm-svg .mm-limb { fill: none; stroke: var(--surface-2); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
  .mm-svg .mm-limb.mm-leg { stroke-width: 14; }
  .mm-svg .mm-head { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.2; }
  .mm-svg .mm-region { fill: none; stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 2 2; opacity: 0.6; }
  .mm-svg .mm-region.active { fill: var(--rust); stroke: var(--rust); opacity: 0.92; stroke-dasharray: none; }

  .tendon-box { background: var(--surface); border: 1px dashed var(--amber); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .tendon-box p { margin: 0; font-size: 15px; line-height: 1.4; }

  .note-line { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.5; }

  /* ---- summary screen ---- */
  .summary-hero { text-align: center; padding: 28px 16px 20px; }
  .summary-hero .check-circle {
    width: 64px; height: 64px; border-radius: 50%; background: var(--good-bg); color: var(--good);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
  }
  .summary-hero h2 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 1.6rem; margin: 0 0 4px; }
  .summary-hero p { color: var(--ink-soft); margin: 0; font-size: 14px; }
  .summary-list { list-style: none; margin: 0; padding: 0; }
  .summary-list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .summary-list li:last-child { border-bottom: none; }
  .summary-list svg { width: 16px; height: 16px; color: var(--good); flex-shrink: 0; }


  /* ---- guided timer runner ---- */
  .guided { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  .g-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px; }
  .g-x { background: var(--surface-2); border: none; border-radius: 8px; padding: 8px 14px; color: var(--ink-soft);
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .g-count { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); }
  .g-progress { height: 4px; background: var(--surface-2); margin: 0 16px; border-radius: 2px; overflow: hidden; }
  .g-pfill { height: 100%; background: var(--olive); width: 0; transition: width .3s; }
  .g-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 20px; gap: 6px; overflow: hidden; }
  .g-photo { max-width: 100%; max-height: 34vh; object-fit: contain; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .g-phase { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--olive); margin-top: 6px; }
  .g-rest .g-phase { color: var(--amber); }
  .g-title { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 1.5rem; line-height: 1.15; color: var(--ink); }
  .g-sub { font-size: 14px; color: var(--ink-soft); min-height: 20px; }
  .g-time { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 4.6rem; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--ink); }
  .g-reps { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 2.6rem; color: var(--ink); }
  .g-bar { width: 100%; max-width: 360px; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .g-fill { height: 100%; background: var(--olive); width: 0; }
  .g-rest .g-fill { background: var(--amber); }
  .g-next { padding: 10px 20px; text-align: center; font-size: 13px; color: var(--ink-soft); border-top: 1px solid var(--line); background: var(--surface); }
  .g-next b { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; color: var(--ink); font-weight: 600; }
  .g-controls { display: flex; gap: 10px; padding: 12px 16px 14px; background: var(--surface); }
  .g-controls .btn { flex: 1; }
  .g-controls .btn[disabled] { opacity: .4; }
  .g-done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 8px; }
  .g-done h2 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; margin: 6px 0 0; }
  .g-done p { margin: 0 0 14px; color: var(--ink-soft); }
  .g-done .btn { flex: none; width: 100%; max-width: 320px; }
  .guided-start { margin-bottom: 14px; }
  .guided-start-note { font-size: 12px; color: var(--ink-faint); text-align: center; margin: -6px 0 14px; }

  /* ---- exit confirm overlay ---- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .overlay-sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .overlay-sheet h3 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 1.1rem; margin: 0 0 6px; }
  .overlay-sheet p { margin: 0 0 16px; font-size: 14px; color: var(--ink-soft); }
  .overlay-sheet .ov-actions { display: flex; gap: 10px; }

  .ph-note { font-size: 13px; color: var(--ink-soft); margin: 10px 2px 0; line-height: 1.45; }
  a.textlink { color: var(--olive); }

  /* ---- manual screen ---- */
  .manual-hero { background: var(--olive-deep); color: var(--on-accent); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .manual-hero .mh-title { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 1.4rem; margin-bottom: 2px; }
  .manual-hero .mh-sub { font-size: 13px; color: var(--on-accent-soft); margin-bottom: 8px; }
  .manual-hero .mh-stats { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10.5px; color: var(--on-accent-soft); letter-spacing: 0.03em; }

  .manual-nav { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; margin-bottom: 18px; }
  .mn-chip {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 12px; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .mn-chip:active { background: var(--olive); color: #fff; border-color: var(--olive); }

  .mn-cardhead { margin: 0 0 6px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 14.5px; }
  .mn-cardbody { margin: 0; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .mn-label { margin: 0 0 4px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); }
  .mn-label.amber { color: var(--amber); }
  .mn-label.olive { color: var(--olive); }
  .mn-calloutlabel { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 12px; letter-spacing: 0.03em; text-transform: uppercase; }

  .manual-workout { padding: 0; overflow: hidden; margin-bottom: 14px; }
  .mchap { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; overflow: hidden; }
  .mchap > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  .mchap > summary::-webkit-details-marker, .mlib > summary::-webkit-details-marker { display: none; }
  .mchap .mc-n { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 15px; }
  .mchap .mc-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mchap .mc-t b { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 700; }
  .mchap .mc-t i { font-style: normal; font-size: 12.5px; color: var(--ink-faint); }
  .mchap .mc-a { font-size: 22px; color: var(--ink-faint); transition: transform .15s; }
  .mchap[open] .mc-a { transform: rotate(90deg); }
  .mchap[open] > summary { border-bottom: 1px solid var(--line); }
  .mchap[open] .mc-n { background: var(--accent); color: #141416; }
  .mchap .mc-body { padding: 14px; background: var(--bg); }
  .mchap .mc-body > .section-label:first-child { margin-top: 0; }
  .mlib { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .mlib > summary { list-style: none; padding: 12px 14px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer; }
  .mlib[open] > summary { background: var(--surface-2); }
  .mlib .mw-body { padding: 12px 14px; }
  .manual-workout .mw-head { background: var(--surface-2); padding: 11px 14px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 15px; }
  .manual-workout .mw-body { padding: 14px; }

  .guide-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .guide-table th { text-align: left; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-faint); padding: 4px 6px; border-bottom: 1px solid var(--line-strong); }
  .guide-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.35; }
  .guide-table tr:last-child td { border-bottom: none; }
  .guide-table td:first-child { font-weight: 600; }
  .moves-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .moves-table th { text-align: left; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 10px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-faint); padding: 4px 6px; border-bottom: 1px solid var(--line-strong); }
  .moves-table td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
  .moves-table tr:last-child td { border-bottom: none; }
  .moves-table td:first-child { font-weight: 600; }
  .moves-table td:nth-child(2), .moves-table td:nth-child(3) { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; white-space: nowrap; color: var(--ink-soft); }

  /* ---- weight / progression card (on a workout's main lift step) ---- */
  .weight-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .weight-hint { font-size: 13px; color: var(--ink-soft); line-height: 1.4; margin-bottom: 10px; display: flex; gap: 8px; align-items: flex-start; }
  .weight-hint svg { flex-shrink: 0; width: 15px; height: 15px; margin-top: 1px; color: var(--amber); }
  .weight-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .weight-row label { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); flex-shrink: 0; }
  .weight-input {
    flex: 1; min-width: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 15px; font-weight: 600;
    background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 10px; color: var(--ink);
  }
  .weight-input:focus { outline: 2px solid var(--olive); outline-offset: -1px; }
  .hitall-toggle { display: flex; gap: 6px; }
  .hitall-btn {
    flex: 1; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 6px;
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 12.5px; color: var(--ink-soft);
    cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: center;
  }
  .hitall-btn.active.yes { background: var(--olive); color: #fff; border-color: var(--olive); }
  .hitall-btn.active.no { background: var(--rust); color: #fff; border-color: var(--rust); }

  /* ---- settings screen ---- */
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-bottom: 1px solid var(--line); }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .sr-k { font-size: 13.5px; color: var(--ink-soft); }
  .settings-row .sr-v { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink); text-align: right; }

  /* ---- profile screen ---- */
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; }
  .field-input {
    width: 100%; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 15px;
    background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; color: var(--ink);
  }
  .field-input:focus { outline: 2px solid var(--olive); outline-offset: -1px; }
  .field-input.notes { font-family: 'Barlow', system-ui, sans-serif; font-size: 14px; resize: vertical; min-height: 54px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .measure-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .measure-row:last-child { border-bottom: none; }
  .measure-main { flex: 1; min-width: 0; }
  .measure-date { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 12px; color: var(--ink-faint); margin-bottom: 2px; }
  .measure-vals { font-size: 13.5px; color: var(--ink); }
  .measure-vals b { color: var(--olive); }

  /* ============ REDESIGN LAYER (v2.4) — graphite + signal yellow, Barlow ============ */
  body { font-size: 16px; line-height: 1.4; letter-spacing: 0; }
  .btn, .step-title, .next-card .nc-title, .onb-head, .summary-hero h2, .g-title { letter-spacing: 0.005em; }

  /* top bar + banner */
  .topbar { background: var(--olive-deep); border-bottom: 3px solid var(--accent); padding-bottom: 14px; }
  .topbar .tb-main, .tb-title-wrap .tb-main { font-weight: 700; font-size: 1.3rem; letter-spacing: 0.01em; }
  .tb-title-wrap .tb-sub { font-weight: 500; font-size: 12px; letter-spacing: 0.08em; color: var(--accent); }
  .home-banner { background: var(--olive-deep); border-bottom: 3px solid var(--accent); }
  .progress-wrap { background: var(--olive-deep); }
  .progress-track { background: rgba(255,255,255,0.14); }
  .progress-fill { background: var(--accent); }
  .progress-label { color: var(--on-accent-soft); font-size: 12px; font-weight: 500; letter-spacing: 0.06em; }

  /* bottom nav */
  .bottomnav { background: var(--surface); border-top: 1px solid var(--line); }
  .bottomnav button, .bottomnav .nav-link { position: relative; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; padding: 12px 4px 9px; }
  .bottomnav button.active { color: var(--ink); }
  .bottomnav button.active::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
  .bottomnav svg { width: 22px; height: 22px; }

  /* buttons */
  .btn { font-size: 18px; font-weight: 700; letter-spacing: 0.03em; border-radius: 14px; padding: 15px 22px; min-height: 54px; }
  .btn-primary { background: var(--olive); color: var(--on-primary); }
  .btn-primary:active { background: var(--olive); filter: brightness(.9); }
  .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }
  .btn-danger { color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* section labels + cards */
  .section-label { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; text-transform: none; color: var(--ink-soft); margin: 26px 0 10px; }
  .card, .item-list li, .instr-card, .weight-card, .stat-big, .stat-tile, .rest-timer, .tendon-box { border-radius: 16px; border-color: var(--line); }
  .card, .instr-card, .weight-card, .stat-tile { box-shadow: var(--shadow); }
  .card { padding: 18px; }

  /* hero "next up" card */
  .next-card { position: relative; overflow: hidden; border-radius: 20px; padding: 22px 22px 22px 26px;
    background: linear-gradient(155deg, #1D1D20 0%, #0E0E10 100%); color: #F4F2EA; border: 1px solid #2C2C30; box-shadow: var(--shadow); }
  .next-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--accent); }
  .next-card .nc-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 6px; }
  .next-card .nc-title { font-weight: 800; font-size: 2rem; line-height: 1.05; margin-bottom: 6px; }
  .next-card .nc-meta { font-size: 14px; color: #B9B7AC; margin-bottom: 18px; }
  .next-card .btn-primary { background: var(--accent); color: #141416; }
  .next-card .btn-primary:active { background: var(--accent); filter: brightness(.92); }

  /* day chips, phase select */
  .day-chip { border-radius: 12px; padding: 9px 2px 8px; background: var(--surface); }
  .day-chip .dc-n { font-size: 11px; font-weight: 600; }
  .day-chip .dc-t { font-size: 11.5px; font-weight: 700; }
  .day-chip.is-next { background: var(--accent-bg); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .day-chip.lift .dc-t { color: var(--ink); }
  .phase-btn { border-radius: 12px; font-size: 15px; font-weight: 700; padding: 11px 6px; }
  .phase-btn.active { background: var(--olive-deep); border-color: var(--olive-deep); color: var(--accent); }
  .toast-fixed { position: fixed; left: 16px; right: 16px; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); z-index: 60; margin: 0; background: #1c1c1e; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .stage-select { gap: 4px; }
  .stage-select .phase-btn { font-size: 12.5px; padding: 11px 2px; white-space: nowrap; flex: 1 1 0; min-width: 0; text-align: center; }
  .stage-select .phase-btn.done { opacity: .6; }

  /* session */
  .step-kind { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--rust); }
  .step-kind.warmup, .step-kind.stretch { color: var(--cool); }
  .step-kind.tendon { color: var(--amber); }
  .step-title { font-weight: 800; font-size: 2.15rem; line-height: 1.02; margin-bottom: 20px; }
  .ex-icon { border-radius: 12px; background: var(--accent-bg); color: var(--ink); }
  .stat-big .sb-v { font-weight: 800; font-size: 2rem; }
  .stat-big .sb-l { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
  .set-row { border-radius: 14px; padding: 13px 16px; background: var(--surface); }

    "Backpack Goblet Squat": "Hug a loaded backpack tight against your chest. Feet slightly wider than shoulder-width, toes out. Squat deep, keeping your chest tall and elbows inside your knees at the bottom, then stand up through your whole foot.",
    "Loaded Inverted Row": "Set up for a feet-elevated inverted row under a sturdy table, and rest a loaded backpack on your lower chest/hips. Pull your chest to the table edge, squeeze, and lower slowly. Keep your body in one straight line.",
    "Single-Jug Suitcase Carry": "Hold one heavy jug, bucket or bag in one hand at your side. Walk the distance standing perfectly tall — don't lean toward the weight or let your shoulder drop. Switch hands for the second set. Core braced the whole way.",
    "Inverted Row Hold": "Set up under a sturdy table as for an inverted row. Pull up so your chest is at the table edge and hold that top position, shoulder blades squeezed, body straight, for the full time. Lower under control when done.",
    "Barbell Back Squat": "Bar racked across your upper back (not your neck), feet shoulder-width, toes slightly out. Break at the hips and knees together, sit down until your thighs are at least parallel to the floor, then drive back up through your whole foot. Keep your chest up and knees tracking over your toes.",
    "Flat Bench Press": "Lie on the bench, feet flat on the floor, shoulder blades pulled back and down. Lower the bar to your mid-chest under control, elbows at roughly 45° to your torso, then press it back up to lockout over your shoulders.",
    "Assisted Pull-ups": "Loop a resistance band over the bar and under one knee or foot (or use an assist machine) to remove just enough bodyweight that you can complete every rep in full. Pull your chest toward the bar, then lower all the way to a dead hang each rep — don't stop at the halfway point.",
    "Farmer's Walk": "Pick up a heavy dumbbell, kettlebell, or loaded jug/jerry can in each hand and walk a measured distance with tall posture — shoulders back, core braced. Take controlled steps; don't let the weights pull you into a lean.",
    "Forearm Plank": "Forearms on the floor, elbows under your shoulders, body in one straight line from head to heels. Squeeze your glutes and brace your abs — don't let your hips sag or pike up. Breathe normally through the hold.",
    "Calf Raise": "Standing, rise up onto the balls of your feet as high as you can, pause a beat at the top, then lower slowly until your heels are back on the floor. Keep your legs straight, not locked-stiff.",
    "Band Pull-Apart": "Hold a light resistance band at shoulder height, arms straight out in front of you. Pull it apart by driving your shoulder blades together, hold a second, then return under control. Don't shrug your shoulders up toward your ears.",
    "Conventional Deadlift": "Bar over your mid-foot, shins almost touching it, grip just outside your legs. Hips down, chest up, back flat — brace hard, then drive the floor away with your legs, keeping the bar close to your shins, and finish by driving your hips through to stand tall. Lower it back down the same path.",
    "Standing Overhead Press": "Bar at your collarbones, grip just outside shoulder width. Brace your core and glutes, press the bar straight up — tuck your head back slightly so it clears your face — until your arms lock out overhead. Lower it back to your collarbones under control.",
    "Bent-Over Barbell Row": "Hinge at the hips until your torso is near-horizontal, knees slightly bent, back flat. Pull the bar up into your lower ribs, driving your elbows back and squeezing your shoulder blades together, then lower it under control without letting your back round.",
    "Strict Push-ups": "Hands just outside shoulder width, body in one straight line from head to heels, no sagging hips. Lower your chest to within a fist's width of the floor, elbows tracking back at roughly 45°, then press back up to full lockout.",
    "Hanging Knee Raises": "Hang from a pull-up bar with a full grip. Curl your knees up toward your chest by rounding your lower back and tilting your pelvis, then lower back to a dead hang under control — don't swing, let your abs do the work.",
    "Banded Lateral Walk": "Loop a light band around your ankles or just above your knees, feet hip-width, knees slightly bent. Step sideways keeping tension on the band the whole time and your knees pointed forward, not caving in, for the prescribed steps each direction.",
    "Pallof Press": "Anchor a band or cable at chest height to your side, hold it at your sternum with both hands. Press it straight out in front of you and hold — the band will try to rotate your torso toward the anchor, your job is to resist that and stay square — then pull back in.",
    "Bulgarian Split Squat": "Stand a couple of feet in front of a bench or sturdy chair, rest the top of one foot on it behind you. Lower straight down on the front leg until your back knee nearly grazes the floor, torso upright, then drive back up through the front heel.",
    "Weighted Dips": "On parallel bars, hold a dip belt or dumbbell between your feet for added load. Lower under control until your shoulders dip just below your elbows, elbows tracking back, then press back up to full lockout — lean slightly forward to keep the stress off your shoulders.",
    "Strict Pull-ups": "Full grip on the bar, start from a complete dead hang. Pull your chest up toward the bar by driving your elbows down and back, without kipping or swinging your legs, then lower all the way back to a dead hang each rep.",
    "Sandbag Bear-Hug Carry": "Hug a sandbag (or any heavy, awkward load) tight against your chest, elbows down. Walk the measured distance with short, controlled steps, torso upright — the load will try to pull you forward, resist that.",
    "Hollow Body Hold": "Lie on your back, press your lower back into the floor, then lift your shoulders and legs a few inches off the ground, arms reaching overhead or by your sides. Hold that shape without letting your lower back arch off the floor.",
    "Romanian Deadlift": "Start standing with the bar at hip height. Push your hips straight back, soft bend in your knees, bar close to your legs, until you feel a strong stretch in your hamstrings — don't round your back to get lower. Drive your hips forward to stand back up.",
    "Single-Arm DB Row": "One hand and knee on a bench for support, other foot on the floor, dumbbell hanging straight down from the free arm. Pull the dumbbell up to your hip, elbow driving back, squeeze at the top, then lower it all the way back to a full stretch.",
    "Push Press": "Bar at your collarbones like the overhead press, but dip your knees a few inches and drive explosively through your legs as you press the bar overhead. Lock out overhead, then lower under control.",
    "Kettlebell Swings": "Hinge at the hips (not a squat) to swing the kettlebell back between your legs, then snap your hips forward to send it up to roughly chest height, arms just along for the ride. Let it swing back down and repeat — your hips do the work, not your arms.",
    "L-Sit Progressions": "Supported on the floor, parallel bars or between two sturdy chairs, press your hands down to lift your hips off the ground, legs out straight in front of you (or tucked in, as the easier version), forming an “L” with your body. Hold as long as prescribed, shoulders down away from your ears.",
    "Pistol Squats": "Standing on one leg, the other held straight out in front, squat straight down on the standing leg as low as you can with control, then drive back up without the raised leg touching down. Too hard at full depth? Hold onto something for balance or squat to a box and build depth over time.",
    "Muscle-Up Progressions": "A muscle-up is a pull-up that transitions into a dip above the bar. Build it from strict pull-ups and dips trained separately first, then false-grip pull-ups (thumbs over the bar) pulled explosively high enough to roll your chest over the bar — don't jump straight to a kipping version as a shortcut.",
    "Handstand Push-ups": "Feet up against a wall for support, hands on the floor shoulder-width apart. Lower your head toward the floor under control, elbows tracking forward, then press back up to full arm extension. Can't yet lower under control? Work a partial range and add depth over time.",
    "Heavy Sled Push/Pull": "Load a sled (or any heavy object you can push or drag) and drive it forward in low, powerful steps for the push, or walk backward pulling it by a rope/strap for the pull. Stay low with a forward lean on the push; keep constant tension on the pull.",
    "Dragon Flags": "Lying on a bench, grip behind your head for anchor. Keeping your body rigid in one straight line, lower your whole body toward the bench under control, pivoting only at your shoulder blades, then raise back up. Start with bent knees until you can control the full lowered position.",
    "Heavy Sandbag Cleans": "Squat down and hug the sandbag against your body, then explosively stand and pull it up using your hips and legs — not just your arms — to get it to your chest or shoulder in one motion. Set it back down under control and reset before the next rep.",
    "Front Squat": "Bar rests across the front of your shoulders, elbows lifted high so your upper arms are near parallel to the floor. Squat down keeping your torso upright — the front-loaded bar won't let you lean forward the way a back squat does — then drive back up.",
    "Weighted Pull-ups": "Same as a strict pull-up, with weight added via a dip belt, vest, or a dumbbell held between your feet. Full dead hang to chin-over-bar, no kipping, every rep — add weight only once bodyweight pull-ups are solid.",
    "Suitcase Carries": "Hold a heavy dumbbell or kettlebell in just one hand, down at your side like a suitcase. Walk the measured distance keeping your torso upright and level — resisting the pull to lean toward the loaded side is the whole point.",
    "Front Lever Progressions": "Hanging from a bar, the goal is to pull your body up into a horizontal line, holding yourself there with back and core strength. Build toward it with tuck holds (knees pulled to chest) and advanced-tuck or single-leg variations before attempting the full straight-body hold.",
    "Face Pull (band or cable)": "Set a band or cable at roughly head height. Pull it toward your face, leading with your elbows high and out wide, squeezing your shoulder blades together at the end — this targets the rear shoulders and upper back that pressing work doesn't reach.",
    "Lateral Bound, Stick the Landing": "Standing on one leg, jump sideways onto the other leg, landing as softly and quietly as possible — knee bent, tracking straight over your toes, not caving inward. Hold that landing for a full second or two before the next bound; control on landing matters more than distance."
  };

  var HOME_INTRO = "Home version: everything today uses your own bodyweight. You need a floor, a wall, a sturdy table, a chair and a towel. Before any table or door row, test that the table cannot tip and that the door is shut and closes toward you. When an exercise gets easy, use the “Make it harder” tip in its instructions. A loaded backpack or a doorway pull-up bar is optional.";
  var HOME_EX_HOWTO = {
    "Slow Bodyweight Squat": "Feet shoulder-width, toes slightly out. Take 3 full seconds to sit down and back until your thighs are at least parallel to the floor, pause, then stand. Heels stay down, chest up, knees track over your toes. Do not bounce at the bottom. Make it harder: wear a loaded backpack, or slow the lowering to 5 seconds.",
    "Full-Range Push-ups": "Hands under your shoulders, body in one straight line. Lower until your chest touches the floor, then push up and finish by pushing your upper back toward the ceiling so your shoulder blades spread. Elbows about 45° from your body. Too hard? Put your hands on a table or chair. Make it harder: raise your feet on a chair, or wear a loaded backpack.",
    "Table Row": "Test the table first: it must be heavy and must not tip when you hang from its edge. Lie under it, grip the edge with both hands, body straight, heels on the floor. Pull your chest up to the table edge, squeeze your shoulder blades, lower under control. Easier: bend your knees with feet flat. Have a pull-up bar? Do slow lowering instead: jump to the top and take 5 seconds to lower.",
    "Prone Y-Raise": "Lie face down, arms stretched overhead in a Y shape, thumbs pointing up. Lift both arms a few centimetres off the floor by squeezing your shoulder blades back and down, hold 2 seconds, lower. Keep your forehead down and neck relaxed. Make it harder: hold a small water bottle in each hand.",
    "Bear Crawl": "On hands and feet with your knees hovering just above the floor and your back flat. Crawl forward moving opposite hand and foot together, with small steps and hips level. No space? Crawl forward and backward a few steps. Make it harder: wear a loaded backpack, or have water jugs? Carry one in each hand and walk instead.",
    "Single-Leg Calf Raise": "Stand on one foot on the edge of a step, holding a wall for balance. Lower your heel below the step, then rise as high as you can onto your toes and pause for a second. Finish all reps, then switch legs. Too hard? Use both legs. Make it harder: wear a loaded backpack.",
    "Single-Leg Glute Bridge": "Lie on your back, one foot flat on the floor, the other leg held straight in the air. Push through your heel to lift your hips until your body is straight from shoulder to knee, squeeze, lower slowly. Keep your hips level. Too hard? Use both feet. Make it harder: rest your shoulders on a chair, or put a loaded backpack on your hips.",
    "Pike Push-ups": "Start in a push-up position, walk your feet in and lift your hips high so your body makes an upside-down V. Bend your elbows to lower the top of your head toward the floor between your hands, then press back up. Make it harder: raise your feet on a chair.",
    "Towel Door Row": "Use a strong door that closes toward you and shut it fully. Loop a strong towel around both handles (or knot it and trap the knot over the top of the closed door). Hold the ends, lean back with arms straight and feet near the door, body straight. Pull your chest to your hands, lower slowly. Walk your feet further forward to make it harder. Have a pull-up bar? Do chin-ups or slow lowering instead.",
    "Reverse Nordic Curl": "Kneel upright on something soft, shins flat, hips pushed forward. Keeping a straight line from knees to shoulders, lean back slowly as far as you can control, then pull yourself upright with the front of your thighs. Do not bend at the hips. Start with a small lean and go further over the weeks. Stop if you feel sharp knee pain.",
    "Lying Leg Raises": "Lie on your back, hands under your hips, legs straight. Press your lower back into the floor and raise your legs to vertical, then lower them slowly until just above the floor. If your lower back lifts, bend your knees. Have a pull-up bar? Do hanging knee raises instead.",
    "Side-Lying Leg Raise": "Lie on your side, legs straight and stacked, body in one line. Lift the top leg about 45° with toes pointing forward (not up), pause, lower slowly. You should feel the outer hip. Finish all reps, then switch sides. Make it harder: add a 3-second hold at the top.",
    "Wall Push-ups": "Stand an arm's length from a wall, hands on it at chest height, a little wider than your shoulders. Keep your body in one straight line and bend your elbows to bring your chest to the wall, then push back. The further your feet are from the wall, the harder it is.",
    "Incline Push-ups": "Put your hands on the edge of a sturdy table or kitchen counter, a little wider than your shoulders, and walk your feet back until your body is one straight line. Lower your chest to the edge, then push back up. Use a lower surface, such as a chair, as it gets easy.",
    "Knee Push-ups": "Start in a push-up position with your knees on the floor (use a cushion) and your body straight from knees to head. Lower your chest all the way to the floor, elbows about 45° from your body, then push back up. Do not let your hips sag or stick up.",
    "Bent-Knee Table Row": "Test the table first: it must be heavy and must not tip. Lie under it, grip the edge with both hands, and bend your knees so your feet are flat on the floor close to your hips. Pull your chest up to the table edge, squeeze your shoulder blades, lower under control. Use your legs only as much as you need to.",
    "Dead Hang": "Hold a pull-up bar with both hands, a little wider than your shoulders, and hang with straight arms. First let your shoulders relax up toward your ears, then pull your shoulder blades down without bending your arms. Hold for the time. Too hard? Keep your toes lightly on a chair.",
    "Negative Pull-ups": "Stand on a chair or jump so your chin is above the bar, arms bent. Lift your feet and lower yourself as slowly as you can, aiming for 5 seconds, until your arms are straight. Step back up and repeat. Only the lowering counts.",
    "Chair Sit-to-Stand": "Sit on the front half of a sturdy chair, feet flat and shoulder-width, arms reaching forward. Lean forward a little and stand up without using your hands, then sit back down slowly, taking 3 seconds. Touch the chair lightly and stand again. Use a lower seat as it gets easy.",
    "Knee Plank": "Rest on your forearms with elbows under your shoulders and your knees on the floor (use a cushion). Lift your hips so your body is straight from knees to head, tighten your stomach and hold. Do not let your lower back sag.",
    "Bird-Dog": "Start on your hands and knees, hands under shoulders and knees under hips, back flat. Reach one arm straight forward and the opposite leg straight back until both are level with your body. Hold 2 seconds without letting your hips twist or your lower back sag, then return slowly. Finish all reps on one side, then switch. Make it harder: hold each rep for 5 seconds, or touch elbow to knee under your body between reps.",
    "Table Reverse Hyper": "Test the table first: it must be heavy and must not tip. Lie face-down on it with your hips right at the edge and your legs hanging off, and hold the far edge or the sides firmly. Keeping your legs straight and together, squeeze your glutes and lift your legs until they are level with your body. Pause for a second, then lower slowly. Do not swing or arch hard at the top. Make it harder: hold the top for 3 seconds, or hold a light backpack between your feet.",
    "Side Plank": "Lie on your side, elbow under your shoulder, feet stacked. Lift your hips so your body is one straight line and hold. Do not let your hips sag or roll forward. Too hard? Keep your bottom knee on the floor. Hold the time on one side, then switch.",
    "Feet-Raised Push-ups": "Put your feet on a chair or step and your hands on the floor under your shoulders, body straight. Lower until your chest nearly touches the floor, then press up. The higher your feet, the harder it is. Make it harder: wear a loaded backpack, or pause 2 seconds at the bottom.",
    "Feet-Raised Table Row": "As for the table row, but with your heels on a chair so your body is horizontal. Test the table first. Pull your chest to the edge, pause, lower under control. Have a pull-up bar? Do strict pull-ups or chin-ups instead.",
    "Crab Walk": "Sit, hands behind you with fingers pointing to your feet, feet flat. Lift your hips and walk forward moving opposite hand and foot, hips high the whole time. No space? Walk a few steps forward and back. Make it harder: move slower and keep your hips level with your knees.",
    "Single-Leg Hip Thrust": "Rest your upper back on the edge of a sturdy chair or sofa, one foot flat on the floor, the other knee pulled toward your chest. Drop your hips, then drive through your heel until your body is flat like a table. Squeeze, lower slowly. Make it harder: put a loaded backpack on your hips.",
    "One-Arm Towel Door Row": "Set up as for the towel door row (strong door, fully shut, closing toward you). Hold the towel in one hand, lean back with that arm straight, body straight and square to the door. Pull your hand to your ribs without twisting, lower slowly. Finish all reps, then switch arms. Have a pull-up bar? Do pull-ups instead.",
    "Feet-Raised Pike Push-ups": "Put your feet on a chair, hands on the floor, hips high so your upper body is close to vertical. Lower the top of your head toward the floor in front of your hands, then press up. This is the step before a wall handstand push-up.",
    "Squat Jumps": "Squat down to about parallel, then jump straight up as high as you can. Land softly and quietly on the balls of your feet, knees over your toes and not caving in, and sink straight into the next rep. Stop the set if your landings get loud or sloppy.",
    "Bear Crawl Sprint": "Bear crawl (hands and feet, knees just off the floor) as fast as you can for the distance while keeping your back flat. Walk back slowly as your rest. No space? Do 15 seconds of fast crawling on the spot, forward and back.",
    "Explosive Table Row": "Set up as for the table row and test the table first. Pull as fast and hard as you can so your chest reaches the table edge quickly, then lower under control for 3 seconds. Reset between reps. Have a pull-up bar? Do chest-to-bar pull-ups instead.",
    "Dragon Flag Lowering": "Lie on your back and grip something heavy and fixed behind your head (a bed or sofa leg). Roll up so your body is straight and resting on your upper back, then lower your straight body as slowly as you can until you reach the floor. Bend your knees to get back up. Keep your hips from bending. Have a pull-up bar? Do hanging leg raises instead.",
    "Broad Jumps": "Stand with feet hip-width. Swing your arms back, then jump forward as far as you can. Land softly on both feet with knees bent and hold the landing for a second. Walk back and reset for each rep.",
    "Shrimp Squat": "Stand on one leg and hold the other foot behind you with the same-side hand. Lower slowly until the back knee lightly touches the floor (use a cushion), then stand up through the front heel. Reach the free arm forward for balance. Too hard? Hold a wall, or do not hold the back foot.",
    "One-Arm Table Row": "Test the table first. Lie under it as for the table row, but grip the edge with one hand and place the other hand on your chest. Keep your body straight and square, pull your chest to the table without twisting, lower slowly. Too hard? Bend your knees, or help with two fingers of the other hand. Have a pull-up bar? Do pull-ups with a loaded backpack instead.",
    "Side Plank Leg Raise": "Hold a side plank (elbow under shoulder, body straight) and lift your top leg, keeping it straight. Hold both for the time, then switch sides. Too hard? Do the plain side plank.",
    "Table Row Hold": "Set up under a sturdy, tested table as for the table row. Pull up until your chest is at the table edge and hold that top position, shoulder blades squeezed and body straight. Have a pull-up bar? Hold a tucked front lever instead: hang, pull your knees to your chest and lean back until your back is horizontal.",
    "Nordic Curl Lowering": "Kneel on something soft with your heels hooked under a heavy sofa or bed. Body straight from knees to head, hands ready in front. Lower yourself forward as slowly as you can, catch yourself with your hands, then push back up. Only the lowering counts. Stop if you feel a sharp pull in the back of your thigh.",
    "Archer Push-ups": "Take a very wide push-up position. Lower toward one hand by bending that elbow while the other arm stays almost straight, then press back up. Alternate sides or finish one side first. Too hard? Do feet-raised push-ups.",
    "Horse Stance Hold": "Stand with feet much wider than your shoulders, toes turned slightly out. Push your knees out over your toes and sink until your thighs are as close to parallel as you can hold. Keep your back upright and breathe slowly through your nose. Too hard? Stay higher.",
    "Glute Bridge Hold": "Lie on your back with knees bent and feet flat. Lift your hips until your body is straight from shoulders to knees, squeeze your glutes and hold. Do not arch your lower back.",
    "Split Squat Hold": "Step into a long split stance and lower until your back knee is just above the floor, front knee over your ankle, torso upright. Hold that bottom position. Alternate legs each hold.",
    "Push-up Hold": "Get into a push-up position and lower halfway, elbows at about 90°. Hold there with your body straight. Too hard? Hold with your hands on a chair.",
    "Wall Push": "Stand in a split stance facing a solid wall, hands on it at chest height with elbows bent about 90°. Build up over 2 seconds, then push as hard as you can for 6 seconds as if trying to move the wall. Keep breathing. Rest fully between efforts.",
    "Single-Leg Reach Hold": "Stand on one leg with a soft knee. Hinge forward with a flat back until your torso is about 45°, the other leg reaching straight behind you, and hold. Alternate legs each hold.",
    "Towel Pull": "Stand on the middle of a strong towel with both feet, knees slightly bent and back flat, holding one end in each hand at about knee height. Build up over 2 seconds, then pull up as hard as you can for 6 seconds as if lifting a weight that will not move. Keep your back flat and keep breathing.",
    "Door-Frame Press": "Stand in a doorway under the top of the frame (stand on a sturdy step if you cannot reach) with your hands pressed up against it, elbows bent about 90°. Build up over 2 seconds, then press up as hard as you can for 6 seconds. Keep your ribs down and keep breathing.",
    "Deep Split Squat Hold": "Step into a long split stance. Lower your back knee toward the floor while pushing your front knee forward past your toes, front heel flat, torso upright. Hold the bottom. Alternate legs each hold. Back off if your knee hurts."

  function homeWords(str) {
    if (!(state.profile && state.profile.equipment === "home")) return str;
    return str.replace("Empty bar in Week 1", "Easiest version in Week 1").replace("the number on the bar", "the version you can do").replace("Start Week 1 with the empty bar", "Start Week 1 with the easiest version");
  }
  var homeCache = {};
  function homePhases(track, base) {
    registerHomeMaps();
    if (homeCache[track]) return homeCache[track];
    var copy = JSON.parse(JSON.stringify(base));
    Object.keys(copy).forEach(function(pk) {
      ["A", "B"].forEach(function(wk) {
        var w = copy[pk].workouts[wk];
        var h = HOME_PLAN[pk][wk];
        w.exercises = w.exercises.map(function(e, i) {
          var hx = h.ex[i]; if (!hx) return e;
          return { name: hx[0], sets: hx[1] || e.sets, rest: e.rest };
        });
        w.tendon = h.tendon;
        w.warmup = w.warmup.map(function(l) {
          if (/ramp-up|easy pull-up/i.test(l)) return "2–3 easy practice sets of your first exercise";
          return HOME_WARMUP[l] || l;
        });
        w.warmup.splice(Math.max(1, w.warmup.length - 1), 0, HOME_HIP_LINE);
        w.homeAlt = HOME_INTRO;
      });
      copy[pk].note = copy[pk].note.replace(/Empty 20kg bar( \(or your lightest dumbbells\))? in Week 1\./, "Start with the easiest version you can do with perfect form.").replace("+1.25kg on main lifts weekly — miss reps, repeat the weight.", "Add a rep or two each week. When you reach the top of the rep range on every set, move to the “Make it harder” version.").replace("Elite bodyweight mastery + heavy irregular-object lifting.", "Advanced bodyweight strength and power.");

  function dayHeadline(dayNum, phase, liftType, gppType) {
    var t = DAY_TYPE[dayNum];
    if (t === "lift") return getPhases()[phase].workouts[liftType].name;
    if (t === "gpp") return gppType === "ruck" ? "GPP — Load Carriage (Ruck)" : "GPP — Speed & Agility";
    if (t === "cardio") return "Run";
    if (t === "recovery") return "Active Recovery";
    return "Full Rest";
  }

  function buildSteps(dayNum, phase, liftType, gppType, deload) {
    var t = DAY_TYPE[dayNum], steps = [];
    if (t === "lift") {
      var w = getPhases()[phase].workouts[liftType];
      steps.push({kind:"warmup", title:"Warm-up", sub:"10 min", items:w.warmup});
      if (state.profile && state.profile.equipment === "home" && w.homeAlt) {
        steps.push({kind:"homealt", title:"Your Home Workout", text:w.homeAlt});
      }
      steps.push({kind:"tendon", title:"Tendon Prep", sub:"4×30s · 60s rest", text:w.tendon});
      w.exercises.forEach(function(e){ steps.push({kind:"exercise", title:e.name, sets: deload ? deloadSetsString(e.sets) : e.sets, rest:e.rest, isMainLift:!!e.main, swappedFrom:e.swappedFrom || null, ladderKey:e.ladderKey || null, ladderGoal:e.ladderGoal || null}); });
      steps.push({kind:"stretch", title:"Stretch", sub:"5 min", items:w.stretch});
    } else if (t === "gpp") {
      if (gppType === "ruck") {
        var d = deload ? RUCK_DOSING_DELOAD[phase] : RUCK_DOSING[phase];
        steps.push({kind:"gpp", title:"Ruck", sub:"Load Carriage",
          stats:[{v:d.load,l:"Load (BW)"},{v:d.duration,l:"Duration"}],
          note:"Backpack or ruck, steady pace on flat or rolling ground. If your back rounds or your breathing goes ragged, drop the weight before you cut the time."});
      } else {
        steps.push({kind:"gpp", title:"Sprints", sub:"Max Effort",
          stats: deload ? [{v:"4 × 20–30m",l:"Reps"},{v:"90s–2m",l:"Rest"}] : [{v:"6–8 × 20–30m",l:"Reps"},{v:"90s–2m",l:"Rest"}],
          note:"Full effort on every rep, full recovery between. Stop the session if your speed starts dropping off."});
        steps.push({kind:"gpp", title:"Agility", sub:"5-Meter Shuttle",
          stats: deload ? [{v:"3",l:"Sets"},{v:"20–30s",l:"Per Set"}] : [{v:"4–6",l:"Sets"},{v:"20–30s",l:"Per Set"}],
          note:"Set two markers (water bottles, shoes, anything) about 5 meters apart. Sprint to the far one, touch the ground with one hand, sprint back and touch the near one — that's one rep, keep going for the full 20–30s. Stay low and plant hard on each direction change. Full recovery between sets. Have an agility ladder or cones? Use your usual ladder-footwork or cone-shuttle drill instead — this is just the no-equipment default."});
      }
      steps.push({kind:"balance", title:"Balance", sub:"5–8 min", items: BALANCE_ITEMS});
    } else if (t === "cardio") {
      var rp = deload ? RUN_PLAN.deload : RUN_PLAN[phase];
      steps.push({kind:"cardio", title:rp.title, sub:rp.sub, stats:rp.stats, note:rp.note, runLog:true});
      steps.push({kind:"balance", title:"Balance", sub:"5–8 min", items: BALANCE_ITEMS});
    } else if (t === "recovery") {
      RECOVERY_ITEMS.forEach(function(r){ steps.push({kind:"recovery", title:r.name, sub:r.dur, text:r.desc, items:r.items}); });
    } else {
      steps.push({kind:"rest", title:"Full Rest", text:"Nothing scheduled today. Sleep 7–8 hours and let the week's training absorb."});
    }
    return steps;
  }
