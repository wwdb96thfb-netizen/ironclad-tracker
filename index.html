<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ironclad Tracker</title>
<meta name="description" content="Operation Ironclad — 12-month functional strength &amp; GPP tracker.">
<meta name="theme-color" content="#20231A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironclad">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  /* layout: single-column mobile app shell — fixed header, scrolling body, fixed bottom bar during a session */
  :root {
    --bg: #EDE8DA; --surface: #F6F2E7; --surface-2: #DED5B8; --raised: #FFFDF6;
    --ink: #22241E; --ink-soft: #4B4E42; --ink-faint: #8A8572;
    --olive: #4E5E3E; --olive-deep: #38452D;
    --rust: #9B4A2B; --rust-soft: #C97B54;
    --amber: #A97A2E;
    --line: #C9C2AC; --line-strong: #A69D80;
    --good: #4E5E3E; --good-bg: #E3E8DA;
    --warn-bg: #F1DFC9;
    --on-accent: #F3EFE0; --on-accent-dim: #E3DEC9; --on-accent-soft: #D9D4C0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17190F; --surface: #20231A; --surface-2: #2B2E22; --raised: #262A1F;
      --ink: #EDE9D8; --ink-soft: #AFAC96; --ink-faint: #6F6C5B;
      --olive: #8FA377; --olive-deep: #6E8459;
      --rust: #D98A5E; --rust-soft: #C97B54;
      --amber: #D4A24E;
      --line: #3A3D2E; --line-strong: #4E5241;
      --good: #8FA377; --good-bg: #27301F;
      --warn-bg: #3B2A1C;
      --on-accent: #F3EFE0; --on-accent-dim: #E3DEC9; --on-accent-soft: #D9D4C0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17190F; --surface: #20231A; --surface-2: #2B2E22; --raised: #262A1F;
    --ink: #EDE9D8; --ink-soft: #AFAC96; --ink-faint: #6F6C5B;
    --olive: #8FA377; --olive-deep: #6E8459;
    --rust: #D98A5E; --rust-soft: #C97B54;
    --amber: #D4A24E;
    --line: #3A3D2E; --line-strong: #4E5241;
    --good: #8FA377; --good-bg: #27301F;
    --warn-bg: #3B2A1C;
    --on-accent: #F3EFE0; --on-accent-dim: #E3DEC9; --on-accent-soft: #D9D4C0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  button { font-family: inherit; }

  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; max-width: 520px; margin: 0 auto; width: 100%; }

  /* ---- top bar ---- */
  .topbar {
    flex-shrink: 0; background: var(--olive-deep); color: var(--on-accent);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; display: flex; align-items: center; gap: 10px;
    border-bottom: 3px solid var(--rust);
  }
  .topbar .tb-btn {
    background: none; border: none; color: var(--on-accent); padding: 6px; margin: -6px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  .topbar .tb-btn:active { background: rgba(255,255,255,0.14); }
  .tb-title-wrap { flex: 1; min-width: 0; }
  .tb-title-wrap .tb-main { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 1.05rem; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-title-wrap .tb-sub { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--on-accent-soft); margin-top: 1px; }
  .progress-wrap { flex-shrink: 0; padding: 0 16px 8px; background: var(--olive-deep); }
  .progress-track { height: 4px; background: rgba(255,255,255,0.18); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--rust-soft); transition: width 0.25s ease; }
  .progress-label { padding: 5px 0 0; color: var(--on-accent-soft); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.03em; }

  /* ---- scroll body ---- */
  .body-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); min-height: 0; }
  .body-scroll.with-bottombar { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

  /* ---- bottom nav (home mode) ---- */
  .bottomnav {
    flex-shrink: 0; display: flex; border-top: 1px solid var(--line); background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bottomnav button, .bottomnav .nav-link {
    flex: 1; background: none; border: none; padding: 10px 4px 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--ink-faint); font-size: 11px; font-family: 'Oswald', sans-serif; letter-spacing: 0.02em;
    -webkit-tap-highlight-color: transparent; text-decoration: none;
  }
  .bottomnav button.active { color: var(--olive); }
  .bottomnav svg { width: 20px; height: 20px; }

  /* ---- bottom action bar (session mode) ---- */
  .bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center;
  }
  .bottombar-inner { max-width: 520px; width: 100%; display: flex; gap: 10px; }

  /* ---- "updated" toast: no action needed, just fades out on its own ---- */
  .sw-update-toast {
    position: fixed; left: 12px; right: 12px; z-index: 50;
    top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--olive-deep); color: var(--on-accent);
    border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px;
    opacity: 1; transition: opacity 0.5s ease;
  }
  /* Needs higher specificity than the display:flex above, or the [hidden]
     attribute's default display:none never wins and the toast — despite
     JS correctly marking it hidden — stays on screen forever. */
  .sw-update-toast[hidden] { display: none; }
  .sw-update-toast.fade-out { opacity: 0; }

  /* ---- buttons ---- */
  .btn {
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.01em;
    border-radius: 8px; border: none; padding: 15px 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    -webkit-tap-highlight-color: transparent; transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--olive); color: #fff; flex: 1; }
  .btn-primary:active { background: var(--olive-deep); }
  .btn-danger { background: var(--rust); color: #fff; }
  .btn-danger:active { background: var(--rust-soft); }
  .btn-ghost { background: var(--surface-2); color: var(--ink); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.5; pointer-events: none; }

  /* ---- cards / sections ---- */
  .section-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
    color: var(--ink-faint); text-transform: uppercase; margin: 22px 0 8px;
  }
  .section-label:first-child { margin-top: 0; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
  }

  /* ---- next-up hero card ---- */
  .next-card {
    background: var(--olive-deep); color: var(--on-accent); border-radius: 14px; padding: 20px;
    margin-bottom: 16px;
  }
  .next-card .nc-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--on-accent-soft); margin-bottom: 4px; }
  .next-card .nc-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.5rem; line-height: 1.15; margin: 0 0 4px; text-wrap: balance; }
  .next-card .nc-meta { font-size: 13px; color: var(--on-accent-soft); margin-bottom: 16px; }
  .next-card .btn-primary { background: var(--on-accent); color: var(--olive-deep); }
  .next-card .btn-primary:active { background: var(--on-accent-dim); }

  /* ---- day chips ---- */
  .day-chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 4px; }
  .day-chip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 2px; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .day-chip .dc-n { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-faint); }
  .day-chip .dc-t { font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 600; margin-top: 2px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-chip.is-next { border-color: var(--olive); background: var(--good-bg); }
  .day-chip.lift .dc-t { color: var(--olive); }
  .day-chip.gpp .dc-t { color: var(--amber); }
  .day-chip.cardio .dc-t { color: var(--rust); }

  /* ---- phase selector ---- */
  .phase-select { display: flex; gap: 6px; }
  .phase-btn {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 6px; text-align: center; cursor: pointer; font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 13px; color: var(--ink-soft); -webkit-tap-highlight-color: transparent;
  }
  .phase-btn.active { background: var(--olive); color: #fff; border-color: var(--olive); }

  /* ---- onboarding (first-launch intake) ---- */
  .onb-wrap { padding: 4px 0 24px; }
  .onb-head { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .02em; margin: 4px 0 2px; }
  .onb-sub { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.5; }
  .onb-label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 22px 0 8px; }
  .onb-label:first-of-type { margin-top: 0; }
  .choice-row { display: flex; gap: 8px; }
  .choice-row .choice-item { flex: 1; text-align: center; }
  .choice-list { display: flex; flex-direction: column; gap: 8px; }
  .choice-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .choice-item .ci-title { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink); }
  .choice-item .ci-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .choice-item.active { background: var(--good-bg); border-color: var(--olive); }
  .choice-item.active .ci-title { color: var(--olive); }
  .onb-error { font-size: 12.5px; color: var(--rust); margin: 14px 0 0; }

  /* ---- banner ---- */
  .banner { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; display:flex; align-items:center; gap:8px; }
  .banner svg { flex-shrink: 0; width: 16px; height: 16px; }
  .banner-warn { background: var(--warn-bg); color: var(--rust); }

  /* ---- log list ---- */
  .log-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .log-row:last-child { border-bottom: none; }
  .log-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--olive); flex-shrink: 0; }
  .log-dot.gpp { background: var(--amber); } .log-dot.cardio { background: var(--rust); } .log-dot.recovery { background: var(--ink-faint); } .log-dot.rest { background: var(--line-strong); }
  .log-main { flex: 1; min-width: 0; }
  .log-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); flex-shrink: 0; }
  .log-del {
    background: none; border: none; padding: 6px; margin: -6px -6px -6px 2px; flex-shrink: 0;
    color: var(--ink-faint); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .log-del:active { background: var(--surface-2); color: var(--rust); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-faint); }
  .empty-state svg { width: 40px; height: 40px; margin-bottom: 10px; opacity: 0.5; }
  .empty-state p { font-size: 13.5px; margin: 0; line-height: 1.5; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-tile { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .stat-tile .st-n { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.5rem; color: var(--olive); font-variant-numeric: tabular-nums; }
  .stat-tile .st-l { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  /* ---- session step ---- */
  .step-kind { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--rust); text-transform: uppercase; margin-bottom: 6px; }
  .step-kind.warmup, .step-kind.stretch { color: var(--olive); }
  .step-kind.tendon { color: var(--amber); }
  .step-title { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.7rem; line-height: 1.1; margin: 0 0 18px; text-wrap: balance; }

  .ex-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .ex-header .step-title { margin: 0; }
  .ex-icon {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 10px;
    background: var(--surface-2); color: var(--olive);
    display: flex; align-items: center; justify-content: center;
  }
  .ex-icon svg { width: 26px; height: 26px; }

  .stat-pair { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat-big { flex: 1; min-width: 90px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 10px; text-align: center; }
  .stat-big .sb-v { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.55rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat-big .sb-l { font-family: 'Oswald', sans-serif; font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-faint); text-transform: uppercase; margin-top: 5px; }

  .set-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .set-row {
    display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .set-row:active { background: var(--surface-2); }
  .set-row.filled { background: var(--good-bg); border-color: var(--olive); }
  .set-row .sr-check {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff; transition: all 0.15s ease;
  }
  .set-row.filled .sr-check { background: var(--olive); border-color: var(--olive); }
  .set-row .sr-label { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); }
  .set-row.filled .sr-label { color: var(--good); }
  .set-hint { text-align: center; font-size: 12px; color: var(--ink-faint); margin: 0 0 20px; }

  .rest-timer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: -6px 0 20px; }
  .rest-timer.done { border-color: var(--olive); background: var(--good-bg); }
  .rt-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .rt-label { font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.04em; color: var(--ink-faint); text-transform: uppercase; }
  .rest-timer.done .rt-label { color: var(--good); }
  .rt-skip {
    background: var(--surface-2); border: none; border-radius: 6px; padding: 5px 12px;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11.5px; color: var(--ink-soft);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .rt-time {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.7rem;
    font-variant-numeric: tabular-nums; color: var(--ink); margin-bottom: 8px; display: flex; align-items: center;
  }
  .rest-timer.done .rt-time { color: var(--good); }
  .rt-track { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .rt-fill { height: 100%; background: var(--rust-soft); transition: width 0.2s linear; }
  .rest-timer.done .rt-fill { background: var(--olive); width: 100% !important; }

  .item-list { list-style: none; margin: 0 0 20px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .item-list li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; font-size: 14.5px; line-height: 1.4; }

  .instr-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .instr-card p { margin: 0; font-size: 15px; line-height: 1.5; }
  .instr-card p + p { margin-top: 10px; color: var(--ink-soft); font-size: 13.5px; }

  .sketch-wrap { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .sk-svg { width: 100%; max-width: 320px; display: block; margin: 0 auto; }
  .sk-svg .bf-torso, .sk-svg .bf-limb { fill: none; stroke: var(--surface-2); stroke-linecap: round; stroke-linejoin: round; }
  .sk-svg .bf-torso { stroke-width: 15; }
  .sk-svg .bf-limb { stroke-width: 10; }
  .sk-svg .bf-limb.bf-leg { stroke-width: 13; }
  .sk-svg .bf-back { stroke: var(--surface-2); opacity: 0.55; }
  .sk-svg .bf-torso-poly { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.2; }
  .sk-svg circle.bf-head { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.3; }
  .sk-svg circle.bf-joint { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
  .sk-svg .sk-prop { stroke: var(--rust); stroke-width: 2.2; fill: none; }
  .sk-svg .sk-prop-fill { fill: var(--rust); stroke: none; }
  .sk-svg .sk-ground { stroke: var(--line-strong); stroke-width: 1.5; }
  .sk-svg .sk-div { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
  .sk-svg .sk-label { fill: var(--ink-faint); font-family: 'JetBrains Mono', monospace; font-size: 7px; text-transform: uppercase; letter-spacing: 0.04em; text-anchor: middle; }
  .manual-sketch { margin: 6px 0 2px; }

  .mm-svg { width: 100%; max-width: 260px; display: block; margin: 0 auto; }
  .mm-svg .mm-torso { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.2; }
  .mm-svg .mm-limb { fill: none; stroke: var(--surface-2); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
  .mm-svg .mm-limb.mm-leg { stroke-width: 14; }
  .mm-svg .mm-head { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.2; }
  .mm-svg .mm-region { fill: none; stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 2 2; opacity: 0.6; }
  .mm-svg .mm-region.active { fill: var(--rust); stroke: var(--rust); opacity: 0.92; stroke-dasharray: none; }

  .tendon-box { background: var(--surface); border: 1px dashed var(--amber); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .tendon-box p { margin: 0; font-size: 15px; line-height: 1.4; }

  .note-line { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.5; }

  /* ---- summary screen ---- */
  .summary-hero { text-align: center; padding: 28px 16px 20px; }
  .summary-hero .check-circle {
    width: 64px; height: 64px; border-radius: 50%; background: var(--good-bg); color: var(--good);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
  }
  .summary-hero h2 { font-family: 'Oswald', sans-serif; font-size: 1.6rem; margin: 0 0 4px; }

  function buildSteps(dayNum, phase, liftType, gppType) {
    var t = DAY_TYPE[dayNum], steps = [];
    if (t === "lift") {
      var w = getPhases()[phase].workouts[liftType];
      steps.push({kind:"warmup", title:"Warm-up", sub:"10 min", items:w.warmup});
      if (state.profile && state.profile.equipment === "home" && w.homeAlt) {
        steps.push({kind:"homealt", title:"No Gym? No Problem", text:w.homeAlt});
      }
      steps.push({kind:"tendon", title:"Tendon Prep", sub:"4×20s · 60s rest", text:w.tendon});
      w.exercises.forEach(function(e){ steps.push({kind:"exercise", title:e.name, sets:e.sets, rest:e.rest, isMainLift:!!e.main}); });
      steps.push({kind:"stretch", title:"Stretch", sub:"5 min", items:w.stretch});
    } else if (t === "gpp") {
      if (gppType === "ruck") {
        var d = RUCK_DOSING[phase];
        steps.push({kind:"gpp", title:"Ruck", sub:"Load Carriage",
          stats:[{v:d.load,l:"Load (BW)"},{v:d.duration,l:"Duration"}],
          note:"Backpack or ruck, steady pace on flat or rolling ground. If your back rounds or your breathing goes ragged, drop the weight before you cut the time."});
      } else {
        steps.push({kind:"gpp", title:"Sprints", sub:"Max Effort",
          stats:[{v:"6–8 × 20–30m",l:"Reps"},{v:"90s–2m",l:"Rest"}],
          note:"Full effort on every rep, full recovery between. Stop the session if your speed starts dropping off."});
        steps.push({kind:"gpp", title:"Agility", sub:"5-Meter Shuttle",
          stats:[{v:"4–6",l:"Sets"},{v:"20–30s",l:"Per Set"}],

      }
      steps.push({kind:"balance", title:"Balance", sub:"5–8 min", items: BALANCE_ITEMS});
    } else if (t === "cardio") {
      steps.push({kind:"cardio", title:"Cardio", sub:"Easy Pace",
        stats:[{v:"20–30",l:"Minutes"}],
        note:"Walk, jog, cycle, or swim. Keep it conversational — you should be able to talk, not gasp."});
      steps.push({kind:"balance", title:"Balance", sub:"5–8 min", items: BALANCE_ITEMS});

      RECOVERY_ITEMS.forEach(function(r){ steps.push({kind:"recovery", title:r.name, sub:r.dur, text:r.desc, items:r.items}); });
    } else {
      steps.push({kind:"rest", title:"Full Rest", text:"Nothing scheduled today. Sleep 7–8 hours and let the week's training absorb."});
    }
    return steps;
  }

  /* ============================================================
     PERSISTENCE
  ============================================================ */
  function todayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

  // Everything below persists to this device's own localStorage — no
  // network, no account, nothing leaves the phone. That's what makes the
  // app work fully offline once it's loaded once.
  function lsGet(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  function initDb() {
    var saved = lsGet(LS_SETTINGS_KEY, null);
    if (saved) {
      state.settings.phase = saved.phase || 1;
      state.settings.nextDayNumber = saved.nextDayNumber || 1;
      state.settings.nextLiftType = saved.nextLiftType || "A";
      state.settings.nextGppType = saved.nextGppType || "ruck";
      state.settings.cycleStartDate = saved.cycleStartDate || null;
      state.settings.lastWeights = saved.lastWeights || {};
    }
    state.logEntries = lsGet(LS_LOG_KEY, []);
    state.measurements = lsGet(LS_MEASUREMENTS_KEY, []);
    state.profile = lsGet(LS_PROFILE_KEY, null);
    state.loading = false;
    render();
    // First-ever load with no stored cycleStartDate — start the deload
    // clock now rather than leaving it unset forever.
    if (!state.settings.cycleStartDate) saveSettings({ cycleStartDate: Date.now() });
  }

  function persistSettings() {
    if (!lsSet(LS_SETTINGS_KEY, state.settings)) { state.persistOk = false; render(); }
  }
  function persistLog() {
    if (!lsSet(LS_LOG_KEY, state.logEntries)) { state.persistOk = false; render(); }
  }
  function persistMeasurements() {
    if (!lsSet(LS_MEASUREMENTS_KEY, state.measurements)) { state.persistOk = false; render(); }
  }

  function saveSettings(patch) {
    Object.assign(state.settings, patch);
    render();
    persistSettings();
  }

  var LEVEL_LABELS = { beginner:"New to training", returning:"Returning after a break", experienced:"Experienced" };
  var EQUIPMENT_LABELS = { gym:"Full gym access", home:"Home / limited equipment" };
  // Shown on Home during Phase 1 only — the level question changes how
  // cautiously you should approach Week 1, not the underlying program.
  var LEVEL_TIPS = {
    beginner: "New to training: take extra ramp-up sets and prioritize clean form over the number on the bar — the weekly progression will still get you there.",
    returning: "Returning after a break: treat your first 2–3 weeks as conservative on purpose, even if a weight feels easy — let your joints and tendons catch up before your muscles push ahead of them.",
    experienced: "Experienced: still start Week 1 honest and light. Phase 1 is for re-grooving the lifts, not testing your old max."
  };

  // Onboarding: set once, editable later from Settings. Changing sex later
  // switches which track getPhases()/getCallouts() resolve to — the
  // training log and body-measurement history are untouched either way,
  // since both are stored completely separately from the profile.
  function saveProfile(profile) {
    state.profile = profile;
    state.onboardDraft = { sex: null, level: null, equipment: null, age: "", weight: "" };
    state.onboardError = null;
    lsSet(LS_PROFILE_KEY, profile);
    render();
  }
  function resetProfile() {
    // Pre-fill the draft from what's already there instead of blanking it —
    // "Edit My Details" should let you fix one field, not force you to
    // retype everything from memory. And deliberately DON'T clear
    // localStorage here: if the edit gets interrupted (app closed, tab
    // backgrounded and killed) before saveProfile() below ever runs, the
    // next launch falls back to the profile that was already saved instead
    // of losing it and getting stuck on a blank intake screen.
    var p = state.profile;
    state.onboardDraft = p ? {
      sex: p.sex || null, level: p.level || null, equipment: p.equipment || null,
      age: (p.age != null ? String(p.age) : ""), weight: (p.weightKg != null ? String(p.weightKg) : "")
    } : { sex: null, level: null, equipment: null, age: "", weight: "" };
    state.profile = null;
    state.onboardError = null;
    render();
  }

  function submitOnboarding() {
    var d = state.onboardDraft;
    var age = d.age !== "" ? parseInt(d.age, 10) : NaN;
    var weightKg = d.weight !== "" ? parseFloat(d.weight) : NaN;
    if (!d.sex || !d.level || !d.equipment || isNaN(age) || age < 10 || age > 100 || isNaN(weightKg) || weightKg <= 0 || weightKg > 300) {
      state.onboardError = "Pick an option for each question above, and enter a valid age and weight, before starting.";
      renderKeepScroll();
      return;
    }
    saveProfile({ sex: d.sex, age: age, weightKg: weightKg, level: d.level, equipment: d.equipment });
  }

  function saveLogEntry(entry) {
    entry.id = "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    state.logEntries = state.logEntries || [];
    state.logEntries.unshift(entry);
    state.logEntries.sort(function(a,b){ return (b.completedAt||0) - (a.completedAt||0); });
    state.logError = null;
    persistLog();
  }

  // Body-measurement log — independent of the training log, same plain
  // local read/write pattern.
  function saveMeasurementEntry(entry) {
    entry.id = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    state.measurements = state.measurements || [];
    state.measurements.unshift(entry);
    state.measurements.sort(function(a,b){ return (b.completedAt||0) - (a.completedAt||0); });
    state.measureError = null;
    persistMeasurements();
  }

  function deleteMeasurement(id) {
    if (!id) return;
    state.measurements = (state.measurements || []).filter(function(e){ return e.id !== id; });
    persistMeasurements();
    state.toast = "Measurement deleted";
    render();
    setTimeout(function(){ state.toast = null; render(); }, 3000);
  }

  function addMeasurementFromForm() {
    function numOrNull(id) {
      var el = document.getElementById(id);
      if (!el || el.value === "" || el.value == null) return null;
      var n = parseFloat(el.value);
      return isNaN(n) ? null : n;
    }
    var weight = numOrNull("pf-weight"), waist = numOrNull("pf-waist"),
        chest = numOrNull("pf-chest"), arms = numOrNull("pf-arms"), thighs = numOrNull("pf-thighs");
    var notesEl = document.getElementById("pf-notes");
    var notes = notesEl && notesEl.value ? notesEl.value.trim() : "";
    if (weight == null && waist == null && chest == null && arms == null && thighs == null && !notes) {
      state.toast = "Enter at least one measurement first";
      render();
      setTimeout(function(){ state.toast = null; render(); }, 2500);
      return;
    }
    saveMeasurementEntry({
      date: todayKey(), completedAt: Date.now(),
      weight: weight, waist: waist, chest: chest, arms: arms, thighs: thighs,
      notes: notes
    });
    state.toast = "Measurement saved";
    render();
    setTimeout(function(){ state.toast = null; render(); }, 2500);
  }

  /* ============================================================
     ACTIONS
  ============================================================ */
  function startSession(dayNum) {
    var s = state.settings;
    var type = DAY_TYPE[dayNum];
    var steps = buildSteps(dayNum, s.phase, s.nextLiftType, s.nextGppType);
    clearRestInterval();
    state.session = {
      dayNum: dayNum, phase: s.phase, liftType: s.nextLiftType, gppType: s.nextGppType,
      type: type, headline: dayHeadline(dayNum, s.phase, s.nextLiftType, s.nextGppType),
      steps: steps, idx: 0, setDots: {}, restTimer: null, weights: {}
    };
    state.confirm = null;
    state.screen = "session";
    render();
  }

  function completeStep() {
    var sess = state.session;
    if (setsRemaining(sess.steps[sess.idx], sess.idx) > 0) return; // all sets must be ticked first
    clearRestInterval();
    sess.restTimer = null;
    if (sess.idx < sess.steps.length - 1) {
      sess.idx++;
      render();
      var scroller = document.querySelector(".body-scroll");
      if (scroller) scroller.scrollTop = 0;
    } else {
      state.screen = "summary";
      render();
    }
  }

  function backStep() {
    var sess = state.session;
    clearRestInterval();
    sess.restTimer = null;
    if (sess.idx > 0) { sess.idx--; render(); }
    else { openExitConfirm(); }
  }

  function exitSession() {
    clearRestInterval();
    state.session = null;
    state.screen = "home";
    render();
  }

  function finishDay() {
    var sess = state.session;
    clearRestInterval();
    var entry = {
      date: todayKey(), dayNumber: sess.dayNum, phase: sess.phase, type: sess.type,
      headline: sess.headline, items: sess.steps.map(function(s){ return s.title; }),
      completedAt: Date.now()
    };
    var nextDay = (sess.dayNum % 7) + 1;
    var patch = { nextDayNumber: nextDay };
    if (sess.type === "lift") patch.nextLiftType = sess.liftType === "A" ? "B" : "A";
    if (sess.type === "gpp") patch.nextGppType = sess.gppType === "ruck" ? "speed" : "ruck";

    // Carry forward any weight the main lift logged this session so next
    // time's progression hint ("+1.25kg" / "repeat") has something to go on.
    var weightUpdates = null;
    sess.steps.forEach(function(st, i){
      if (!st.isMainLift) return;
      var w = sess.weights[i];
      if (!w || w.weight === undefined || w.weight === null || w.weight === "") return;
      var num = parseFloat(w.weight);
      if (isNaN(num)) return;
      if (!weightUpdates) weightUpdates = Object.assign({}, state.settings.lastWeights);
      weightUpdates[st.title] = { weight: num, hitAll: w.hitAll !== false, date: todayKey() };
    });
    if (weightUpdates) patch.lastWeights = weightUpdates;

    saveLogEntry(entry);
    saveSettings(patch);
    state.toast = "Logged: " + sess.headline;
    state.session = null;
    state.screen = "home";
    render();
    setTimeout(function(){ state.toast = null; render(); }, 3500);
  }

  function toggleSetDot(stepIdx, setIdx) {
    var sess = state.session;
    var key = stepIdx + "_" + setIdx;
    var wasFilled = !!sess.setDots[key];
    sess.setDots[key] = !wasFilled;
    var step = sess.steps[stepIdx];
    if (!wasFilled && setsRemaining(step, stepIdx) > 0) {
      startRestTimer(stepIdx, step); // just checked, more sets to go — start the rest clock
    } else {
      clearRestInterval();
      sess.restTimer = null;
    }
    renderKeepScroll();
  }

  function setPhase(p) { saveSettings({ phase: p }); }

  // Weight input is a plain number field — update state directly without a
  // full render() so typing doesn't blow away focus/cursor on every
  // keystroke (render() replaces the whole #app subtree via innerHTML).
  function setStepWeight(stepIdx, val) {
    var sess = state.session;
    if (!sess) return;
    if (!sess.weights[stepIdx]) sess.weights[stepIdx] = {};
    sess.weights[stepIdx].weight = val;
  }

  function setStepHitAll(stepIdx, hitAll) {
    var sess = state.session;
    if (!sess) return;
    if (!sess.weights[stepIdx]) sess.weights[stepIdx] = {};
    sess.weights[stepIdx].hitAll = hitAll;
    renderKeepScroll();
  }

  /* ---- deload cycle: a running count of weeks since the last deload
     week (or since the plan started, if none taken yet). Golden rule is
     "every 4–6 weeks", so 4 opens the window and 6 marks it overdue. ---- */
  function computeWeeksInCycle() {
    var start = state.settings.cycleStartDate;
    if (!start) return 0;
    return Math.floor((Date.now() - start) / (7*24*3600*1000));
  }

  function markDeloadTaken() {
    saveSettings({ cycleStartDate: Date.now() });
    state.toast = "Deload logged — new 4–6 week cycle started";
    render();
    setTimeout(function(){ state.toast = null; render(); }, 3500);
  }

  /* ---- rest timer: counts down between sets using a deadline (Date.now()
     comparison), not a naive per-tick decrement, so it stays accurate even
     if the tab is backgrounded for a moment. One module-level interval ref,
     always cleared before a new one starts — the earlier onSnapshot bug
     taught us duplicate intervals/subscriptions are easy to leak. ---- */
  function parseRestSeconds(restStr) {
    var m = /([\d.]+)\s*(m|s)\s*$/i.exec(restStr || "");
    if (!m) return 0;
    var val = parseFloat(m[1]);
    return m[2].toLowerCase() === "m" ? Math.round(val * 60) : Math.round(val);
  }

  function clearRestInterval() {
    if (restInterval) { clearInterval(restInterval); restInterval = null; }
  }

  // Ticks every 250ms while resting. Deliberately does NOT call the full
  // render() on every tick — that replaces the whole #app subtree via
  // innerHTML, which was yanking the Skip button's DOM node out from under
  // an in-progress tap every quarter-second and making it register
  // inconsistently. A running timer only patches its own two small nodes in
  // place; a full render() only happens on the done transition, where the
  // card's layout actually changes.
  function tickRestTimer() {
    var rt = state.session && state.session.restTimer;
    if (!rt) { clearRestInterval(); return; }
    var remaining = Math.max(0, Math.ceil((rt.endsAt - Date.now()) / 1000));
    if (remaining <= 0 && !rt.done) {
      rt.done = true;
      clearRestInterval();
      playBeep();
      renderKeepScroll();
      return;
    }
    patchRestTimerDom(rt, remaining);
  }

  function patchRestTimerDom(rt, remaining) {
    var card = document.querySelector(".rest-timer");
    if (!card) { render(); return; } // DOM fell out of sync with state — fall back to a full render
    var mm = Math.floor(remaining / 60), ss = remaining % 60;
    var timeEl = card.querySelector(".rt-time");
    if (timeEl) timeEl.textContent = mm > 0 ? (mm + ":" + String(ss).padStart(2,"0")) : (ss + "s");
    var fillEl = card.querySelector(".rt-fill");
    if (fillEl && rt.totalSec) {
      var pct = Math.max(0, Math.min(100, Math.round(((rt.totalSec - remaining) / rt.totalSec) * 100)));
      fillEl.style.width = pct + "%";
    }
  }

  function startRestTimer(stepIdx, step) {
    var sec = parseRestSeconds(step.rest);
    if (!sec) return;
    ensureAudio(); // warm up the audio context inside this user gesture so the later beep isn't blocked
    clearRestInterval();
    state.session.restTimer = { stepIdx: stepIdx, endsAt: Date.now() + sec * 1000, totalSec: sec, done: false };
    restInterval = setInterval(tickRestTimer, 250);
  }

  function dismissRestTimer() {
    clearRestInterval();
    if (state.session) state.session.restTimer = null;
    renderKeepScroll();
  }

  function resumeRestTimerIfNeeded() {
    var rt = state.session && state.session.restTimer;
    if (rt && !rt.done) { clearRestInterval(); restInterval = setInterval(tickRestTimer, 250); }
  }

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = AC ? new AC() : null;
    } catch (e) { audioCtx = null; }
    return audioCtx;
  }

  function playBeep() {
    var ctx = ensureAudio();
    if (!ctx) return;
    try {
      if (ctx.state === "suspended") ctx.resume();
      var now = ctx.currentTime;
      [0, 0.18].forEach(function(offset){
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.15);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + offset); osc.stop(now + offset + 0.16);
      });
    } catch (e) {}
  }

  function openPhase3GateConfirm() {

    else if (c.action === "delete-entry") deleteLogEntry(c.payload.id);

  /* ============================================================
     RENDER HELPERS
  ============================================================ */
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
  function fmtKg(n){ var r = Math.round(n*100)/100; return (r % 1 === 0) ? String(r) : String(r.toFixed(2)).replace(/0$/,''); }

  function fmtDate(key) {
    var parts = key.split("-"); var d = new Date(+parts[0], +parts[1]-1, +parts[2]);
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  }

  function computeStreak(entries) {
    if (!entries || !entries.length) return 0;
    var dates = {}; entries.forEach(function(e){ dates[e.date] = true; });
    var streak = 0, cur = new Date();
    var key = todayKey(cur);
    if (!dates[key]) { cur.setDate(cur.getDate()-1); key = todayKey(cur); if (!dates[key]) return 0; }
    while (dates[todayKey(cur)]) { streak++; cur.setDate(cur.getDate()-1); }
    return streak;
  }

  function parseSetCount(setsStr) {
    var m = /^(\d+)×/.exec(setsStr);
    return m ? Math.min(parseInt(m[1],10), 6) : 0;
  }

  // Splits "3×8–10" into the set count and the "8–10" per-set unit text.
  function parseSetsUnit(setsStr) {
    var m = /^\d+×(.+)$/.exec(setsStr || "");
    return m ? m[1] : (setsStr || "");
  }

  // "8–10" / "15" (a plain rep count or range) reads as "8–10 reps"; anything
  // with its own unit already (40m, 30–45s, AMRAP, 10/side) is left as-is.
  function formatSetUnit(unit) {
    return /^\d+(\s*[–-]\s*\d+)?$/.test(unit) ? (unit + " reps") : unit;
  }

  // How many sets on this step still need to be ticked before Complete is
  // allowed. 0 for any non-exercise step, or an exercise with no set count.
  function setsRemaining(step, stepIdx) {
    if (!step || step.kind !== "exercise") return 0;
    var n = parseSetCount(step.sets);
    if (n <= 0) return 0;
    var dots = (state.session && state.session.setDots) || {};
    var left = 0;
    for (var i=0;i<n;i++) { if (!dots[stepIdx + "_" + i]) left++; }
    return left;
  }

  function renderStats(stats) {
    if (!stats || !stats.length) return "";
    var html = '<div class="stat-pair">';
    stats.forEach(function(s){
      html += '<div class="stat-big"><div class="sb-v">' + esc(s.v) + '</div><div class="sb-l">' + esc(s.l) + '</div></div>';
    });
    return html + '</div>';
  }

  function renderRestTimer(stepIdx) {
    var rt = state.session && state.session.restTimer;
    if (!rt || rt.stepIdx !== stepIdx) return '';
    var remaining = Math.max(0, Math.ceil((rt.endsAt - Date.now()) / 1000));
    var mm = Math.floor(remaining / 60), ss = remaining % 60;
    var label = mm > 0 ? (mm + ":" + String(ss).padStart(2,"0")) : (ss + "s");
    var pct = rt.totalSec ? Math.max(0, Math.min(100, Math.round(((rt.totalSec - remaining) / rt.totalSec) * 100))) : 100;
    return '<div class="rest-timer' + (rt.done ? ' done' : '') + '">' +
      '<div class="rt-row"><div class="rt-label">' + (rt.done ? 'Rest done — go again' : 'Resting') + '</div>' +
        '<button class="rt-skip" data-action="skip-rest">Skip</button></div>' +
      '<div class="rt-time">' + (rt.done ? ICONS.check : esc(label)) + '</div>' +
      '<div class="rt-track"><div class="rt-fill" style="width:' + pct + '%"></div></div>' +
    '</div>';
  }

    html += '<p class="ph-note">Takes you back to Day 1, Phase 1, Workout A / Ruck, and restarts the deload clock. Your training log and body measurements are not touched.</p>';

    html += '<p class="ph-note" style="text-align:center;margin-top:24px;font-family:\'JetBrains Mono\',monospace;color:var(--ink-faint)">Ironclad ' + esc(APP_VERSION) + '</p>';

    html += '</div>';
    return html + renderBottomNav();
  }

  function renderProfile() {
    var html = '<div class="body-scroll">';
    var entries = state.measurements || [];

    html += '<p class="note-line">Log your own measurements here whenever you take them — nothing is required, and nothing here feeds into the training plan. It’s just a private record of how your body is changing.</p>';

    if (state.measureError) {
      html += '<div class="banner banner-warn">' + ICONS.warn + '<span>Couldn’t load your measurements (' + esc(state.measureError) + ').</span></div>';
    }

    html += '<div class="section-label">Add a Measurement</div>';
    html += '<div class="card">';
    html += '<div class="field-row"><label>Weight (kg)</label><input class="field-input" type="number" inputmode="decimal" step="0.1" id="pf-weight" placeholder="e.g. 94.5"></div>';
    html += '<div class="field-grid">';
    html += '<div class="field-row"><label>Waist (cm)</label><input class="field-input" type="number" inputmode="decimal" step="0.1" id="pf-waist" placeholder="—"></div>';

    html += '<div class="field-row"><label>Thighs (cm)</label><input class="field-input" type="number" inputmode="decimal" step="0.1" id="pf-thighs" placeholder="—"></div>';

    html += '<div class="field-row"><label>Notes</label><textarea class="field-input notes" id="pf-notes" placeholder="Optional"></textarea></div>';

      html += '<div class="empty-state">' + ICONS.empty + (state.measurements===null?'<p>Loading…</p>':'<p>No measurements logged yet.</p>') + '</div>';
    } else {
      html += '<div class="card" style="padding:4px 16px">';
      entries.forEach(function(e){
        var parts = [];
        if (e.weight != null) parts.push('<b>' + esc(e.weight) + ' kg</b>');
        if (e.waist != null) parts.push('Waist ' + esc(e.waist) + 'cm');
        if (e.chest != null) parts.push('Chest ' + esc(e.chest) + 'cm');
        if (e.arms != null) parts.push('Arms ' + esc(e.arms) + 'cm');
        if (e.thighs != null) parts.push('Thighs ' + esc(e.thighs) + 'cm');
        html += '<div class="measure-row"><div class="measure-main"><div class="measure-date">' + fmtDate(e.date) + '</div>' +
          '<div class="measure-vals">' + (parts.length ? parts.join(' · ') : '—') + '</div>' +
          (e.notes ? '<div class="measure-vals" style="color:var(--ink-soft);margin-top:2px">' + esc(e.notes) + '</div>' : '') + '</div>' +
          '<button class="log-del" data-action="open-delete-measurement-confirm" data-id="' + esc(e.id||'') + '" data-date="' + esc(fmtDate(e.date)) + '" aria-label="Delete measurement">' + ICONS.trash + '</button></div>';
      });
      html += '</div>';
    }

    html += '</div>';
    return html + renderBottomNav();
  }

  // The Manual screen reads straight off getPhases() / RUCK_DOSING / BALANCE_ITEMS /
  // RECOVERY_ITEMS — the same data the tracker itself runs on — plus the handful
  // of reference-only lines in GOLDEN_RULES / getCallouts() above. No second
  // copy of the plan to drift out of sync, and it opens instantly in-app instead
  // of jumping to the separate field-manual page.
  function renderManual() {
    var html = '<div class="body-scroll">';

    html += '<div class="manual-hero">' +
      '<div class="mh-title">Operation Ironclad</div>' +
      '<div class="mh-sub">12-Month Functional Strength &amp; GPP Protocol</div>' +
      '<div class="mh-stats">FUNCTIONAL STRENGTH · GENERAL PHYSICAL PREPAREDNESS · GENERAL REFERENCE</div>' +
    '</div>';

    html += '<div class="manual-nav">';
    [["m-sch","Week"],["m-gpp","GPP"],["m-p1","Phase 1"],["m-p2","Phase 2"],["m-p3","Phase 3"],["m-rec","Recovery"]].forEach(function(n){
      html += '<button class="mn-chip" data-action="manual-jump" data-target="' + n[0] + '">' + n[1] + '</button>';
    });
    html += '</div>';

    html += '<div class="section-label" id="m-sch">Weekly Schedule</div>';
    html += '<p class="note-line">Three lifting days, one GPP day, one cardio day, one active-recovery day, one full rest day. Never two lifting days back to back.</p>';
    html += '<div class="day-chips" style="margin-bottom:14px">';
    for (var d=1; d<=7; d++) {
      var t = DAY_TYPE[d];
      html += '<div class="day-chip ' + t + '"><div class="dc-n">D' + d + '</div><div class="dc-t">' + DAY_SHORT[t] + '</div></div>';
    }
    html += '</div>';
    html += '<div class="banner" style="margin-bottom:20px">GPP day: odd weeks ruck, even weeks sprints &amp; agility. Deload one lighter week (~60%) every 4–6 weeks. Grip hangs, daily.</div>';

    html += '<div class="section-label" id="m-gpp">GPP — Combat Conditioning</div>';
    html += '<div class="card"><p class="mn-cardhead">Tendon Conditioning · every lift day</p>' +
      '<p class="mn-cardbody">Hold the day\'s first main lift at mid-range for 20s at ~70% effort. 4 sets, 60s rest — built into every workout below.</p></div>';
    html += '<div class="card"><p class="mn-cardhead">Load Carriage — Rucking · odd weeks, Day 2</p>';
    html += '<table class="moves-table"><tr><th>Phase</th><th>Load</th><th>Duration</th></tr>';
    [1,2,3].forEach(function(p){
      html += '<tr><td>Phase ' + p + '</td><td>' + esc(RUCK_DOSING[p].load) + ' BW</td><td>' + esc(RUCK_DOSING[p].duration) + '</td></tr>';
    });
    html += '</table></div>';
    html += '<div class="card"><p class="mn-cardhead">Speed &amp; Agility · even weeks, Day 2</p><ul class="item-list" style="margin:0">' +
      '<li>Sprints: 6–8 × 20–30m, max effort, full recovery between</li><li>Agility: 4–6 sets × 20–30s — two markers 5m apart, sprint-touch-sprint-touch between them, staying low on each turn. Have a ladder or cones? Use your usual drill instead.</li></ul></div>';
    html += '<div class="card" style="margin-bottom:20px"><p class="mn-cardhead">Balance &amp; Proprioception · Days 2 &amp; 4</p><ul class="item-list" style="margin:0">' +
      BALANCE_ITEMS.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul></div>';

    [1,2,3].forEach(function(p){
      var ph = getPhases()[p];
      html += '<div class="section-label" id="m-p' + p + '">' + esc(ph.name) + '</div>';
      html += '<p class="note-line">' + esc(ph.timeline) + ' — ' + esc(ph.note) + '</p>';
      ["A","B"].forEach(function(w){
        var wk = ph.workouts[w];
        html += '<div class="card manual-workout">';
        html += '<div class="mw-head">' + esc(wk.name) + '</div>';
        html += '<div class="mw-body">';
        if (state.profile && state.profile.equipment === "home" && wk.homeAlt) {
          html += '<p class="mn-label">No Gym? No Problem</p>';
          html += '<p class="mn-cardbody" style="margin-bottom:12px">' + esc(wk.homeAlt) + '</p>';
        }
        html += '<p class="mn-label">Warm-up</p>';
        html += '<ul class="item-list" style="margin:0 0 12px">' + wk.warmup.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul>';
        html += '<p class="mn-label amber">Tendon Prep</p>';
        html += '<p class="mn-cardbody" style="margin-bottom:12px">' + esc(wk.tendon) + '</p>';
        html += '<p class="mn-label">Movements</p>';
        var manualSex = state.profile && state.profile.sex === "female" ? "female" : "male";
        html += '<div style="margin-bottom:12px">' + wk.exercises.map(function(e){
          return '<div class="card" style="margin-bottom:10px;padding:12px 14px">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px">' +
            '<p class="mn-cardhead" style="margin:0">' + esc(e.name) + '</p>' +
            '<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:var(--ink-faint);white-space:nowrap">' + esc(e.sets) + ' · ' + esc(e.rest) + '</span>' +
            '</div>' +
            '<p class="mn-cardbody">' + esc(EX_HOWTO[e.name] || '') + '</p>' +
            (EX_SKETCH[e.name] ? '<div class="sketch-wrap manual-sketch">' + renderExerciseSketch(e.name) + '</div>' : '') +
            (EX_MUSCLES[e.name] ? '<div class="sketch-wrap manual-sketch"><div class="mn-label">Muscles Worked</div>' + renderMuscleMap(manualSex, EX_MUSCLES[e.name]) + '</div>' : '') +
            '</div>';
        }).join('') + '</div>';
        html += '<p class="mn-label olive">Stretch</p>';
        html += '<ul class="item-list" style="margin:0">' + wk.stretch.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul>';
        html += '</div></div>';
      });
      var co = getCallouts()[p];
      if (co) {
        html += '<div class="banner" style="flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:20px">' +
          '<strong class="mn-calloutlabel">' + esc(co.label) + '</strong>';
        if (co.text) html += '<span>' + esc(co.text) + '</span>';
        if (co.items) html += '<ul class="item-list" style="margin:4px 0 0;width:100%">' + co.items.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul>';
        html += '</div>';
      }
    });

    html += '<div class="section-label" id="m-rec">Recovery &amp; Active Rest</div>';
    RECOVERY_ITEMS.forEach(function(r){
      html += '<div class="card"><p class="mn-cardhead">' + esc(r.name) + ' · ' + esc(r.dur) + '</p><p class="mn-cardbody">' + esc(r.desc) + '</p>';
      if (r.items && r.items.length) {
        html += '<ol style="margin:10px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-soft)">' + r.items.map(function(it){ return '<li style="margin-bottom:6px">'+esc(it)+'</li>'; }).join('') + '</ol>';
      }
      html += '</div>';
    });
    html += '<div class="banner" style="margin-bottom:20px">Sleep 7–8 hours, every night.</div>';

    html += '<div class="section-label">Golden Rules</div>';
    html += '<p class="note-line" style="margin-bottom:8px">' + esc(GOLDEN_RULES) + '</p>';

    html += '</div>';
    return html + renderBottomNav();
  }

  function renderStepBody(step, stepIdx) {
    var html = '';
    if (step.kind === "exercise") {
      html += '<div class="step-kind">Exercise</div>';
      html += '<div class="ex-header"><div class="ex-icon">' + EX_ICONS[exerciseIconKey(step.title)] + '</div><h2 class="step-title">' + esc(step.title) + '</h2></div>';
      if (EX_HOWTO[step.title]) {
        var exSex = state.profile && state.profile.sex === "female" ? "female" : "male";
        html += '<div class="instr-card"><div class="mn-label">How To Do It</div><p>' + esc(EX_HOWTO[step.title]) + '</p>' +
          (EX_SKETCH[step.title] ? '<div class="sketch-wrap">' + renderExerciseSketch(step.title) + '</div>' : '') +
          (EX_MUSCLES[step.title] ? '<div class="sketch-wrap"><div class="mn-label">Muscles Worked</div>' + renderMuscleMap(exSex, EX_MUSCLES[step.title]) + '</div>' : '') +
          '</div>';
      }
      html += renderStats([{v:step.sets,l:"Sets × Reps"},{v:step.rest,l:"Rest"}]);
      if (step.isMainLift) {
        var lastW = state.settings.lastWeights && state.settings.lastWeights[step.title];
        var sessW = state.session.weights[stepIdx] || {};
        var curVal = (sessW.weight !== undefined && sessW.weight !== null) ? sessW.weight : (lastW ? lastW.weight : "");
        var hitAllVal = sessW.hitAll;
        var hint;
        if (lastW && lastW.weight != null) {
          if (lastW.hitAll === false) {
            hint = "Last session you missed a rep at " + fmtKg(lastW.weight) + "kg — repeat that weight today.";
            if (state.settings.phase > 1) hint += " Progress slows down from here — holding a weight for a few weeks is normal, not a setback.";
          } else {
            hint = "You hit every rep last time at " + fmtKg(lastW.weight) + "kg — try " + fmtKg(lastW.weight + MAIN_LIFT_STEP_KG) + "kg today.";
          }
        } else {
          hint = "Log today's working weight — next time I'll tell you when to add weight.";
        }
        html += '<div class="weight-card">';
        html += '<div class="weight-hint">' + esc(hint) + '</div>';
        html += '<div class="weight-row"><label>Weight (kg)</label><input class="weight-input" type="number" inputmode="decimal" step="0.25" data-step="' + stepIdx + '" data-input="set-weight" value="' + esc(curVal) + '"></div>';
        html += '<div class="hitall-toggle">' +
          '<button class="hitall-btn' + (hitAllVal===true?' active yes':'') + '" data-action="set-hitall" data-step="' + stepIdx + '" data-val="yes">' + ICONS.check + '<span>Hit all reps</span></button>' +
          '<button class="hitall-btn' + (hitAllVal===false?' active no':'') + '" data-action="set-hitall" data-step="' + stepIdx + '" data-val="no"><span>Missed a rep</span></button>' +
        '</div>';
        html += '</div>';
      }
      var n = parseSetCount(step.sets);
      if (n > 0) {
        var unit = formatSetUnit(parseSetsUnit(step.sets));
        html += '<div class="set-rows">';
        for (var i=0;i<n;i++) {
          var filled = state.session.setDots[stepIdx + "_" + i];
          html += '<div class="set-row' + (filled?' filled':'') + '" data-action="toggle-dot" data-step="' + stepIdx + '" data-i="' + i + '">' +
            '<div class="sr-check">' + (filled ? ICONS.check : '') + '</div>' +
            '<div class="sr-label">Set ' + (i+1) + ' · ' + esc(unit) + '</div>' +
          '</div>';
        }
        html += '</div>';
        var remaining = setsRemaining(step, stepIdx);
        html += '<p class="set-hint">' + (remaining > 0
          ? 'Tap each set as you finish it — ' + remaining + ' more to go before you can continue'
          : 'All sets done — you can continue') + '</p>';
        html += renderRestTimer(stepIdx);
      }
    } else if (step.kind === "warmup" || step.kind === "stretch") {
      var label = step.kind === "warmup" ? "Warm-up" : "Stretch";
      html += '<div class="step-kind ' + step.kind + '">' + label + ' · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">' + label + '</h2>';
      html += '<ul class="item-list">' + step.items.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul>';
    } else if (step.kind === "homealt") {
      html += '<div class="step-kind">Equipment</div>';
      html += '<h2 class="step-title">' + esc(step.title) + '</h2>';
      html += '<div class="instr-card"><p>' + esc(step.text) + '</p></div>';
      html += '<p class="note-line">Swap the lifts below for whatever you have on hand, same sets and reps — then tap through to the real exercise names for your rest times.</p>';
    } else if (step.kind === "tendon") {
      html += '<div class="step-kind tendon">Tendon Prep · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">Tendon Prep</h2>';
      html += '<div class="tendon-box"><p>' + esc(step.text) + '</p></div>';
      html += renderStats([{v:"4×20s",l:"Hold"},{v:"60s",l:"Rest"}]);
      html += '<p class="note-line">Firm, controlled tension at roughly 70% effort — not a maximal grind. Done before your working sets.</p>';
    } else if (step.kind === "gpp") {
      html += '<div class="step-kind">GPP · ' + esc(step.sub||'') + '</div>';
      html += '<h2 class="step-title">' + esc(step.title) + '</h2>';
      html += renderStats(step.stats);
      if (step.note) html += '<p class="note-line">' + esc(step.note) + '</p>';
    } else if (step.kind === "balance") {
      html += '<div class="step-kind">Balance · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">Balance</h2>';
      html += '<ul class="item-list">' + step.items.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul>';
    } else if (step.kind === "cardio") {
      html += '<div class="step-kind">Cardio · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">Cardio</h2>';
      html += renderStats(step.stats);
      if (step.note) html += '<p class="note-line">' + esc(step.note) + '</p>';
    } else if (step.kind === "recovery") {
      html += '<div class="step-kind">Recovery · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">' + esc(step.title) + '</h2>';
      html += '<div class="instr-card"><p>' + esc(step.text) + '</p></div>';
      if (step.items && step.items.length) {
        html += '<ul class="item-list">' + step.items.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul>';
      }
    } else if (step.kind === "rest") {
      html += '<div class="step-kind">Rest</div>';
      html += '<h2 class="step-title">Full Rest</h2>';
      html += '<div class="instr-card"><p>' + esc(step.text) + '</p></div>';
    }
    return html;
  }

  function renderSession() {
    var sess = state.session;
    var step = sess.steps[sess.idx];
    var isLast = sess.idx === sess.steps.length - 1;
    var locked = setsRemaining(step, sess.idx) > 0;
    var html = '<div class="body-scroll with-bottombar">' + renderStepBody(step, sess.idx) + '</div>';
    html += '<div class="bottombar"><div class="bottombar-inner">';
    html += '<button class="btn btn-primary btn-block" data-action="complete-step"' + (locked ? ' disabled aria-disabled="true"' : '') + '>' + ICONS.check + '<span>' + (isLast ? 'Finish Day' : 'Complete') + '</span></button>';
    html += '</div></div>';
    return html;
  }

  function renderConfirmOverlay() {
    var c = state.confirm;
    if (!c) return '';
    return '<div class="overlay" data-action="dismiss-confirm">' +
      '<div class="overlay-sheet" data-action="noop">' +
        '<h3>' + esc(c.title) + '</h3>' +
        '<p>' + c.body + '</p>' +
        '<div class="ov-actions"><button class="btn btn-ghost" style="flex:1" data-action="dismiss-confirm">' + esc(c.cancelLabel || 'Cancel') + '</button>' +
        '<button class="btn btn-danger" style="flex:1" data-action="confirm-action">' + esc(c.confirmLabel) + '</button></div>' +
      '</div></div>';
  }

  function renderSummary() {
    var sess = state.session;
    var html = '<div class="body-scroll">';
    html += '<div class="summary-hero"><div class="check-circle">' + ICONS.checkBig + '</div>' +
      '<h2>Day ' + sess.dayNum + ' Done</h2><p>' + esc(sess.headline) + '</p></div>';
    html += '<div class="card"><ul class="summary-list">';
    sess.steps.forEach(function(s){ html += '<li>' + ICONS.check + '<span>' + esc(s.title) + '</span></li>'; });
    html += '</ul></div>';
    html += '</div>';
    html += '<div class="bottombar"><div class="bottombar-inner">';
    html += '<button class="btn btn-primary btn-block" data-action="save-finish">Save &amp; Return Home</button>';
    html += '</div></div>';
    return html;
  }

  /* ============================================================
     MAIN RENDER
  ============================================================ */
  function render() {
    var app = document.getElementById("app");
    if (!state.profile) {
      app.innerHTML = '<div class="topbar"><div class="tb-title-wrap"><div class="tb-main">Operation Ironclad</div><div class="tb-sub">TRACKER</div></div></div>' + renderOnboarding();
      return;
    }
    var body;
    if (state.screen === "session") body = renderSession();
    else if (state.screen === "summary") body = renderSummary();
    else if (state.screen === "log") body = renderLog();
    else if (state.screen === "manual") body = renderManual();
    else if (state.screen === "profile") body = renderProfile();
    else if (state.screen === "settings") body = renderSettings();
    else body = renderHome();
    app.innerHTML = renderTopbar() + body + renderConfirmOverlay();
  }

  // For an in-place update (ticking a set, flipping a toggle, picking an
  // onboarding answer) that redraws the same screen rather than navigating
  // to a new one — render() always rebuilds a fresh scroll container, which
  // would otherwise silently snap back to the top every time.
  function renderKeepScroll() {
    var scroller = document.querySelector(".body-scroll");
    var top = scroller ? scroller.scrollTop : 0;
    render();
    var next = document.querySelector(".body-scroll");
    if (next) next.scrollTop = top;
  }

  /* ============================================================
     EVENTS
  ============================================================ */
  document.getElementById("app").addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "go-home") { state.screen = "home"; render(); }
    else if (action === "go-log") { state.screen = "log"; render(); }
    else if (action === "go-manual") {
      state.screen = "manual"; render();
      var scroller = document.querySelector(".body-scroll");
      if (scroller) scroller.scrollTop = 0;
    }
    else if (action === "manual-jump") {
      var target = document.getElementById(el.getAttribute("data-target"));
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    else if (action === "go-profile") { state.screen = "profile"; render(); }
    else if (action === "go-settings") { state.screen = "settings"; render(); }
    else if (action === "mark-deload-taken") { markDeloadTaken(); }
    else if (action === "add-measurement") { addMeasurementFromForm(); }
    else if (action === "open-delete-measurement-confirm") { openDeleteMeasurementConfirm(el.getAttribute("data-id"), el.getAttribute("data-date")); }
    else if (action === "set-hitall") { setStepHitAll(parseInt(el.getAttribute("data-step"),10), el.getAttribute("data-val")==="yes"); }
    else if (action === "start-next") { startSession(state.settings.nextDayNumber); }
    else if (action === "start-day") { startSession(parseInt(el.getAttribute("data-day"),10)); }
    else if (action === "set-phase") {
      var targetPhase = parseInt(el.getAttribute("data-phase"),10);
      if (targetPhase === 3 && state.settings.phase !== 3) openPhase3GateConfirm();
      else setPhase(targetPhase);
    }
    else if (action === "complete-step") { completeStep(); }
    else if (action === "back-step") { backStep(); }
    else if (action === "exit-session") { openExitConfirm(); }
    else if (action === "dismiss-confirm") { state.confirm = null; render(); }
    else if (action === "confirm-action") { runConfirm(); }
    else if (action === "open-reset-confirm") { openResetConfirm(); }
    else if (action === "open-clearlog-confirm") { openClearLogConfirm(); }
    else if (action === "open-delete-confirm") { openDeleteConfirm(el.getAttribute("data-id"), el.getAttribute("data-headline")); }
    else if (action === "open-edit-profile-confirm") { openEditProfileConfirm(); }
    else if (action === "save-finish") { finishDay(); }
    else if (action === "toggle-dot") { toggleSetDot(parseInt(el.getAttribute("data-step"),10), parseInt(el.getAttribute("data-i"),10)); }
    else if (action === "skip-rest") { dismissRestTimer(); }
    else if (action === "onb-set-sex") { state.onboardDraft.sex = el.getAttribute("data-val"); renderKeepScroll(); }
    else if (action === "onb-set-level") { state.onboardDraft.level = el.getAttribute("data-val"); renderKeepScroll(); }
    else if (action === "onb-set-equipment") { state.onboardDraft.equipment = el.getAttribute("data-val"); renderKeepScroll(); }
    else if (action === "onb-submit") { submitOnboarding(); }
  });

  document.getElementById("app").addEventListener("input", function(e){
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var kind = el.getAttribute("data-input");
    if (kind === "set-weight") {
      setStepWeight(parseInt(el.getAttribute("data-step"),10), el.value);
    } else if (kind === "onb-age") {
      state.onboardDraft.age = el.value;
    } else if (kind === "onb-weight") {
      state.onboardDraft.weight = el.value;
    }
  });

  render();
  initDb();
})();
</script>

<script>
  // Offline support: cache this page (and its fonts/icons) on first load so
  // it keeps working with no signal. Registration failure (unsupported
  // browser, file:// origin, etc.) is silently ignored — the app still runs,
  // just without the offline cache.
  //
  // UPDATES: a future deploy with a bumped CACHE_NAME installs in the
  // background and takes over automatically (see service-worker.js) — safe
  // here since nothing on screen changes mid-session just from that. No tap
  // needed: once it's taken over, the app reloads itself onto the new
  // version (unless you're mid-typing into a field, in which case it waits
  // until you're done so nothing you entered gets lost), then shows a
  // toast that says it updated and fades out on its own.
  function showIroncladUpdatedToast() {
    var el = document.getElementById("sw-update-toast");
    if (!el) return;
    el.classList.remove("fade-out");
    el.hidden = false;
    setTimeout(function(){ el.classList.add("fade-out"); }, 2200);
    setTimeout(function(){
      el.hidden = true;          // actually removes it from layout (see [hidden] rule above)
      el.classList.remove("fade-out"); // reset opacity for next time, now safely off-screen
    }, 2700);
  }

  // Guards against an update-reload loop (e.g. if the host's CDN briefly
  // serves inconsistent copies of service-worker.js right after a deploy,
  // which can otherwise look like a "new" version on every single load).
  var RELOAD_COOLDOWN_MS = 30000;
  function ironcladRecentlyReloaded() {
    try {
      var t = sessionStorage.getItem("ironclad_last_reload_at");
      return !!t && (Date.now() - parseInt(t, 10)) < RELOAD_COOLDOWN_MS;
    } catch (e) { return false; }
  }

  var ironcladReloaded = false;
  function ironcladReloadNow() {
    if (ironcladReloaded) return;
    ironcladReloaded = true;
    try {
      sessionStorage.setItem("ironclad_just_updated", "1");
      sessionStorage.setItem("ironclad_last_reload_at", String(Date.now()));
    } catch (e) {}
    window.location.reload();
  }

  function ironcladReloadWhenSafe() {
    var active = document.activeElement;
    var midEntry = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA") && active.value;
    if (midEntry) {
      active.addEventListener("blur", function onBlur(){
        active.removeEventListener("blur", onBlur);
        ironcladReloadNow();
      });
      setTimeout(ironcladReloadNow, 15000); // safety net if blur never fires
      return;
    }
    ironcladReloadNow();
  }

  try {
    if (sessionStorage.getItem("ironclad_just_updated") === "1") {
      sessionStorage.removeItem("ironclad_just_updated");
      showIroncladUpdatedToast();
    }
  } catch (e) {}

  // Captured BEFORE registering, not re-read later: service-worker.js calls
  // clients.claim() in its own activate handler, which can hand this very
  // page a controller within a second of a plain first-ever install — so
  // checking navigator.serviceWorker.controller *at update time* can't
  // reliably tell "first install" from "a real update", and was wrongly
  // treating every fresh app open as an update (reloading + showing the
  // toast every single time, whether anything had changed or not). Whether
  // a controller already existed the moment this page started loading is
  // the only thing that actually distinguishes the two.
  var hadControllerAtLoad = !!navigator.serviceWorker.controller;

  if ("serviceWorker" in navigator) {
    var ironcladSwReg = null;

    window.addEventListener("load", function(){
      // updateViaCache: "none" tells the browser to never serve
      // service-worker.js itself from its ordinary HTTP cache when checking
      // for an update -- without this, a stale cached copy of that one file
      // (served by GitHub Pages' CDN) can make every update check see no
      // change at all, even though the real file on the server is newer.
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then(function(reg){
        ironcladSwReg = reg;
        reg.addEventListener("updatefound", function(){
          var fresh = reg.installing;
          if (!fresh) return;
          fresh.addEventListener("statechange", function(){
            // Only reload for a genuine update (this page was already being
            // controlled by a previous worker when it loaded). The cooldown
            // guard is a second line of defense against any reload-loop.
            if (fresh.state === "activated" && hadControllerAtLoad && !ironcladRecentlyReloaded()) {
              ironcladReloadWhenSafe();
            }
          });
        });
      }).catch(function(){});
    });

    // iOS standalone ("Add to Home Screen") apps often resume a suspended
    // page instead of truly reloading it when reopened, so the "load" event
    // above and its one-time register() call may simply never fire again on
    // a reopen. Explicitly asking the existing registration to re-check for
    // an update every time the app becomes visible again closes that gap.
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible" && ironcladSwReg) {
        ironcladSwReg.update().catch(function(){});
      }
    });
  }
</script>

</body>
</html>
