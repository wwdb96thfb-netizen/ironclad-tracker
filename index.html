  }
  function persistLog() {
    if (!lsSet(LS_LOG_KEY, state.logEntries)) { state.persistOk = false; render(); }
  }
  function persistMeasurements() {
    if (!lsSet(LS_MEASUREMENTS_KEY, state.measurements)) { state.persistOk = false; render(); }
  }

  function saveSettings(patch) {
    Object.assign(state.settings, patch);
    render();
    persistSettings();
  }

  var LEVEL_LABELS = { beginner:"New to training", returning:"Returning after a break", experienced:"Experienced" };
  var EQUIPMENT_LABELS = { gym:"Full gym access", home:"Home / no equipment" };
  // Shown on Home during Phase 1 only — the level question changes how
  // cautiously you should approach Week 1, not the underlying program.
  var LEVEL_TIPS = {
    beginner: "New to training: take extra ramp-up sets and prioritize clean form over the number on the bar — the weekly progression will still get you there.",
    returning: "Returning after a break: treat your first 2–3 weeks as conservative on purpose, even if a weight feels easy — let your joints and tendons catch up before your muscles push ahead of them.",
    experienced: "Experienced: still start Week 1 honest and light. Phase 1 is for re-grooving the lifts, not testing your old max."
  };

  // Onboarding: set once, editable later from Settings. Changing sex later
  // switches which track getPhases()/getCallouts() resolve to — the
  // training log and body-measurement history are untouched either way,
  // since both are stored completely separately from the profile.
  function saveProfile(profile) {
    state.profile = profile;
    state.onboardDraft = { sex: null, level: null, equipment: null, age: "", weight: "" };
    state.onboardError = null;
    lsSet(LS_PROFILE_KEY, profile);
    ensureLadders();
    render();
  }
  function resetProfile() {
    // Pre-fill the draft from what's already there instead of blanking it —
    // "Edit My Details" should let you fix one field, not force you to
    // retype everything from memory. And deliberately DON'T clear
    // localStorage here: if the edit gets interrupted (app closed, tab
    // backgrounded and killed) before saveProfile() below ever runs, the
    // next launch falls back to the profile that was already saved instead
    // of losing it and getting stuck on a blank intake screen.
    var p = state.profile;
    state.onboardDraft = p ? {
      sex: p.sex || null, level: p.level || null, equipment: p.equipment || null,
      age: (p.age != null ? String(p.age) : ""), weight: (p.weightKg != null ? String(p.weightKg) : "")
    } : { sex: null, level: null, equipment: null, age: "", weight: "" };
    state.profile = null;
    state.welcomed = true;
    state.onboardError = null;
    render();
  }

  function submitOnboarding() {
    var d = state.onboardDraft;
    var age = d.age !== "" ? parseInt(d.age, 10) : NaN;
    var weightKg = d.weight !== "" ? parseFloat(d.weight) : NaN;
    if (!d.sex || !d.level || !d.equipment || isNaN(age) || age < 10 || age > 100 || isNaN(weightKg) || weightKg <= 0 || weightKg > 300) {
      state.onboardError = "Pick an option for each question above, and enter a valid age and weight, before starting.";
      renderKeepScroll();
      return;
    }
    saveProfile({ sex: d.sex, age: age, weightKg: weightKg, level: d.level, equipment: d.equipment });
  }

  function saveLogEntry(entry) {
    entry.id = "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    state.logEntries = state.logEntries || [];
    state.logEntries.unshift(entry);
    state.logEntries.sort(function(a,b){ return (b.completedAt||0) - (a.completedAt||0); });
    state.logError = null;
    persistLog();
  }

  // Body-measurement log — independent of the training log, same plain
  // local read/write pattern.
  function saveMeasurementEntry(entry) {
    entry.id = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    state.measurements = state.measurements || [];
    state.measurements.unshift(entry);
    state.measurements.sort(function(a,b){ return (b.completedAt||0) - (a.completedAt||0); });
    state.measureError = null;
    persistMeasurements();
  }

  function deleteMeasurement(id) {
    if (!id) return;
    state.measurements = (state.measurements || []).filter(function(e){ return e.id !== id; });
    persistMeasurements();
    state.toast = "Measurement deleted";
    render();
    setTimeout(function(){ state.toast = null; render(); }, 3000);
  }

  function addMeasurementFromForm() {
    function numOrNull(id) {
      var el = document.getElementById(id);
      if (!el || el.value === "" || el.value == null) return null;
      var n = parseFloat(el.value);
      return isNaN(n) ? null : n;
    }
    var weight = numOrNull("pf-weight"), waist = numOrNull("pf-waist"),
        chest = numOrNull("pf-chest"), arms = numOrNull("pf-arms"), thighs = numOrNull("pf-thighs");
    var notesEl = document.getElementById("pf-notes");
    var notes = notesEl && notesEl.value ? notesEl.value.trim() : "";
    if (weight == null && waist == null && chest == null && arms == null && thighs == null && !notes) {
      state.toast = "Enter at least one measurement first";
      render();
      setTimeout(function(){ state.toast = null; render(); }, 2500);
      return;
    }
    saveMeasurementEntry({
      date: todayKey(), completedAt: Date.now(),
      weight: weight, waist: waist, chest: chest, arms: arms, thighs: thighs,
      notes: notes
    });
    state.toast = "Measurement saved";
    render();
    setTimeout(function(){ state.toast = null; render(); }, 2500);
  }

  /* ============================================================
     ACTIONS
  ============================================================ */
  function startSession(dayNum) {
    var s = state.settings;
    var type = DAY_TYPE[dayNum];
    var deload = deloadModeActive();
    var steps = buildSteps(dayNum, s.phase, s.nextLiftType, s.nextGppType, deload);
    clearRestInterval();
    state.session = {
      dayNum: dayNum, phase: s.phase, liftType: s.nextLiftType, gppType: s.nextGppType,
      type: type, headline: dayHeadline(dayNum, s.phase, s.nextLiftType, s.nextGppType),
      steps: steps, idx: 0, setDots: {}, restTimer: null, weights: {}, deload: deload
    };
    state.confirm = null;
    state.screen = "session";
    revealedPhotos = {};
    render();
  }

  function completeStep() {
    var sess = state.session;
    if (setsRemaining(sess.steps[sess.idx], sess.idx) > 0) return; // all sets must be ticked first
    var miss = stepMissing(sess.steps[sess.idx], sess.idx);
    if (miss) { state.toast = miss; renderKeepScroll(); setTimeout(function(){ state.toast = null; if (state.session) renderKeepScroll(); }, 4000); return; }
    stopGuided();
    clearRestInterval();
    sess.restTimer = null;
    if (sess.idx < sess.steps.length - 1) {
      sess.idx++;
      state.altOpen = null;
      state.histOpen = null;
      revealedPhotos = {};
      render();
      var scroller = document.querySelector(".body-scroll");
      if (scroller) scroller.scrollTop = 0;
    } else {
      state.screen = "summary";
      render();
    }
  }

  function backStep() {
    var sess = state.session;
    stopGuided();
    clearRestInterval();
    sess.restTimer = null;
    if (sess.idx > 0) { sess.idx--; revealedPhotos = {}; render(); }
    else { openExitConfirm(); }
  }

  function exitSession() {
    stopGuided();
    clearRestInterval();
    state.session = null;
    state.screen = "home";
    render();
  }

  function finishDay() {
    var sess = state.session;
    clearRestInterval();
    var entry = {
      date: todayKey(), dayNumber: sess.dayNum, phase: sess.phase, type: sess.type,
      headline: sess.headline, items: sess.steps.map(function(s){ return s.title; }),
      completedAt: Date.now(), deload: !!sess.deload
    };
    var nextDay = (sess.dayNum % 7) + 1;
    var patch = { nextDayNumber: nextDay };
    // What was actually done: reps (or seconds) per set, per exercise.
    var repsDone = null, lastReps = null;
    sess.steps.forEach(function(st, i){
      if (!repsLoggable(st) || !sess.reps || !sess.reps[i]) return;
      var arr = sess.reps[i].map(function(v){ return parseInt(v, 10); }).filter(function(v){ return !isNaN(v) && v >= 0; });
      if (!arr.length) return;
      if (!repsDone) repsDone = {};
      repsDone[st.title] = arr;
      if (!sess.deload) {
        if (!lastReps) lastReps = Object.assign({}, state.settings.lastReps || {});
        lastReps[st.title] = { reps: arr, date: todayKey() };
      }
    });
    if (repsDone) entry.reps = repsDone;
    if (sess.runMin) { entry.runMin = sess.runMin; if (!state.settings.bestRun || sess.runMin < state.settings.bestRun) patch.bestRun = sess.runMin; }
    if (lastReps) patch.lastReps = lastReps;
    // Per-exercise history: date, weight used and reps done (last 30 kept).
    var hist = null, wtDone = null;
    sess.steps.forEach(function(st, i){
      if (st.kind !== "exercise") return;
      var rec = { d: todayKey() }, has = false;
      if (repsDone && repsDone[st.title]) { rec.r = repsDone[st.title]; has = true; }
      if (usesWeight(st)) {
        var sw = sess.weights[i], lw = state.settings.lastWeights && state.settings.lastWeights[st.title];
        var wv = (sw && sw.weight !== undefined && sw.weight !== null && sw.weight !== "") ? parseFloat(sw.weight) : (!sess.deload && lw ? lw.weight : NaN);
        if (!isNaN(wv)) { rec.w = wv; has = true; if (!wtDone) wtDone = {}; wtDone[st.title] = wv; }
      }
      if (!has) return;
      if (sess.deload) rec.dl = 1;
      if (!hist) hist = JSON.parse(JSON.stringify(state.settings.exHistory || {}));
      hist[st.title] = (hist[st.title] || []).concat([rec]).slice(-30);
    });
    if (hist) patch.exHistory = hist;
    if (wtDone) entry.weights = wtDone;
    if (sess.type === "lift") patch.nextLiftType = sess.liftType === "A" ? "B" : "A";
    if (sess.type === "gpp") patch.nextGppType = sess.gppType === "ruck" ? "speed" : "ruck";

    // Carry forward any weight the main lift logged this session so next
    // time's progression hint ("+1.25kg" / "repeat") has something to go
    // on — but never from a deload session, since ~60% weight isn't a real
    // working-weight data point and would wreck the next progression hint.
    if (!sess.deload) {
      var weightUpdates = null;
      sess.steps.forEach(function(st, i){
        if (!usesWeight(st)) return;
        var w = sess.weights[i];
        if (!w || w.weight === undefined || w.weight === null || w.weight === "") return;
        var num = parseFloat(w.weight);
        if (isNaN(num)) return;
        if (!weightUpdates) weightUpdates = Object.assign({}, state.settings.lastWeights);
        weightUpdates[st.title] = { weight: num, hitAll: w.hitAll !== false, date: todayKey() };
      });
      if (weightUpdates) patch.lastWeights = weightUpdates;
    }

    // Deload gate: count this session toward the current deload week. Once
    // DELOAD_WEEK_SESSIONS are done, reset the clock on its own — the user
    // never has to remember to do that themselves.
    var toastMsg = "Logged: " + sess.headline;
    if (sess.deload) {
      var doneCount = (state.settings.deloadSessionsDone || 0) + 1;
      if (doneCount >= DELOAD_WEEK_SESSIONS) {
        patch.deloadSessionsDone = 0;
        patch.cycleStartDate = Date.now();
        toastMsg = "Deload week complete — nice work. Back to full weight next session.";
      } else {
        patch.deloadSessionsDone = doneCount;
        toastMsg = "Logged: " + sess.headline + " (Deload " + doneCount + "/" + DELOAD_WEEK_SESSIONS + ")";
      }
    }

    saveLogEntry(entry);
    saveSettings(patch);
    var ladderMsg = updateLaddersFromSession(sess);
    if (ladderMsg) toastMsg += ". " + ladderMsg;
    state.toast = toastMsg;
    state.session = null;
    state.screen = "home";
    render();
    setTimeout(function(){ state.toast = null; render(); }, ladderMsg ? 8000 : 3500);
  }

  function toggleSetDot(stepIdx, setIdx) {
    var sess = state.session;
    var key = stepIdx + "_" + setIdx;
    var wasFilled = !!sess.setDots[key];
    sess.setDots[key] = !wasFilled;
    var step = sess.steps[stepIdx];
    if (!wasFilled && setsRemaining(step, stepIdx) > 0) {
      startRestTimer(stepIdx, step); // just checked, more sets to go — start the rest clock
    } else {
      clearRestInterval();
      sess.restTimer = null;
    }
    renderKeepScroll();
  }

  function setPhase(p) { saveSettings({ phase: p }); }

  // Weight input is a plain number field — update state directly without a
  // full render() so typing doesn't blow away focus/cursor on every
  // keystroke (render() replaces the whole #app subtree via innerHTML).
  function setStepWeight(stepIdx, val) {
    var sess = state.session;
    if (!sess) return;
    if (!sess.weights[stepIdx]) sess.weights[stepIdx] = {};
    sess.weights[stepIdx].weight = val;
  }

  function setStepHitAll(stepIdx, hitAll) {
    var sess = state.session;
    if (!sess) return;
    if (!sess.weights[stepIdx]) sess.weights[stepIdx] = {};
    sess.weights[stepIdx].hitAll = hitAll;
    renderKeepScroll();
  }

  /* ---- deload cycle: a running count of weeks since the last deload
     week (or since the plan started, if none taken yet). Golden rule is
     "every 4–6 weeks", so 4 opens the window and 6 marks it overdue. ---- */
  function computeWeeksInCycle() {
    var start = state.settings.cycleStartDate;
    if (!start) return 0;
    return Math.floor((Date.now() - start) / (7*24*3600*1000));
  }

  // The hard gate: once this is true, startSession() builds every day as a
  // deload day (see buildSteps' `deload` param) and stays true — since
  // cycleStartDate only moves forward once a full deload week is logged —
  // until DELOAD_WEEK_SESSIONS sessions have been completed. No separate
  // flag to fall out of sync with; it's purely a function of the clock.
  function deloadModeActive() {
    return computeWeeksInCycle() >= DELOAD_DUE_WEEKS;
  }

  // Deload week: same exercise, same rep/time/distance target, one fewer
  // working set (minimum 1). Only the leading set-count number is touched —
  // "3×5–8" becomes "2×5–8", "2×40m" becomes "1×40m" — so this is safe
  // across every unit style used in the plan without parsing the rest of it.
  function deloadSetsString(setsStr) {
    var m = /^(\d+)×(.+)$/.exec(setsStr || "");
    if (!m) return setsStr;
    var n = Math.max(1, parseInt(m[1],10) - 1);
    return n + "×" + m[2];
  }

  function markDeloadTaken() {
    saveSettings({ cycleStartDate: Date.now(), deloadSessionsDone: 0 });
    state.toast = "Deload logged — new 4–6 week cycle started";
    render();
    setTimeout(function(){ state.toast = null; render(); }, 3500);
  }

  /* ---- rest timer: counts down between sets using a deadline (Date.now()
     comparison), not a naive per-tick decrement, so it stays accurate even
     if the tab is backgrounded for a moment. One module-level interval ref,
     always cleared before a new one starts — the earlier onSnapshot bug
     taught us duplicate intervals/subscriptions are easy to leak. ---- */
  function parseRestSeconds(restStr) {
    var m = /([\d.]+)\s*(m|s)\s*$/i.exec(restStr || "");
    if (!m) return 0;
    var val = parseFloat(m[1]);
    return m[2].toLowerCase() === "m" ? Math.round(val * 60) : Math.round(val);
  }

  function clearRestInterval() {
    if (restInterval) { clearInterval(restInterval); restInterval = null; }
  }

  // Ticks every 250ms while resting. Deliberately does NOT call the full
  // render() on every tick — that replaces the whole #app subtree via
  // innerHTML, which was yanking the Skip button's DOM node out from under
  // an in-progress tap every quarter-second and making it register
  // inconsistently. A running timer only patches its own two small nodes in
  // place; a full render() only happens on the done transition, where the
  // card's layout actually changes.
  function tickRestTimer() {
    var rt = state.session && state.session.restTimer;
    if (!rt) { clearRestInterval(); return; }
    var remaining = Math.max(0, Math.ceil((rt.endsAt - Date.now()) / 1000));
    if (remaining <= 0 && !rt.done) {
      rt.done = true;
      clearRestInterval();
      playBeep();
      renderKeepScroll();
      return;
    }
    patchRestTimerDom(rt, remaining);
  }

  function patchRestTimerDom(rt, remaining) {
    var card = document.querySelector(".rest-timer");
    if (!card) { render(); return; } // DOM fell out of sync with state — fall back to a full render
    var mm = Math.floor(remaining / 60), ss = remaining % 60;
    var timeEl = card.querySelector(".rt-time");
    if (timeEl) timeEl.textContent = mm > 0 ? (mm + ":" + String(ss).padStart(2,"0")) : (ss + "s");
    var fillEl = card.querySelector(".rt-fill");
    if (fillEl && rt.totalSec) {
      var pct = Math.max(0, Math.min(100, Math.round(((rt.totalSec - remaining) / rt.totalSec) * 100)));
      fillEl.style.width = pct + "%";
    }
  }

  function startRestTimer(stepIdx, step) {
    var sec = parseRestSeconds(step.rest);
    if (!sec) return;
    ensureAudio(); // warm up the audio context inside this user gesture so the later beep isn't blocked
    clearRestInterval();
    state.session.restTimer = { stepIdx: stepIdx, endsAt: Date.now() + sec * 1000, totalSec: sec, done: false };
    restInterval = setInterval(tickRestTimer, 250);
  }

  function dismissRestTimer() {
    clearRestInterval();
    if (state.session) state.session.restTimer = null;
    renderKeepScroll();
  }

  function resumeRestTimerIfNeeded() {
    var rt = state.session && state.session.restTimer;
    if (rt && !rt.done) { clearRestInterval(); restInterval = setInterval(tickRestTimer, 250); }
  }

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = AC ? new AC() : null;
    } catch (e) { audioCtx = null; }
    return audioCtx;
  }

  function playBeep() {
    var ctx = ensureAudio();
    if (!ctx) return;
    try {
      if (ctx.state === "suspended") ctx.resume();
      var now = ctx.currentTime;
      [0, 0.18].forEach(function(offset){
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.15);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + offset); osc.stop(now + offset + 0.16);
      });
    } catch (e) {}
  }


  /* ============================================================
     GUIDED TIMER — runs every timed drill in a step, start to finish.
     Defaults: 30s per hold (the plan says 20–30s, so we use the top end),
     5s between sides/rounds, 10s between drills, 60s between tendon holds.
     Timing is timestamp-based (endsAt), so if the phone sleeps or the app
     is backgrounded it catches up to the right place on return.
  ============================================================ */
  var GUIDE_DEFAULTS = { sideRest: 5, exRest: 10, lead: 5, tendonRest: 60, repEstimate: 20 };
  var guidedInterval = null, wakeLock = null;
  var GUIDE_ONE_SIDED = {"Lat Stretch": ["Left arm", "Right arm"], "Forearm Stretch": ["Left arm", "Right arm"], "Shoulder Stretch": ["Left arm", "Right arm"]};

  // Default timing for each warm-up drill that has no seconds written in the
  // plan: 30s per drill (per side/direction where it has two), reps for the
  // rep-based ones. Anything not listed here (ramp-up sets, "a few swings",
  // a light empty-bar set) is lifting work and is left for you to do by hand.
  var WARMUP_TIMING = {
    "Leg Swings": {sec: 30, labels: ["Left leg", "Right leg"]},
    "Hip Circles": {sec: 30, labels: ["Clockwise", "Counter-clockwise"]},
    "Arm Circles": {sec: 30},
    "Shoulder Circles": {sec: 30},
    "Cat-Cow": {sec: 30},
    "Deep Squat Hold": {sec: 30, rounds: 2},
    "Band Pull-Apart": {reps: 15},
    "Walking Lunges": {reps: 10, labels: ["Each leg"]}
  };

  function guideSideLabels(text) {
    if (/each direction/i.test(text)) return ["Clockwise", "Counter-clockwise"];
    if (/each foot/i.test(text)) return ["Left foot", "Right foot"];
    if (/each side|\/\s*side|each leg/i.test(text)) return ["Left side", "Right side"];
    return [null];
  }
  function guideHoldSeconds(text) {
    var m = text.match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*(?:s\b|sec)/i);
    return m ? parseInt(m[2] || m[1], 10) : 0;
  }
  function guideRounds(text) {
    var m = text.match(/×\s*(\d+)/);
    return m ? parseInt(m[1], 10) : 1;
  }
  function guideReps(text) {
    var m = text.match(/(\d+)\s*(?:slow\s*)?reps?\b/i) || text.match(/(\d+)\s*\/\s*side/i);
    return m ? parseInt(m[1], 10) : 0;
  }

  // Turns one session step into a flat list of segments, or null when the
  // step has nothing timeable. Segment: {type: work|rep|rest, title, sub, sec,
  // photo, group, next}. "rep" segments (e.g. 8 reps) have no countdown —
  // they wait for a tap on Done.
  function buildGuidedSeq(step) {
    var G = GUIDE_DEFAULTS, groups = [], phaseWord = null;
    function addGroup(name, labels, rounds, sec, reps, innerRest, restAfter) {
      var grp = { items: [], innerRest: innerRest, restAfter: restAfter };
      for (var r = 1; r <= rounds; r++) {
        labels.forEach(function(lab) {
          var parts = [];
          if (!sec && reps) parts.push(reps + " reps");
          if (lab) parts.push(lab);
          if (rounds > 1) parts.push("Round " + r + " of " + rounds);
          grp.items.push({ type: sec ? "work" : "rep", title: name, sub: parts.join(" · "), sec: sec || 0, photo: name, phase: phaseWord });
        });
      }
      groups.push(grp);
    }
    if (step.kind === "warmup") {
      phaseWord = "Go";
      (step.items || []).forEach(function(line) {
        if (/light cardio/i.test(line)) { addGroup("Light Cardio", [null], 1, 300, 0, 0, G.exRest); return; }
        var names = WARMUP_LINE_MAP[line];
        if (!names) return;
        names.forEach(function(n) {
          var t = WARMUP_TIMING[n];
          if (!t) return;
          addGroup(n, t.labels || [null], t.rounds || 1, t.sec || 0, t.reps || 0, G.sideRest, G.exRest);
        });
      });
    } else if (step.kind === "stretch") {
      (step.items || []).forEach(function(line) {
        var m = STRETCH_LINE_MAP[line];
        if (!m) return;
        var eachSide = /each side/i.test(m.dose);
        m.names.forEach(function(n) {
          // One-sided stretches whose plan line just says "×2" (no "each side")
          // are done once per side — the two holds ARE the two sides.
          var oneSided = !eachSide && GUIDE_ONE_SIDED[n];
          var labels = eachSide ? ["Left side", "Right side"] : (oneSided ? GUIDE_ONE_SIDED[n] : [null]);
          addGroup(n, labels, oneSided ? 1 : guideRounds(m.dose), guideHoldSeconds(m.dose) || 30, 0, G.sideRest, G.exRest);
        });
      });
    } else if (step.kind === "balance") {
      (step.items || []).forEach(function(line) {
        var n = BALANCE_LINE_MAP[line];
        if (!n) return;
        var sec = guideHoldSeconds(line);
        addGroup(n, guideSideLabels(line), guideRounds(line), sec, sec ? 0 : guideReps(line), G.sideRest, G.exRest);
      });
    } else if (step.kind === "recovery") {
      if (step.items && step.items.length) {
        step.items.forEach(function(line) {
          var n = RECOVERY_SUBITEM_MAP[line] || line.split(" — ")[0];
          var sec = guideHoldSeconds(line);
          addGroup(n, guideSideLabels(line), 1, sec, sec ? 0 : guideReps(line), G.sideRest, G.exRest);
        });
      } else {
        var mm = (step.sub || "").match(/(\d+)\s*min/i);
        if (mm) addGroup(step.title, [null], 1, parseInt(mm[1], 10) * 60, 0, 0, 0);
      }
    } else if (step.kind === "tendon") {
      var names = TENDON_LINE_MAP[step.text];
      if (!names) return null;
      var alternate = /alternate legs/i.test(step.text);
      names.forEach(function(n, i) {
        // "alternate legs" holds: 4 holds = left, right, left, right.
        if (MAX_EFFORT_HOLDS[n]) addGroup(n, [null], 3, 6, 0, G.tendonRest, G.tendonRest);
        else if (i === 0 && alternate) addGroup(n, ["Left leg", "Right leg"], 2, 30, 0, G.tendonRest, G.tendonRest);
        else addGroup(n, [null], i === 0 ? 4 : 2, 30, 0, G.tendonRest, G.tendonRest);
      });
    }
    var segs = [];
    groups.forEach(function(grp, gi) {
      grp.items.forEach(function(it, k) {
        if (k > 0) segs.push({ type: "rest", title: "Rest", sec: grp.innerRest, group: gi, same: true });
        it.group = gi;
        segs.push(it);
      });
      if (gi < groups.length - 1 && grp.restAfter) segs.push({ type: "rest", title: "Rest", sec: grp.restAfter, group: gi + 1, same: false });
    });
    if (!segs.length) return null;
    // Lead-in, then fill in each rest's preview (the next real drill).
    segs.unshift({ type: "rest", title: "Get ready", sec: G.lead, group: 0, lead: true });
    for (var i = 0; i < segs.length; i++) {
      if (segs[i].type !== "rest") continue;
      for (var j = i + 1; j < segs.length; j++) {
        if (segs[j].type !== "rest") {
          segs[i].next = segs[j];
          segs[i].photo = segs[j].photo;
          segs[i].sub = segs[i].lead ? "First up: " + segs[j].title : (segs[i].same ? "Switch sides / reset" : "Get into position");
          break;
        }
      }
    }
    var total = 0;
    segs.forEach(function(sg) { total += sg.sec || G.repEstimate; });
    return { segs: segs, groupCount: groups.length, totalSec: total };
  }

  function guidedMinutesLabel(sec) {
    var m = Math.max(1, Math.round(sec / 60));
    return "≈ " + m + " min";
  }
  function fmtClock(sec) {
    sec = Math.max(0, sec);
    var mm = Math.floor(sec / 60), ss = sec % 60;
    return mm + ":" + String(ss).padStart(2, "0");
  }

  function requestWake() {
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function(l){ wakeLock = l; }).catch(function(){}); } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }
  function playTone(freq, dur) {
    var ctx = ensureAudio();
    if (!ctx) return;
    try {
      if (ctx.state === "suspended") ctx.resume();
      var now = ctx.currentTime, osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + dur + 0.02);
    } catch (e) {}
  }

  function startGuided(stepIdx) {
    var step = state.session && state.session.steps[stepIdx];
    var built = step && buildGuidedSeq(step);
    if (!built) return;
    ensureAudio();
    clearGuidedInterval();
    var g = { stepIdx: stepIdx, segs: built.segs, groupCount: built.groupCount, idx: 0, endsAt: Date.now() + built.segs[0].sec * 1000,
      paused: false, remainMs: 0, done: false, lastTick: null };
    state.guided = g;
    requestWake();
    guidedInterval = setInterval(tickGuided, 250);
    playTone(660, 0.12);
    render();
  }
  function clearGuidedInterval() { if (guidedInterval) { clearInterval(guidedInterval); guidedInterval = null; } }
  function stopGuided() {
    clearGuidedInterval(); releaseWake();
    state.guided = null;
  }
  function guidedEnter(g, idx, announce) {
    g.idx = idx; g.lastTick = null;
    var seg = g.segs[idx];
    g.endsAt = seg.type === "rep" ? null : (g.endsAt && announce === "catchup" ? g.endsAt : Date.now() + seg.sec * 1000);
  }
  function guidedAdvance(userSkip) {
    var g = state.guided;
    if (!g || g.done) return;
    if (g.idx >= g.segs.length - 1) { finishGuided(); return; }
    guidedEnter(g, g.idx + 1);
    if (g.paused) { g.paused = false; }
    playSegmentCue(g.segs[g.idx]);
    render();
  }
  function playSegmentCue(seg) {
    if (seg.type === "rest") playTone(440, 0.28); else playBeep();
  }
  function guidedBack() {
    var g = state.guided;
    if (!g || g.done) return;
    var target = g.idx;
    for (var i = g.idx - 1; i >= 0; i--) { if (g.segs[i].type !== "rest") { target = i; break; } }
    if (target === g.idx) { for (var k = g.idx - 1; k >= 0; k--) { target = k; break; } }
    g.paused = false;
    guidedEnter(g, target);
    render();
  }
  function guidedTogglePause() {
    var g = state.guided;
    if (!g || g.done) return;
    var seg = g.segs[g.idx];
    if (seg.type === "rep") return;
    if (g.paused) { g.endsAt = Date.now() + g.remainMs; g.paused = false; }
    else { g.remainMs = Math.max(0, g.endsAt - Date.now()); g.paused = true; }
    render();
  }
  function finishGuided() {
    var g = state.guided;
    if (!g) return;
    g.done = true;
    clearGuidedInterval(); releaseWake();
    playBeep();
    render();
  }

  function tickGuided() {
    var g = state.guided;
    if (!g || g.done || g.paused) return;
    var seg = g.segs[g.idx];
    if (seg.type === "rep") return;
    var now = Date.now(), moved = false;
    // Catch up if the page was suspended: walk forward through every segment
    // whose end has already passed, stopping at a rep segment (needs a tap).
    while (seg.type !== "rep" && now >= g.endsAt) {
      if (g.idx >= g.segs.length - 1) { finishGuided(); return; }
      var carry = g.endsAt;
      g.idx++; moved = true; g.lastTick = null;
      seg = g.segs[g.idx];
      g.endsAt = seg.type === "rep" ? null : carry + seg.sec * 1000;
    }
    if (moved) { playSegmentCue(seg); render(); return; }
    var remaining = Math.ceil((g.endsAt - now) / 1000);
    if (remaining <= 3 && remaining > 0 && g.lastTick !== remaining) { g.lastTick = remaining; playTone(700, 0.07); }
    var t = document.getElementById("g-time");
    if (t) t.textContent = fmtClock(remaining);
    var f = document.getElementById("g-fill");
    if (f) f.style.width = Math.max(0, Math.min(100, Math.round(((seg.sec - remaining) / seg.sec) * 100))) + "%";
  }

  function renderGuidedOverlay() {
    var g = state.guided;
    if (!g) return '';
    if (g.done) {
      return '<div class="guided"><div class="g-done"><div class="check-circle">' + ICONS.checkBig + '</div>' +
        '<h2>Sequence Complete</h2><p>Every drill in this step is done.</p>' +
        '<button class="btn btn-primary btn-block" data-action="guided-finish">Continue</button></div></div>';
    }
    var seg = g.segs[g.idx];
    var isRep = seg.type === "rep", isRest = seg.type === "rest";
    var photo = seg.photo ? resolvePhotoPath(seg.photo) : null;
    var remaining = g.paused ? Math.ceil(g.remainMs / 1000) : (isRep ? 0 : Math.ceil((g.endsAt - Date.now()) / 1000));
    var pct = (!isRep && seg.sec) ? Math.max(0, Math.min(100, Math.round(((seg.sec - remaining) / seg.sec) * 100))) : 0;
    var nextSeg = null;
    for (var i = g.idx + 1; i < g.segs.length; i++) { if (g.segs[i].type !== "rest") { nextSeg = g.segs[i]; break; } }
    if (isRest && seg.next) nextSeg = seg.next;
    var drill = Math.min(g.groupCount, seg.group + 1);
    var html = '<div class="guided ' + (isRest ? 'g-rest' : 'g-work') + '">';
    html += '<div class="g-top"><button class="g-x" data-action="guided-exit">✕ Exit</button><div class="g-count">Drill ' + drill + ' of ' + g.groupCount + '</div></div>';
    html += '<div class="g-progress"><div class="g-pfill" style="width:' + Math.round((g.idx / g.segs.length) * 100) + '%"></div></div>';
    html += '<div class="g-main">';
    if (photo) html += '<img class="g-photo" src="' + photo + '" alt="' + esc(seg.photo) + '">';
    html += '<div class="g-phase">' + (seg.lead ? 'Get ready' : (isRest ? 'Rest' : (seg.phase || (isRep ? 'Reps' : 'Hold')))) + '</div>';
    if (!isRest) html += '<div class="g-title">' + esc(seg.title) + '</div>';
    else html += '<div class="g-title">' + (seg.lead ? 'Starting soon' : 'Rest') + '</div>';
    html += '<div class="g-sub">' + esc(seg.sub || '') + '</div>';
    if (isRep) {
      html += '<div class="g-reps">Do your reps</div>';
    } else {
      html += '<div class="g-time" id="g-time">' + fmtClock(remaining) + '</div>';
      html += '<div class="g-bar"><div class="g-fill" id="g-fill" style="width:' + pct + '%"></div></div>';
    }
    html += '</div>';
    if (nextSeg && !(isRest && seg.lead)) html += '<div class="g-next">Next up: <b>' + esc(nextSeg.title) + '</b>' + (nextSeg.sub ? ' · ' + esc(nextSeg.sub) : '') + '</div>';
    else html += '<div class="g-next">' + (nextSeg ? '' : 'Last one — finish strong') + '</div>';
    html += '<div class="g-controls">';
    html += '<button class="btn btn-ghost" data-action="guided-back">‹ Back</button>';
    if (isRep) html += '<button class="btn btn-primary" data-action="guided-skip">Done ›</button>';
    else html += '<button class="btn btn-primary" data-action="guided-pause">' + (g.paused ? 'Resume' : 'Pause') + '</button>';
    html += '<button class="btn btn-ghost" data-action="guided-skip">Skip ›</button>';
    html += '</div></div>';
    return html;
  }

  /* ============================================================
     RENDER HELPERS
  ============================================================ */
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
  function fmtKg(n){ var r = Math.round(n*100)/100; return (r % 1 === 0) ? String(r) : String(r.toFixed(2)).replace(/0$/,''); }

  function fmtDate(key) {
    var parts = key.split("-"); var d = new Date(+parts[0], +parts[1]-1, +parts[2]);
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  }

  function computeStreak(entries) {
    if (!entries || !entries.length) return 0;
    var dates = {}; entries.forEach(function(e){ dates[e.date] = true; });
    var streak = 0, cur = new Date();
    var key = todayKey(cur);
    if (!dates[key]) { cur.setDate(cur.getDate()-1); key = todayKey(cur); if (!dates[key]) return 0; }
    while (dates[todayKey(cur)]) { streak++; cur.setDate(cur.getDate()-1); }
    return streak;
  }

  function parseSetCount(setsStr) {
    var m = /^(\d+)×/.exec(setsStr);
    return m ? Math.min(parseInt(m[1],10), 6) : 0;
  }

  // Splits "3×8–10" into the set count and the "8–10" per-set unit text.
  function parseSetsUnit(setsStr) {
    var m = /^\d+×(.+)$/.exec(setsStr || "");
    return m ? m[1] : (setsStr || "");
  }

  // "8–10" / "15" (a plain rep count or range) reads as "8–10 reps"; anything
  // with its own unit already (40m, 30–45s, AMRAP, 10/side) is left as-is.
  function formatSetUnit(unit) {
    if (unit === "Max") return "as many as you can";
    return /^\d+(\s*[–-]\s*\d+)?$/.test(unit) ? (unit + " reps") : unit;
  }

  // How many sets on this step still need to be ticked before Complete is
  // allowed. 0 for any non-exercise step, or an exercise with no set count.
  function setsRemaining(step, stepIdx) {
    if (!step || step.kind !== "exercise") return 0;
    var n = parseSetCount(step.sets);
    if (n <= 0) return 0;
    var dots = (state.session && state.session.setDots) || {};
    var left = 0;
    for (var i=0;i<n;i++) { if (!dots[stepIdx + "_" + i]) left++; }
    return left;
  }

    var remaining = Math.max(0, Math.ceil((rt.endsAt - Date.now()) / 1000));

    var label = mm > 0 ? (mm + ":" + String(ss).padStart(2,"0")) : (ss + "s");
    var pct = rt.totalSec ? Math.max(0, Math.min(100, Math.round(((rt.totalSec - remaining) / rt.totalSec) * 100))) : 100;
    return '<div class="rest-timer' + (rt.done ? ' done' : '') + '">' +
      '<div class="rt-row"><div class="rt-label">' + (rt.done ? 'Rest done — go again' : 'Resting') + '</div>' +

  // Gym exercises (other than the main lifts) that use an outside weight.

  function usesWeight(step) { return !!(step && step.kind === "exercise" && !(state.profile && state.profile.equipment === "home") && (step.isMainLift || WEIGHTED_EX[step.title])); }

  function repsLoggable(step) {

  }
  function repsUnitWord(step) { return /\ds\b/.test(parseSetsUnit(step.sets)) ? "sec" : "reps"; }
  function repsRange(setsStr) {
    var m = /(\d+)\s*(?:[–-]\s*(\d+))?/.exec(parseSetsUnit(setsStr));

  // What still has to be logged before this exercise can be completed.
  function stepMissing(step, stepIdx) {
    var sess = state.session;
    if (!sess || !step || step.kind !== "exercise" || window.__icSkipLog) return null;

      for (var i = 0; i < n; i++) { if (r[i] === undefined || r[i] === null || r[i] === "" || isNaN(parseInt(r[i], 10))) return "Enter the " + word + " you did on every set before you complete this exercise."; }

  function repsHint(step) {
    var last = state.settings.lastReps && state.settings.lastReps[step.title];
    var word = repsUnitWord(step) === "sec" ? "seconds" : "reps";

    var r = repsRange(step.sets), txt = "Last time: " + last.reps.join(", ") + ". ";
    if (r) {
      var min = Math.min.apply(null, last.reps);

    html += '<div class="field-row"><label>Waist (cm)</label><input class="field-input" type="number" inputmode="decimal" step="0.1" id="pf-waist" placeholder="—"></div>';
    html += '<div class="field-row"><label>Chest (cm)</label><input class="field-input" type="number" inputmode="decimal" step="0.1" id="pf-chest" placeholder="—"></div>';
    html += '<div class="field-row"><label>Arms (cm)</label><input class="field-input" type="number" inputmode="decimal" step="0.1" id="pf-arms" placeholder="—"></div>';
    html += '<div class="field-row"><label>Thighs (cm)</label><input class="field-input" type="number" inputmode="decimal" step="0.1" id="pf-thighs" placeholder="—"></div>';

    html += '<div class="field-row"><label>Notes</label><textarea class="field-input notes" id="pf-notes" placeholder="Optional"></textarea></div>';
    html += '<button class="btn btn-primary btn-block" data-action="add-measurement">Save Measurement</button>';
    html += '</div>';

    html += '<div class="section-label">History</div>';
    if (!entries.length) {
      html += '<div class="empty-state">' + ICONS.empty + (state.measurements===null?'<p>Loading…</p>':'<p>No measurements logged yet.</p>') + '</div>';
    } else {
      html += '<div class="card" style="padding:4px 16px">';
      entries.forEach(function(e){
        var parts = [];
        if (e.weight != null) parts.push('<b>' + esc(e.weight) + ' kg</b>');
        if (e.waist != null) parts.push('Waist ' + esc(e.waist) + 'cm');
        if (e.chest != null) parts.push('Chest ' + esc(e.chest) + 'cm');
        if (e.arms != null) parts.push('Arms ' + esc(e.arms) + 'cm');
        if (e.thighs != null) parts.push('Thighs ' + esc(e.thighs) + 'cm');
        html += '<div class="measure-row"><div class="measure-main"><div class="measure-date">' + fmtDate(e.date) + '</div>' +
          '<div class="measure-vals">' + (parts.length ? parts.join(' · ') : '—') + '</div>' +
          (e.notes ? '<div class="measure-vals" style="color:var(--ink-soft);margin-top:2px">' + esc(e.notes) + '</div>' : '') + '</div>' +
          '<button class="log-del" data-action="open-delete-measurement-confirm" data-id="' + esc(e.id||'') + '" data-date="' + esc(fmtDate(e.date)) + '" aria-label="Delete measurement">' + ICONS.trash + '</button></div>';
      });
      html += '</div>';
    }

    html += '</div>';
    return html + renderBottomNav();
  }

  // The Manual screen reads straight off getPhases() / RUCK_DOSING / BALANCE_ITEMS /
  // RECOVERY_ITEMS — the same data the tracker itself runs on — plus the handful
  // of reference-only lines in GOLDEN_RULES / getCallouts() above. No second
  // copy of the plan to drift out of sync, and it opens instantly in-app instead
  // of jumping to the separate field-manual page.
  // "Start Here" chapters at the top of the Manual: why the app exists, the
  // thinking behind it, how it differs from typical gym routines, rules, and
  // an everyday Pakistani diet guide. Written for any reader — nothing in here
  // assumes a particular job, background or starting level.
  var GUIDE_P = function(t){ return '<p class="mn-cardbody" style="margin:0 0 10px">' + esc(t) + '</p>'; };
  var GUIDE_UL = function(arr){ return '<ul class="item-list" style="margin:0 0 4px">' + arr.map(function(it){ return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>'; };
  var GUIDE_CARD = function(head, inner){ return '<div class="card" style="margin-bottom:12px"><p class="mn-cardhead">' + esc(head) + '</p>' + inner + '</div>'; };
  var GUIDE_TABLE = function(heads, rows){
    return '<table class="guide-table"><tr>' + heads.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>' +
      rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
  };

  function renderManualGuide() {
    var h = '';

    h += GUIDE_CARD('Who it is for', GUIDE_UL([

    // ---- Philosophy ----
    h += '<div class="section-label" id="m-phil">The Philosophy</div>';
    h += GUIDE_CARD('Five ideas the whole plan is built on', GUIDE_UL([

      '2. Fitness for real life. Carrying, sprinting, changing direction, gripping and balancing — General Physical Preparedness (GPP) — so your strength works outside the gym too.',
      '3. Durability. Warm-ups, tendon holds, mobility, balance work and deloads are part of the training, not optional extras. A plan you can follow for years beats one that breaks you in months.',
      '4. Slow, honest progress. Start light, add a little each week, stop with reps left in the tank. It looks boring on purpose — it is what keeps working.',

    h += '<div class="card" style="margin-bottom:12px">' + GUIDE_TABLE(['', 'Typical routine', 'Ironclad'], [
      ['Goal', 'Bigger muscles, a better look', 'Strength, fitness and durability'],
      ['Structure', 'Random sessions or "chest day, arm day" splits', 'Fixed 12 months in 3 phases, each building on the last'],
      ['Progress', 'Whatever feels right — often too much, too soon', 'Small weekly increases; miss reps and you repeat the weight'],
      ['Recovery', 'Usually ignored until something hurts', 'Forced deload every 4 weeks, a recovery day and a full rest day'],
      ['Joints', 'Little or no warm-up or tendon care', 'Warm-ups, tendon holds and balance work every week'],

    h += '<div class="banner" style="flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:20px"><strong class="mn-calloutlabel">The fair trade-off</strong><span>If your only goal is the maximum possible muscle size, a dedicated bodybuilding plan with more volume and isolation work will usually build size faster. Ironclad still builds good muscle, especially in the first phases, but it is built for being strong and capable first. Plenty of gym routines are well designed too — this is about what this plan puts first.</span></div>';

    // ---- How it was built ----
    h += '<div class="section-label" id="m-how">How the Plan Was Built</div>';
    h += GUIDE_CARD('The design decisions', GUIDE_UL([
      'Three phases over 12 months: Phase 1 builds technique and a base, Phase 2 adds load and single-limb strength, Phase 3 sharpens and tests it.',
      'Every week covers the basic movement patterns: squat, hinge, push, pull and carry.',

    // ---- Rules ----
    h += '<div class="section-label" id="m-rules">What to Do &amp; What to Avoid</div>';
    h += GUIDE_CARD('Do', GUIDE_UL([
      'Warm up and brace (breath in, ribs down, belly tight) before every heavy rep.',
      homeWords('Start Week 1 with the empty bar, even if you have trained before.'),
      'Leave about 2 reps in reserve on working sets.',
      'Log every session — the app can only guide you if it knows what you did.',
      'Take your deload when the app asks for it.',
      'Sleep 7–8 hours and eat protein at every meal.',
      'Drink water through the day, especially in hot weather.',
      'Film your lifts occasionally and compare to the photos in the Exercise Library.'
    ]));
    h += GUIDE_CARD('Avoid', GUIDE_UL([
      'Ego lifting — adding weight to impress someone or to chase a number.',
      'Adding weight after you missed reps.',
      'Training through sharp or joint pain. Muscle burn is normal; sharp pain is a stop sign.',
      'Skipping deloads or rest days because you "feel fine".',
      'Two heavy lifting days back to back.',
      'Training hungry, dehydrated or on very little sleep.',
      'Crash diets, steroids and unverified supplements.',
      'Comparing your Week 3 to someone else\'s Year 3.'
    ]));
    h += '<p class="note-line" style="margin-bottom:20px">This guide is general information, not medical advice. If you have an injury, a heart or blood-pressure condition, or any doubt, see a doctor before you start.</p>';

    // ---- Safety ----
    h += '<div class="section-label" id="m-safe">Safety &amp; Warning Signs</div>';
    h += GUIDE_CARD('Soreness vs. pain', GUIDE_UL([
      'Normal: dull muscle ache 1–2 days after training, mild tiredness, a burning feeling in the muscle during a hard set.',
      'Stop and lighten up: sharp, pinching or stabbing pain, pain in a joint or tendon, pain that gets worse as you continue, or pain that lasts more than a few days.',
      'Rule of thumb: if in doubt, lower the weight or skip that exercise for the day.'

    h += GUIDE_CARD('Stop training and get medical advice if you notice', GUIDE_UL([

      'A sudden sharp pain or a "pop" in a joint or muscle, followed by swelling.'
    ]));
    h += GUIDE_CARD('Training in hot weather', GUIDE_UL([
      'Drink water before, during and after sessions. Add a pinch of salt or have an ORS sachet if you sweat a lot.',
      'Do rucks, sprints and cardio early morning or after sunset, not in midday heat.',
      'Headache, nausea, cramps, confusion or stopping sweating are warning signs: stop, move to shade, cool down and drink.',

    // ---- Missed days ----
    h += '<div class="section-label" id="m-miss">When Life Interrupts</div>';
    h += '<p class="note-line">Illness, travel, work and Ramadan happen to everyone. Missing time is normal; quitting is the real problem. These are general rules of thumb, not a precise science.</p>';

    // ---- Diet ----
    h += '<div class="section-label" id="m-diet">Eating for the Plan (Pakistan)</div>';
    h += '<p class="note-line">Simple, affordable halal food you can find at any local shop or bazaar. These are guidelines, not a strict diet.</p>';
    h += GUIDE_CARD('The basics', GUIDE_UL([
      'Protein: roughly 1.6–2.0 g per kg of bodyweight per day. Example: 75 kg → about 120–150 g.',
      'Calories: eat around your maintenance to hold weight, about 200–300 kcal more to gain muscle, or about 300–500 less to lose fat slowly. Check your weight weekly in the Body tab and adjust.',

      'Water: about 2.5–3 litres a day, more in hot weather and on training days.'

    h += GUIDE_CARD('Easy protein sources (approximate)', GUIDE_TABLE(['Food', 'Portion', 'Protein'], [
      ['Egg', '1 whole egg', '~6 g'],
      ['Chicken (boti / breast)', '100 g cooked', '~28 g'],
      ['Beef or mutton', '100 g cooked', '~25 g'],
      ['Fish (rohu, pomfret, etc.)', '100 g cooked', '~20 g'],

  function renderManual() {
    var html = '<div class="body-scroll">';
    html += '<div class="manual-hero">' +
      '<div class="mh-title">Operation Ironclad</div>' +
      '<div class="mh-sub">Field Manual</div>' +
      '<div class="mh-stats">TAP A CHAPTER TO OPEN IT</div>' +
    '</div>';

    // The long guide text is written as one block; cut it into its sections.
    var G = {}, parts = renderManualGuide().split(/<div class="section-label" id="(m-[a-z0-9]+)">[^<]*<\/div>/);
    for (var gi = 1; gi < parts.length; gi += 2) G[parts[gi]] = parts[gi + 1];
    var home = state.profile && state.profile.equipment === "home";
    var chap = function(n, title, sub, body) {
      return '<details class="mchap" name="mchap"><summary><span class="mc-n">' + n + '</span><span class="mc-t"><b>' + title + '</b><i>' + sub + '</i></span><span class="mc-a">›</span></summary><div class="mc-body">' + body + '</div></details>';
    };
    var stdList = function(lv) {
      return '<ul class="item-list" style="margin:4px 0 0">' + standardStatus(lv).map(function(r){ return '<li>' + esc(r.label) + ': <strong>' + r.need + esc(r.unit) + (r.lower ? ' or less' : '') + '</strong></li>'; }).join('') + '</ul>';
    };

    // ---- 2. Stages ----
    var st = '';
    st += '<p class="note-line">The plan has five stages. You do not choose them by hand: the app moves you up when your logged numbers show you are ready.</p>';
    st += '<div class="card"><p class="mn-cardhead">1 · Foundation</p><p class="mn-cardbody">For anyone who cannot yet do the starting exercises. Your sessions use an easier version of each move (for example wall or knee push-ups before full push-ups). Reach the top of the target on every set, two sessions in a row, and the app moves you to the next version. If a version is clearly wrong for you, use the Too hard / Too easy buttons. Phase 1 starts by itself when you reach the starting level on every move. If your starting test already shows that level, you skip Foundation.</p></div>';
    [1,2,3].forEach(function(p){
      var ph = getPhases()[p];
      st += '<div class="card"><p class="mn-cardhead">' + (p + 1) + ' · ' + esc(ph.name) + '</p><p class="mn-cardbody" style="margin-bottom:8px">' + esc(ph.timeline) + '. ' + (p < 3 ? 'To unlock Phase ' + (p + 1) + ' you must pass every line of the ' + STANDARDS[p].name + ':' : 'The final test is the Ironclad Standard:') + '</p>' + stdList(p) + '</div>';
    });
    st += '<div class="card"><p class="mn-cardhead">5 · Ironclad</p><p class="mn-cardbody">The final level. You hold it when you pass every line of the Ironclad Standard in Phase 3. It is elite level, taken from the top score of the US Army fitness test and the “excellent” mark of the Russian Army. Expect it to take well over a year.</p></div>';
    st += '<div class="card"><p class="mn-cardhead">How your numbers are counted</p><ul class="item-list" style="margin:0"><li>Your best comes from the fitness test and from the reps you log in sessions.</li><li>The run time comes from the fitness test, or from a timed 2-mile run entered on Day 4.</li><li>See where you stand, and retake the test, on the Progress tab.</li><li>The numbers shown are for your age and sex. The full standard is for a man under 40; it is eased for older ages and for women.</li></ul></div>';

    // ---- 3. Week ----
    var wk = '<p class="note-line">Three lifting days, one conditioning day, one run day, one active-recovery day and one full rest day. Never two lifting days back to back.</p>';
    wk += '<div class="day-chips" style="margin-bottom:14px">';
    for (var d=1; d<=7; d++) { var t = DAY_TYPE[d]; wk += '<div class="day-chip ' + t + '"><div class="dc-n">D' + d + '</div><div class="dc-t">' + DAY_SHORT[t] + '</div></div>'; }
    wk += '</div>';
    wk += '<div class="card"><ul class="item-list" style="margin:0"><li><strong>Lift (Days 1, 3, 5):</strong> Workouts A and B take turns.</li><li><strong>GPP (Day 2):</strong> rucking one week, sprints and agility the next.</li><li><strong>Run (Day 4):</strong> builds toward the 2-mile test.</li><li><strong>Recovery (Day 6):</strong> mobility and light movement.</li><li><strong>Rest (Day 7):</strong> nothing scheduled.</li><li><strong>Deload:</strong> every 4 weeks the app switches on one lighter week (about 60% weight, fewer sets) by itself.</li><li><strong>Daily:</strong> hang from a bar for 30–60 seconds in total.</li></ul></div>';

    // ---- Phases ----
    var phaseBody = function(p) {
      var ph = getPhases()[p], o = '<p class="note-line">' + esc(ph.timeline) + ' — ' + esc(ph.note) + '</p>';
      ["A","B"].forEach(function(w){
        var k = ph.workouts[w];
        o += '<div class="card manual-workout"><div class="mw-head">' + esc(k.name) + '</div><div class="mw-body">';
        o += '<p class="mn-label">Warm-up</p><ul class="item-list" style="margin:0 0 12px">' + k.warmup.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul>';

    // ---- Conditioning ----
    var gp = '<div class="card"><p class="mn-cardhead">Tendon prep · every lift day</p><p class="mn-cardbody">Hold the position shown for 30 seconds at about 70% effort. 4 holds, 60 seconds rest. It is built into every workout, before the working sets.</p></div>';
    gp += '<div class="card"><p class="mn-cardhead">Rucking · Day 2, every other week</p><table class="moves-table"><tr><th>Phase</th><th>Load</th><th>Duration</th></tr>';
