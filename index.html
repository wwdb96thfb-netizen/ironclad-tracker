    gp += '</table></div>';
    gp += '<div class="card"><p class="mn-cardhead">Sprints &amp; agility · Day 2, the other weeks</p><ul class="item-list" style="margin:0"><li>Sprints: 6–8 × 20–30m, full effort, full recovery between.</li><li>Agility: 4–6 sets of 20–30 seconds between two markers 5m apart, staying low on each turn.</li></ul></div>';
    gp += '<div class="card"><p class="mn-cardhead">Run · Day 4</p><table class="moves-table"><tr><th>Phase</th><th>Session</th></tr>';
    [1,2,3].forEach(function(p){ gp += '<tr><td>Phase ' + p + '</td><td>' + esc(RUN_PLAN[p].title) + ': ' + esc(RUN_PLAN[p].stats.map(function(x){ return x.v + ' ' + x.l.toLowerCase(); }).join(', ')) + '</td></tr>'; });
    gp += '</table><p class="mn-cardbody" style="margin-top:8px">Once a month, run 2 miles (3.2 km) for time instead and enter it on the Day 4 screen.</p></div>';
    gp += '<div class="card"><p class="mn-cardhead">Balance · Days 2 &amp; 4</p><ul class="item-list" style="margin:0">' + BALANCE_ITEMS.map(function(it){ return '<li>'+esc(it)+'</li>'; }).join('') + '</ul></div>';

    // ---- Recovery ----
    var rc = '';
    RECOVERY_ITEMS.forEach(function(r){
      rc += '<div class="card"><p class="mn-cardhead">' + esc(r.name) + ' · ' + esc(r.dur) + '</p><p class="mn-cardbody">' + esc(r.desc) + '</p>';
      if (r.items && r.items.length) rc += '<ol style="margin:10px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-soft)">' + r.items.map(function(it){ return '<li style="margin-bottom:6px">'+esc(it)+'</li>'; }).join('') + '</ol>';
      rc += '</div>';
    });
    rc += '<div class="banner">Sleep 7–8 hours, every night.</div>';

    // ---- Library: one row per exercise, tap to open ----
    var libItem = function(name, photo, muscle) {
      var o = '<details class="mlib"><summary>' + esc(name) + '</summary><div class="mw-body">';
      if (EX_HOWTO[name]) o += '<p class="mn-cardbody">' + esc(EX_HOWTO[name]) + '</p>';
      if (photo) o += '<div class="sketch-wrap manual-sketch"><img class="ex-photo" src="' + photo + '" alt="' + esc(name) + '" loading="lazy"></div>';
      if (muscle) o += '<div class="sketch-wrap manual-sketch"><div class="mn-label">Muscles Worked</div><img class="ex-photo" src="' + muscle + '" alt="Muscles worked — ' + esc(name) + '" loading="lazy"></div>';
      return o + '</div></details>';
    };
    var seen = {}, names = [];
    [1,2,3].forEach(function(p){ ["A","B"].forEach(function(w){ getPhases()[p].workouts[w].exercises.forEach(function(e){ if (!seen[e.name]) { seen[e.name] = 1; names.push(e.name); } }); }); });
    Object.keys(LADDERS).forEach(function(k){ (LADDERS[k][home ? "home" : "gym"] || []).forEach(function(r){ if (!seen[r[0]]) { seen[r[0]] = 1; names.push(r[0]); } }); });
    if (!home) EX_PHOTOS.forEach(function(n){ if (!seen[n] && HOME_EX_NAMES.indexOf(n) === -1) { seen[n] = 1; names.push(n); } });
    var lb = '<p class="note-line">Every exercise in your plan, A to Z. Tap a name for the instructions and pictures.</p>';
    names.sort().forEach(function(n){ lb += libItem(n, EX_PHOTOS.indexOf(n) !== -1 ? exercisePhotoPath(n) : null, EX_MUSCLE_PHOTOS.indexOf(n) !== -1 ? musclePhotoPath(n) : null); });
    lb += '<p class="note-line" style="margin:18px 0 10px">Warm-up drills, holds and stretches:</p>';
    SUPPORT_MOVEMENTS.slice().sort().forEach(function(n){ var sp = resolvePhotoPath(n); if (sp) lb += libItem(n, sp, null); });

    var n = 0;
    html += chap(++n, 'Start Here', 'What this app is and who it is for', G['m-why'] || '');
    html += chap(++n, 'Stages &amp; Standards', 'Foundation to Ironclad, and what you must pass', st);
    html += chap(++n, 'Your Week', 'What happens on each of the 7 days', wk);
    html += chap(++n, 'Using a Session', 'How to read and log a workout', G['m-read'] || '');
    [1,2,3].forEach(function(p){ html += chap(++n, 'Phase ' + p + ' Workouts', esc((getPhases()[p].name.split('—')[1] || '').trim()), phaseBody(p)); });
    html += chap(++n, 'Conditioning', 'Rucking, sprints, running, balance', gp);
    html += chap(++n, 'Recovery', 'The recovery day and sleep', rc);
    html += chap(++n, 'Rules &amp; Safety', 'What to do, what to avoid, warning signs', (G['m-rules'] || '') + '<div class="section-label">Safety &amp; Warning Signs</div>' + (G['m-safe'] || '') + '<p class="note-line" style="margin-top:14px">' + esc(homeWords(GOLDEN_RULES)) + '</p>');
    html += chap(++n, 'Missed Days', 'Illness, travel, Ramadan and restarting', G['m-miss'] || '');
    html += chap(++n, 'Eating', 'Simple food guidance for the plan', G['m-diet'] || '');
    html += chap(++n, 'Why It Is Built This Way', 'The thinking behind the plan', (G['m-phil'] || '') + '<div class="section-label">Ironclad vs. Typical Gym Routines</div>' + (G['m-vs'] || '') + '<div class="section-label">How the Plan Was Built</div>' + (G['m-how'] || ''));
    html += chap(++n, 'Exercise Library', 'Every exercise with instructions and pictures', lb);

    html += '</div>';
    return html + renderBottomNav();
  }

  // Whether the photo/muscle reference is expanded for a given step, during
  // the live session. Deliberately NOT part of persisted state — it's a
  // throwaway UI preference that should default back to collapsed every
  // time a step is entered, not something worth saving to localStorage.
  var revealedPhotos = {};

  // Renders a <ul class="item-list"> where any item that resolves to a
  // known photo (a main exercise or a supporting movement) gets a small
  // tap-to-reveal "Photo" button of its own, collapsed by default — same
  // idea as the per-exercise toggle, just one per line instead of one per
  // step. `keyPrefix` keeps each step's reveal state from colliding with
  // any other step or list on screen.
  function renderNamedItemList(items, keyPrefix) {
    var html = '<ul class="item-list named-item-list">';
    items.forEach(function(it, i){
      var photoPath = resolvePhotoPath(it.photoName);
      var key = keyPrefix + '_' + i;
      var revealed = photoPath && !!revealedPhotos[key];
      html += '<li>';
      html += '<div class="ni-row"><span>' + esc(it.text) + '</span>';
      if (photoPath) {
        html += '<button class="ni-photo-btn" data-action="toggle-photo-reveal" data-key="' + key + '">' + (revealed ? 'Hide' : 'Photo') + '</button>';
      }
      html += '</div>';
      if (revealed) {
        html += '<div class="ni-photo"><img class="ex-photo" src="' + photoPath + '" alt="' + esc(it.photoName) + '" loading="lazy"></div>';
      }
      html += '</li>';
    });
    html += '</ul>';
    return html;
  }

  function renderGuidedStart(step, stepIdx) {
    var built = buildGuidedSeq(step);
    if (!built) return '';
    return '<button class="btn btn-primary btn-block guided-start" data-action="start-guided" data-step="' + stepIdx + '">' +
      '<span>Start Guided Timer · ' + guidedMinutesLabel(built.totalSec) + '</span></button>' +
      '<p class="guided-start-note">Runs every move in order — holds, rests and beeps — so you can just follow along.' + (step.kind === "warmup" ? ' Ramp-up sets aren\u2019t timed — do those with your working load.' : '') + '</p>';
  }

  function renderStepBody(step, stepIdx) {
    var html = '';
    if (state.toast) html += '<div class="banner toast-fixed">' + ICONS.check + '<span>' + esc(state.toast) + '</span></div>';
    if (state.session && state.session.deload) {
      html += '<div class="banner" style="background:var(--warn-bg);color:var(--rust);margin-bottom:14px">' + ICONS.warn + '<span><strong>Deload week</strong> — lighter sets, ~60% weight on the main lift.</span></div>';
    }
    if (step.kind === "exercise") {
      html += '<div class="step-kind">Exercise</div>';
      html += '<div class="ex-header"><div class="ex-icon">' + EX_ICONS[exerciseIconKey(step.title)] + '</div><h2 class="step-title">' + esc(step.title) + '</h2></div>';
      // The exercise picture is always shown. How-to text and the muscle
      // picture sit behind one tap so the screen stays short.
      var hasExPhoto = EX_PHOTOS.indexOf(step.title) !== -1;
      var hasMusclePhoto = EX_MUSCLE_PHOTOS.indexOf(step.title) !== -1;
      var howto = EX_HOWTO[step.title];
      if (hasExPhoto) {
        html += '<div class="sketch-wrap manual-sketch" style="margin-bottom:12px"><img class="ex-photo" src="' + exercisePhotoPath(step.title) + '" alt="' + esc(step.title) + '"></div>';
      }
      if (howto || hasMusclePhoto) {
        var revealed = !!revealedPhotos[stepIdx];
        var revLabel = howto && hasMusclePhoto ? 'How To Do It &amp; Muscles Worked' : (howto ? 'How To Do It' : 'Muscles Worked');
        html += '<button class="btn btn-ghost btn-block photo-reveal-btn" data-action="toggle-photo-reveal" data-step="' + stepIdx + '">' + (revealed ? 'Hide ' : 'Show ') + revLabel + '</button>';
        if (revealed) {
          html += '<div class="photo-reveal-panel">';
          if (howto) html += '<div class="instr-card"><div class="mn-label">How To Do It</div><p>' + esc(howto) + '</p></div>';
          if (hasMusclePhoto) {
            html += '<div class="sketch-wrap manual-sketch"><div class="mn-label">Muscles Worked</div><img class="ex-photo" src="' + musclePhotoPath(step.title) + '" alt="Muscles worked — ' + esc(step.title) + '" loading="lazy"></div>';
          }
          html += '</div>';
        }
      }
      if (state.profile && state.profile.equipment !== "home") {
        if (step.swappedFrom) {
          html += '<p class="note-line" style="margin-bottom:8px">Alternative to ' + esc(step.swappedFrom) + '.</p>' +
            '<button class="btn btn-ghost btn-block" style="margin-bottom:12px" data-action="toggle-ex-swap" data-orig="' + esc(step.swappedFrom) + '">' + ICONS.reset + '<span>Switch back to ' + esc(step.swappedFrom) + '</span></button>';
        } else if (GYM_ALT[step.title]) {
          html += '<button class="btn btn-ghost btn-block" style="margin-bottom:6px" data-action="toggle-ex-swap" data-orig="' + esc(step.title) + '"><span>No equipment? Swap to ' + esc(GYM_ALT[step.title].swap) + '</span></button>' +
            '<p class="note-line" style="margin-bottom:12px">A bodyweight exercise that trains the same movement.</p>';
        }
      }
      html += renderStats([{v:step.sets,l:"Sets × Reps"},{v:step.rest,l:"Rest"}]);
      if (step.isMainLift) {
        var lastW = state.settings.lastWeights && state.settings.lastWeights[step.title];
        var sessW = state.session.weights[stepIdx] || {};
        var deloadSuggested = null;
        if (state.session.deload && lastW && lastW.weight != null) {
          deloadSuggested = Math.max(0, Math.round((lastW.weight * 0.6) / MAIN_LIFT_STEP_KG) * MAIN_LIFT_STEP_KG);
        }
        var curVal = (sessW.weight !== undefined && sessW.weight !== null) ? sessW.weight
          : (state.session.deload ? (deloadSuggested != null ? deloadSuggested : "") : (lastW ? lastW.weight : ""));
        var hitAllVal = sessW.hitAll;
        var hint;
        if (state.session.deload) {
          hint = deloadSuggested != null
            ? "Deload week — try about " + fmtKg(deloadSuggested) + "kg (~60% of your usual " + fmtKg(lastW.weight) + "kg). Fewer sets, same reps."
            : "Deload week — use a clearly lighter weight than usual, about 60% of normal.";
        } else if (lastW && lastW.weight != null) {
          if (lastW.hitAll === false) {
            hint = "Last session you missed a rep at " + fmtKg(lastW.weight) + "kg — repeat that weight today.";
            if (state.settings.phase > 1) hint += " Progress slows down from here — holding a weight for a few weeks is normal, not a setback.";
          } else {
            hint = "You hit every rep last time at " + fmtKg(lastW.weight) + "kg — try " + fmtKg(lastW.weight + MAIN_LIFT_STEP_KG) + "kg today.";
          }
        } else {
          hint = "Log today's working weight — next time I'll tell you when to add weight.";
        }
        html += '<div class="weight-card">';
        html += '<div class="weight-hint">' + esc(hint) + '</div>';
        html += weightAdjRow(stepIdx, curVal);
        html += '<div class="hitall-toggle">' +
          '<button class="hitall-btn' + (hitAllVal===true?' active yes':'') + '" data-action="set-hitall" data-step="' + stepIdx + '" data-val="yes">' + ICONS.check + '<span>Hit all reps</span></button>' +
          '<button class="hitall-btn' + (hitAllVal===false?' active no':'') + '" data-action="set-hitall" data-step="' + stepIdx + '" data-val="no"><span>Missed a rep</span></button>' +
        '</div>';
        html += '</div>';
      }
      if (!step.isMainLift && usesWeight(step)) {
        var lw = state.settings.lastWeights && state.settings.lastWeights[step.title];
        var sw2 = state.session.weights[stepIdx] || {};
        var cv = (sw2.weight !== undefined && sw2.weight !== null) ? sw2.weight : (lw && lw.weight != null ? lw.weight : "");
        html += '<div class="weight-card"><div class="weight-hint">' + esc(lw && lw.weight != null
          ? "Last time you used " + fmtKg(lw.weight) + "kg. Use + or \u2212 to change it."
          : "Enter the weight you use today. Next time it will be filled in for you.") + '</div>' + weightAdjRow(stepIdx, cv) + '</div>';
      }
      if (step.ladderKey) {
        var lad = ladderFor(step.ladderKey), li = ladderLevel(step.ladderKey);
        html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span class="note-line" style="flex:1;margin:0">Step ' + (li + 1) + ' toward ' + esc(step.ladderGoal) + '</span>' +
          (li > 0 ? '<button class="btn btn-ghost" style="padding:8px 12px;font-size:13px" data-action="ladder-move" data-key="' + step.ladderKey + '" data-d="-1"><span>Too hard</span></button>' : '') +
          '<button class="btn btn-ghost" style="padding:8px 12px;font-size:13px" data-action="ladder-move" data-key="' + step.ladderKey + '" data-d="1"><span>Too easy</span></button></div>';
      }
      html += renderExHistory(step, stepIdx);
      var n = parseSetCount(step.sets);
      if (n > 0) {
        var unit = formatSetUnit(parseSetsUnit(step.sets));
        var rh = (repsLoggable(step) && !state.session.deload) ? repsHint(step) : ""; if (rh) html += '<p class="note-line" style="margin-bottom:8px">' + esc(rh) + '</p>';
        html += '<div class="set-rows">';
        for (var i=0;i<n;i++) {
          var filled = state.session.setDots[stepIdx + "_" + i];
          var rl = repsLoggable(step), rv = (state.session.reps && state.session.reps[stepIdx] && state.session.reps[stepIdx][i]);
          html += '<div class="set-row' + (filled?' filled':'') + '" data-action="toggle-dot" data-step="' + stepIdx + '" data-i="' + i + '">' +
            '<div class="sr-check">' + (filled ? ICONS.check : '') + '</div>' +
            '<div class="sr-label" style="flex:1">Set ' + (i+1) + ' · ' + esc(unit) + '</div>' +
            (rl ? '<input class="rep-in" type="number" inputmode="numeric" min="0" data-action="noop" data-input="set-reps" data-step="' + stepIdx + '" data-i="' + i + '" placeholder="' + repsUnitWord(step) + '" value="' + esc(rv != null ? rv : "") + '" aria-label="Set ' + (i+1) + ' ' + repsUnitWord(step) + ' done">' : '') +
          '</div>';
        }
        html += '</div>';
        var remaining = setsRemaining(step, stepIdx);
        html += '<p class="set-hint">' + (remaining > 0
          ? 'Tap each set as you finish it — ' + remaining + ' more to go before you can continue'
          : (stepMissing(step, stepIdx) || 'All sets done — you can continue')) + '</p>';
        html += renderRestTimer(stepIdx);
      }
    } else if (step.kind === "warmup" || step.kind === "stretch") {
      var label = step.kind === "warmup" ? "Warm-up" : "Stretch";
      html += '<div class="step-kind ' + step.kind + '">' + label + ' · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">' + label + '</h2>';
      html += renderGuidedStart(step, stepIdx);
      var expanded = step.kind === "warmup" ? expandNamedLines(step.items, WARMUP_LINE_MAP) : expandStretchLines(step.items);
      html += renderNamedItemList(expanded, step.kind + stepIdx);
    } else if (step.kind === "homealt") {
      html += '<div class="step-kind">Equipment</div>';
      html += '<h2 class="step-title">' + esc(step.title) + '</h2>';
      html += '<div class="instr-card"><p>' + esc(step.text) + '</p></div>';
      html += '<p class="note-line">The lifts that follow are already your home versions — tap through each step for the setup and your rest times.</p>';
    } else if (step.kind === "tendon") {
      html += '<div class="step-kind tendon">Tendon Prep · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">Tendon Prep</h2>';
      html += renderGuidedStart(step, stepIdx);
      html += '<div class="tendon-box"><p>' + esc(step.text) + '</p></div>';
      var tendonNames = TENDON_LINE_MAP[step.text];
      if (tendonNames && tendonNames.length) {
        html += renderNamedItemList(tendonNames.map(function(n){ return {text:n, photoName:n}; }), "tendon" + stepIdx);
      }
      html += renderStats([{v:"4×30s",l:"Hold"},{v:"60s",l:"Rest"}]);
      html += '<p class="note-line">Firm, controlled tension at roughly 70% effort — not a maximal grind. Done before your working sets.</p>';
      if (tendonNames && tendonNames.some(function(n){ return MAX_EFFORT_HOLDS[n]; })) html += '<p class="note-line">The 6-second holds are the exception: build up for 2 seconds, then push or pull as hard as you can. Keep breathing.</p>';
    } else if (step.kind === "gpp") {
      html += '<div class="step-kind">GPP · ' + esc(step.sub||'') + '</div>';
      html += '<h2 class="step-title">' + esc(step.title) + '</h2>';
      html += renderStats(step.stats);
      if (step.note) html += '<p class="note-line">' + esc(step.note) + '</p>';
    } else if (step.kind === "balance") {
      html += '<div class="step-kind">Balance · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">Balance</h2>';
      html += renderGuidedStart(step, stepIdx);
      html += renderNamedItemList(expandNamedLines(step.items, BALANCE_LINE_MAP), "balance" + stepIdx);
    } else if (step.kind === "cardio") {
      html += '<div class="step-kind">Run · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">' + esc(step.title || "Cardio") + '</h2>';
      html += renderStats(step.stats);
      if (step.note) html += '<p class="note-line">' + esc(step.note) + '</p>';
      if (step.runLog) {
        var brun = state.settings.bestRun, srun = state.session && state.session.runMin;
        html += '<div class="instr-card"><p><b>Once a month: 2-mile test.</b> Instead of today\u2019s run, warm up and run 2 miles (3.2 km) as fast as you can. Enter your time below in whole minutes, rounded up.' + (brun ? ' Your best so far: ' + brun + ' min.' : '') + '</p>' +
          '<input class="field-input" type="number" inputmode="numeric" min="5" max="60" data-input="run-time" placeholder="2-mile time in minutes (optional)" value="' + esc(srun != null ? srun : "") + '" style="margin-top:10px"></div>';
      }
    } else if (step.kind === "recovery") {
      html += '<div class="step-kind">Recovery · ' + esc(step.sub) + '</div>';
      html += '<h2 class="step-title">' + esc(step.title) + '</h2>';
      html += renderGuidedStart(step, stepIdx);
      html += '<div class="instr-card"><p>' + esc(step.text) + '</p></div>';
      if (resolvePhotoPath(step.title)) {
        html += renderNamedItemList([{text: step.title, photoName: step.title}], "recovtitle" + stepIdx);
      }
      if (step.items && step.items.length) {
        html += renderNamedItemList(expandNamedLines(step.items, RECOVERY_SUBITEM_MAP), "recov" + stepIdx);
      }
    } else if (step.kind === "rest") {
      html += '<div class="step-kind">Rest</div>';
      html += '<h2 class="step-title">Full Rest</h2>';
      html += '<div class="instr-card"><p>' + esc(step.text) + '</p></div>';
    }
    return html;
  }

  function renderSession() {
    var sess = state.session;
    var step = sess.steps[sess.idx];
    var isLast = sess.idx === sess.steps.length - 1;
    var locked = setsRemaining(step, sess.idx) > 0;
    var html = '<div class="body-scroll with-bottombar">' + renderStepBody(step, sess.idx) + '</div>';
    html += '<div class="bottombar"><div class="bottombar-inner">';
    html += '<button class="btn btn-primary btn-block" data-action="complete-step"' + (locked ? ' disabled aria-disabled="true"' : '') + '>' + ICONS.check + '<span>' + (isLast ? 'Finish Day' : 'Complete') + '</span></button>';
    html += '</div></div>';
    return html;
  }

  function renderConfirmOverlay() {
    var c = state.confirm;
    if (!c && state.resetChoice) {
      return '<div class="overlay" data-action="close-reset-choice"><div class="overlay-sheet" data-action="noop"><h3>Reset what?</h3>' +
        '<p>Pick one. You will get a final confirmation before anything is deleted.</p>' +
        '<div style="display:flex;flex-direction:column;gap:10px">' +
        '<button class="btn btn-ghost btn-block" data-action="reset-plan-ask"><span>Restart plan from Day 1 (keep my log)</span></button>' +
        '<button class="btn btn-ghost btn-block" data-action="reset-progress-ask"><span>Progress only (keep my profile)</span></button>' +
        '<button class="btn btn-danger btn-block" data-action="reset-all-ask"><span>Complete app (start from scratch)</span></button>' +
        '<button class="btn btn-ghost btn-block" data-action="close-reset-choice"><span>Cancel</span></button></div></div></div>';
    }
    if (!c) return '';
    return '<div class="overlay" data-action="dismiss-confirm">' +
      '<div class="overlay-sheet" data-action="noop">' +
        '<h3>' + esc(c.title) + '</h3>' +
        '<p>' + c.body + '</p>' +
        '<div class="ov-actions"><button class="btn btn-ghost" style="flex:1" data-action="dismiss-confirm">' + esc(c.cancelLabel || 'Cancel') + '</button>' +
        '<button class="btn btn-danger" style="flex:1" data-action="confirm-action">' + esc(c.confirmLabel) + '</button></div>' +
      '</div></div>';
  }

  function renderSummary() {
    var sess = state.session;
    var html = '<div class="body-scroll">';
    html += '<div class="summary-hero"><div class="check-circle">' + ICONS.checkBig + '</div>' +
      '<h2>Day ' + sess.dayNum + ' Done</h2><p>' + esc(sess.headline) + '</p></div>';
    html += '<div class="card"><ul class="summary-list">';
    sess.steps.forEach(function(s){ html += '<li>' + ICONS.check + '<span>' + esc(s.title) + '</span></li>'; });
    html += '</ul></div>';
    html += '</div>';
    html += '<div class="bottombar"><div class="bottombar-inner">';
    html += '<button class="btn btn-primary btn-block" data-action="save-finish">Save &amp; Return Home</button>';
    html += '</div></div>';
    return html;
  }

  /* ============================================================
     MAIN RENDER
  ============================================================ */
  function render() {
    var app = document.getElementById("app");
    if (!state.profile && !state.welcomed) {
      app.innerHTML = renderWelcome();
      return;
    }
    if (!state.profile) {
      app.innerHTML = '<div class="topbar"><div class="tb-title-wrap"><div class="tb-main">Operation Ironclad</div><div class="tb-sub">TRACKER</div></div></div>' + renderOnboarding();
      return;
    }
    if (state.screen !== "session" && state.screen !== "summary" && (!state.fitTest || state.retest)) {
      app.innerHTML = renderFitTest();
      return;
    }
    var body;
    if (state.screen === "session") body = renderSession();
    else if (state.screen === "summary") body = renderSummary();
    else if (state.screen === "log") body = renderLog();
    else if (state.screen === "manual") body = renderManual();
    else if (state.screen === "profile") body = renderProfile();
    else if (state.screen === "settings") body = renderSettings();
    else body = renderHome();
    app.innerHTML = renderTopbar() + body + renderConfirmOverlay() + renderGuidedOverlay();
  }

  // For an in-place update (ticking a set, flipping a toggle, picking an
  // onboarding answer) that redraws the same screen rather than navigating
  // to a new one — render() always rebuilds a fresh scroll container, which
  // would otherwise silently snap back to the top every time.
  function renderKeepScroll() {
    var scroller = document.querySelector(".body-scroll");
    var top = scroller ? scroller.scrollTop : 0;
    render();
    var next = document.querySelector(".body-scroll");
    if (next) next.scrollTop = top;
  }

  /* ============================================================
     EVENTS
  ============================================================ */
  document.getElementById("app").addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "go-home") { state.screen = "home"; render(); }
    else if (action === "go-log") { state.screen = "log"; render(); }
    else if (action === "go-manual") {
      state.screen = "manual"; render();
      var scroller = document.querySelector(".body-scroll");
      if (scroller) scroller.scrollTop = 0;
    }
    else if (action === "manual-jump") {
      var target = document.getElementById(el.getAttribute("data-target"));
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    else if (action === "go-profile") { state.screen = "profile"; render(); }
    else if (action === "set-theme") { lsSet(LS_THEME_KEY, el.getAttribute("data-val")); applyTheme(); render(); }
    else if (action === "go-settings") { state.screen = "settings"; render(); }
    else if (action === "mark-deload-taken") { markDeloadTaken(); }
    else if (action === "add-measurement") { addMeasurementFromForm(); }
    else if (action === "open-delete-measurement-confirm") { openDeleteMeasurementConfirm(el.getAttribute("data-id"), el.getAttribute("data-date")); }
    else if (action === "set-hitall") { setStepHitAll(parseInt(el.getAttribute("data-step"),10), el.getAttribute("data-val")==="yes"); }
    else if (action === "toggle-photo-reveal") {
      var ps = el.getAttribute("data-key") || el.getAttribute("data-step");
      revealedPhotos[ps] = !revealedPhotos[ps];
      renderKeepScroll();
    }
    else if (action === "start-next") { startSession(state.settings.nextDayNumber); }
    else if (action === "start-day") { startSession(parseInt(el.getAttribute("data-day"),10)); }
    else if (action === "stage-info") {
      var stg = el.getAttribute("data-stage");
      state.toast = stg === "foundation"
        ? (foundationActive() ? "You are in the Foundation stage. Keep training: the app moves you into Phase 1 by itself when you reach the starting level on every exercise." : "Foundation is complete. You are past the starting level.")
        : (state.settings.phase === 3 && standardMet(3) ? "You hold the Ironclad Standard. Keep it." : "Ironclad is the final level. You earn it by passing every line of the Ironclad Standard in Phase 3.");
      render(); setTimeout(function(){ state.toast = null; render(); }, 6000);
    }
    else if (action === "set-phase") {
      var targetPhase = parseInt(el.getAttribute("data-phase"),10);
      var curPh = state.settings.phase;
      if (targetPhase > curPh && foundationActive()) { state.toast = "You are still in the Foundation stage. Keep training: Phase 1 starts by itself when you are ready."; render(); setTimeout(function(){ state.toast = null; render(); }, 5000); }
      else if (targetPhase > curPh && !standardMet(targetPhase - 1)) { state.toast = "Phase " + targetPhase + " is locked. You must pass every line of the " + STANDARDS[targetPhase - 1].name + " first. See the list on the Progress tab."; render(); setTimeout(function(){ state.toast = null; render(); }, 6000); }
      else setPhase(targetPhase);
    }
    else if (action === "start-guided") { startGuided(parseInt(el.getAttribute("data-step"),10)); }
    else if (action === "guided-pause") { guidedTogglePause(); }
    else if (action === "guided-skip") { guidedAdvance(true); }
    else if (action === "guided-back") { guidedBack(); }
    else if (action === "guided-exit") { stopGuided(); renderKeepScroll(); }
    else if (action === "guided-finish") { stopGuided(); completeStep(); }
    else if (action === "complete-step") { completeStep(); }
    else if (action === "back-step") { backStep(); }
    else if (action === "exit-session") { openExitConfirm(); }
    else if (action === "dismiss-confirm") { state.confirm = null; render(); }
    else if (action === "confirm-action") { runConfirm(); }
    else if (action === "open-reset-confirm") { openResetConfirm(); }
    else if (action === "ladder-move") {
      var lm = moveLadder(el.getAttribute("data-key"), parseInt(el.getAttribute("data-d"),10));
      if (lm) {
        var ss = state.session;
        if (ss && ss.steps) {
          var fr = buildSteps(ss.dayNum, ss.phase, ss.liftType, ss.gppType, ss.deload);
          if (fr.length === ss.steps.length) {
            fr.forEach(function(st2, i2){ if (st2.title !== ss.steps[i2].title) { Object.keys(ss.setDots).forEach(function(k){ if (k.indexOf(i2 + "_") === 0) delete ss.setDots[k]; }); if (ss.reps) delete ss.reps[i2]; } });
            ss.steps = fr;
          }
        }
        revealedPhotos = {}; state.histOpen = null;
        state.toast = lm; render(); setTimeout(function(){ state.toast = null; render(); }, 4000);
      }
    }
    else if (action === "wt-adj") { adjustStepWeight(parseInt(el.getAttribute("data-step"),10), parseInt(el.getAttribute("data-d"),10)); }
    else if (action === "toggle-hist") { var hi = parseInt(el.getAttribute("data-step"),10); state.histOpen = (state.histOpen === hi) ? null : hi; renderKeepScroll(); }
    else if (action === "fit-save") { saveFitTest(false); }
    else if (action === "fit-skip") { saveFitTest(true); }
    else if (action === "fit-retake") { state.fitDraft = {}; state.retest = true; state.screen = "home"; render(); }
    else if (action === "toggle-alt-panel") { var ai = parseInt(el.getAttribute("data-step"), 10); state.altOpen = (state.altOpen === ai) ? null : ai; render(); }
    else if (action === "toggle-ex-swap") { toggleExSwap(el.getAttribute("data-orig")); }
    else if (action === "open-reset-choice") { openResetChoice(); }
    else if (action === "reset-plan-ask") { state.resetChoice = false; openResetConfirm(); }
    else if (action === "close-reset-choice") { state.resetChoice = false; render(); }
    else if (action === "reset-progress-ask") { openResetProgressConfirm(); }
    else if (action === "reset-all-ask") { openResetAllConfirm(); }
    else if (action === "open-clearlog-confirm") { openClearLogConfirm(); }
    else if (action === "open-delete-confirm") { openDeleteConfirm(el.getAttribute("data-id"), el.getAttribute("data-headline")); }
    else if (action === "open-edit-profile-confirm") { openEditProfileConfirm(); }
    else if (action === "save-finish") { finishDay(); }
    else if (action === "toggle-dot") { toggleSetDot(parseInt(el.getAttribute("data-step"),10), parseInt(el.getAttribute("data-i"),10)); }
    else if (action === "skip-rest") { dismissRestTimer(); }
    else if (action === "onb-set-sex") { state.onboardDraft.sex = el.getAttribute("data-val"); renderKeepScroll(); }
    else if (action === "onb-set-level") { state.onboardDraft.level = el.getAttribute("data-val"); renderKeepScroll(); }
    else if (action === "onb-set-equipment") { state.onboardDraft.equipment = el.getAttribute("data-val"); renderKeepScroll(); }
    else if (action === "onb-submit") { submitOnboarding(); }
    else if (action === "welcome-start") { state.welcomed = true; render(); }
  });

  document.getElementById("app").addEventListener("input", function(e){
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var kind = el.getAttribute("data-input");
    if (kind === "set-weight") {
      setStepWeight(parseInt(el.getAttribute("data-step"),10), el.value);
    } else if (kind === "set-reps") {
      setStepReps(parseInt(el.getAttribute("data-step"),10), parseInt(el.getAttribute("data-i"),10), el.value);
    } else if (kind === "run-time") {
      if (state.session) { var rv = parseInt(el.value, 10); state.session.runMin = (!isNaN(rv) && rv >= 5 && rv <= 60) ? rv : null; }
    } else if (kind === "fit") {
      if (!state.fitDraft) state.fitDraft = {};
      state.fitDraft[el.getAttribute("data-k")] = el.value;
    } else if (kind === "onb-age") {
      state.onboardDraft.age = el.value;
    } else if (kind === "onb-weight") {
      state.onboardDraft.weight = el.value;
    }
  });

  // Typing a number into a set's box ticks that set once you leave the box.
  document.getElementById("app").addEventListener("change", function(e){
    var el = e.target;
    if (!el || !el.getAttribute || el.getAttribute("data-input") !== "set-reps" || el.value === "") return;
    var si = parseInt(el.getAttribute("data-step"),10), i = parseInt(el.getAttribute("data-i"),10);
    if (state.session && !state.session.setDots[si + "_" + i]) toggleSetDot(si, i);
  });

  render();
  initDb();
})();
</script>

<script>
  // Offline support: cache this page (and its fonts/icons) on first load so
  // it keeps working with no signal. Registration failure (unsupported
  // browser, file:// origin, etc.) is silently ignored — the app still runs,
  // just without the offline cache.
  //
  // UPDATES: a future deploy with a bumped CACHE_NAME installs in the
  // background and takes over automatically (see service-worker.js) — safe
  // here since nothing on screen changes mid-session just from that. No tap
  // needed: once it's taken over, the app reloads itself onto the new
  // version (unless you're mid-typing into a field, in which case it waits
  // until you're done so nothing you entered gets lost), then shows a
  // toast that says it updated and fades out on its own.
  function showIroncladUpdatedToast() {
    var el = document.getElementById("sw-update-toast");
    if (!el) return;
    el.classList.remove("fade-out");
    el.hidden = false;
    setTimeout(function(){ el.classList.add("fade-out"); }, 2200);
    setTimeout(function(){
      el.hidden = true;          // actually removes it from layout (see [hidden] rule above)
      el.classList.remove("fade-out"); // reset opacity for next time, now safely off-screen
    }, 2700);
  }

  // Guards against an update-reload loop (e.g. if the host's CDN briefly
  // serves inconsistent copies of service-worker.js right after a deploy,
  // which can otherwise look like a "new" version on every single load).
  var RELOAD_COOLDOWN_MS = 30000;
  function ironcladRecentlyReloaded() {
    try {
      var t = sessionStorage.getItem("ironclad_last_reload_at");
      return !!t && (Date.now() - parseInt(t, 10)) < RELOAD_COOLDOWN_MS;
    } catch (e) { return false; }
  }

  var ironcladReloaded = false;
  function ironcladReloadNow() {
    if (ironcladReloaded) return;
    ironcladReloaded = true;
    try {
      sessionStorage.setItem("ironclad_just_updated", "1");
      sessionStorage.setItem("ironclad_last_reload_at", String(Date.now()));
    } catch (e) {}
    window.location.reload();
  }

  function ironcladReloadWhenSafe() {
    var active = document.activeElement;
    var midEntry = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA") && active.value;
    if (midEntry) {
      active.addEventListener("blur", function onBlur(){
        active.removeEventListener("blur", onBlur);
        ironcladReloadNow();
      });
      setTimeout(ironcladReloadNow, 15000); // safety net if blur never fires
      return;
    }
    ironcladReloadNow();
  }

  try {
    if (sessionStorage.getItem("ironclad_just_updated") === "1") {
      sessionStorage.removeItem("ironclad_just_updated");
      showIroncladUpdatedToast();
    }
  } catch (e) {}

  // Captured BEFORE registering, not re-read later: service-worker.js calls
  // clients.claim() in its own activate handler, which can hand this very
  // page a controller within a second of a plain first-ever install — so
  // checking navigator.serviceWorker.controller *at update time* can't
  // reliably tell "first install" from "a real update", and was wrongly
  // treating every fresh app open as an update (reloading + showing the
  // toast every single time, whether anything had changed or not). Whether
  // a controller already existed the moment this page started loading is
  // the only thing that actually distinguishes the two.
  var hadControllerAtLoad = !!navigator.serviceWorker.controller;

  if ("serviceWorker" in navigator) {
    var ironcladSwReg = null;

    window.addEventListener("load", function(){
      // updateViaCache: "none" tells the browser to never serve
      // service-worker.js itself from its ordinary HTTP cache when checking
      // for an update -- without this, a stale cached copy of that one file
      // (served by GitHub Pages' CDN) can make every update check see no
      // change at all, even though the real file on the server is newer.
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then(function(reg){
        ironcladSwReg = reg;
        reg.addEventListener("updatefound", function(){
          var fresh = reg.installing;
          if (!fresh) return;
          fresh.addEventListener("statechange", function(){
            // Only reload for a genuine update (this page was already being
            // controlled by a previous worker when it loaded). The cooldown
            // guard is a second line of defense against any reload-loop.
            if (fresh.state === "activated" && hadControllerAtLoad && !ironcladRecentlyReloaded()) {
              ironcladReloadWhenSafe();
            }
          });
        });
      }).catch(function(){});
    });

    // iOS standalone ("Add to Home Screen") apps often resume a suspended
    // page instead of truly reloading it when reopened, so the "load" event
    // above and its one-time register() call may simply never fire again on
    // a reopen. Explicitly asking the existing registration to re-check for
    // an update every time the app becomes visible again closes that gap.
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible" && ironcladSwReg) {
        ironcladSwReg.update().catch(function(){});
      }
    });
  }
</script>

</body>
